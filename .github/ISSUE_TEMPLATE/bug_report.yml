name: "🐛 Report A Bug"
description: "Tell us when something in Caffoot Lite is not working as expected."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Caffoot Lite! You do not need to be a developer to report a bug.

        Please explain what happened in your own words. Screenshots are welcome, but optional. Categories cover published and forthcoming features; availability depends on your version.

        **Security or privacy concern?** Please do not publish passwords, authentication codes, tokens, private IP addresses, personal data or exploit details here. Read our [Security Reporting Guide](https://github.com/Caffoot/Caffoot-Lite/blob/main/SECURITY.md) first.
  - type: input
    id: version
    attributes:
      label: "Caffoot Lite Version"
      description: "Check My Account > About Caffoot Lite. For an unreleased review build, also include its source commit or private image reference; the published release label alone does not identify it. Do not share private registry credentials."
      placeholder: "Copy the version or review commit you are using"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Where Did It Happen?"
      options:
        - "Installation / Docker Compose / Portainer"
        - "Sign-In & MFA"
        - "Dashboard"
        - "Device Inventory"
        - "Staff Members & Departments"
        - "My Equipment / Shared Equipment"
        - "IT Assets / Stock / Custody"
        - "Suppliers / Purchasing / Equipment Lifecycle"
        - "Service Desk / My Tickets / Department Tickets"
        - "Service Desk Working Hours / Time Zone / Reports"
        - "Email / Notifications / Templates / Branding"
        - "IPAM"
        - "Network Racks"
        - "Audit Trail / Change History"
        - "Users & Permissions"
        - "My Account"
        - "Settings & Data / Optional Features"
        - "Import / Backup / Upgrade / Recovery"
        - "Help & Guides / About"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What Happened?"
      description: "Tell us what went wrong. You can use everyday language."
      placeholder: "I opened a rack, selected a device and..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What Did You Expect?"
      description: "What did you think should happen?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "How Can We Reproduce It?"
      description: "List the steps you followed if you can. It's fine if you're unsure."
      placeholder: |
        1. Open...
        2. Choose...
        3. Observe...
    validations:
      required: false
  - type: textarea
    id: installation
    attributes:
      label: "Installation Details"
      description: "Optional. Tell us whether you use Docker, Portainer, a reverse proxy or a particular browser."
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: "Screenshots Or Additional Information"
      description: "Optional. Before sharing logs or screenshots, remove credentials, tokens, private network addresses and personal details."
    validations:
      required: false
