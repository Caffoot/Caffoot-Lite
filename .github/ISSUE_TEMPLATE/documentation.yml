name: "📖 Improve Documentation"
description: "Help us make the instructions, examples or contributor guides clearer."
title: "[Documentation]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make Caffoot Lite easier to understand!

        You don't need to be a programmer or know how to edit GitHub files. Reporting an unclear instruction, missing example or spelling mistake is a valuable contribution.
  - type: dropdown
    id: kind
    attributes:
      label: "What Could Be Improved?"
      options:
        - "An Instruction Is Confusing"
        - "A Step Is Missing"
        - "A Screenshot Or Example Would Help"
        - "A Link Or Instruction Is Incorrect"
        - "A Spelling Or Wording Issue"
        - "Developer Documentation Or Code Comments"
        - "Other"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: "Where Did You Find It?"
      description: "Optional. Paste a link or tell us which page or section you were reading."
      placeholder: "For example, the IPAM guide or My Account > Help & Guides"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: "What Was Unclear Or Missing?"
      description: "A short explanation is enough."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "How Could We Improve It?"
      description: "Optional. You can suggest new wording or an example, but you don't have to."
    validations:
      required: false
