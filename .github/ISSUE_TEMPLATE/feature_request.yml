name: "💡 Suggest A Feature / Future Request"
description: "Share an idea for making Caffoot Lite more useful."
title: "[Feature Request]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome ideas from everyone, whether or not you write code.

        Tell us about the problem you would like to solve. You do not need a complete technical design.

        Check the [Future Ideas Index #222](https://github.com/Caffoot/Caffoot-Lite/issues/222) and existing issues first. Add your thoughts to an existing issue when appropriate; otherwise, open **one issue per idea** here.

        We will discuss and record decisions in that issue. No technical design is needed. The project owner decides what gets built and when.
  - type: textarea
    id: problem
    attributes:
      label: "What Problem Would This Solve?"
      description: "Describe the task or difficulty in plain language."
      placeholder: "When I manage several racks, it is difficult to..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "What Would You Like Caffoot Lite To Do?"
      description: "Describe your idea in your own words. A rough suggestion is absolutely fine."
    validations:
      required: true
  - type: textarea
    id: benefits
    attributes:
      label: "Who Would This Help?"
      description: "Optional. For example, home-lab users, small IT teams, administrators or read-only users."
    validations:
      required: false
  - type: textarea
    id: examples
    attributes:
      label: "Examples, Sketches Or Other Thoughts"
      description: "Optional. Screenshots, drawings or links can help explain your idea."
    validations:
      required: false
