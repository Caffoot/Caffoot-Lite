name: "❓ Ask A Question"
description: "Ask for help using, installing or understanding Caffoot Lite."
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome, including questions from people just getting started.

        Please check our [Installation Guide](https://github.com/Caffoot/Caffoot-Lite/blob/main/INSTALLATION.md) and [Feature Guides](https://github.com/Caffoot/Caffoot-Lite/blob/main/docs/how-tos/features-and-instructions/README.md) if they might help. You can still ask here if you get stuck.

        Categories cover published and forthcoming features; availability depends on your version. Please do not post passwords, tokens, authentication codes or private information. For a security or privacy concern, use our [Security Reporting Guide](https://github.com/Caffoot/Caffoot-Lite/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: "Caffoot Lite Version Or Review Commit"
      description: "Optional. Check My Account > About Caffoot Lite; for an unreleased review build, include the source commit or private image reference without credentials."
      placeholder: "Copy the version or review commit you are using"
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: "What Is Your Question About?"
      options:
        - "Installation / Docker Compose / Portainer"
        - "Sign-In & MFA"
        - "Dashboard"
        - "Audit Trail / Change History"
        - "Settings & Data / Optional Features"
        - "Help & Guides / About"
        - "Device Inventory"
        - "Staff Members & Departments"
        - "My Equipment / Shared Equipment"
        - "IT Assets / Stock / Custody"
        - "Suppliers / Purchasing / Equipment Lifecycle"
        - "Service Desk / My Tickets / Department Tickets"
        - "Service Desk Working Hours / Time Zone / Reports"
        - "Email / Notifications / Templates / Branding"
        - "IPAM"
        - "Network Racks"
        - "Users & Permissions"
        - "My Account"
        - "Import / Backup / Upgrade / Recovery"
        - "Contributing To Caffoot Lite"
        - "Something Else"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: "How Can We Help?"
      description: "Ask in your own words. No technical background is required."
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: "What Have You Tried?"
      description: "Optional. This can help others give you a more useful answer."
    validations:
      required: false
