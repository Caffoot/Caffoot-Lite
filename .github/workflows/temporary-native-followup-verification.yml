name: Temporary native follow-up verification

on:
  pull_request:
    branches: [milestone-1]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  focused-native-followups:
    if: github.head_ref == 'milestone-01-native-followups' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing isolated Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tests" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check exact wording and capture two affected screens
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
          CAFFOOT_FOLLOWUP_WORDING: '1'
          CAFFOOT_BATCH2_OUTPUT: ${{ runner.temp }}/native-followup-evidence
          CAFFOOT_BATCH4_OUTPUT: ${{ runner.temp }}/native-followup-evidence
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          export CAFFOOT_CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/milestone-01-correction-batch-2.cjs
          node tests/milestone-01-correction-batch-4.cjs
          test -s "$CAFFOOT_BATCH2_OUTPUT/staff-details-left-company.png"
          test -s "$CAFFOOT_BATCH4_OUTPUT/audit-values-unavailable.png"
          printf "Revision: %s\n" "$EXPECTED_REVISION" > "$CAFFOOT_BATCH2_OUTPUT/Provenance.txt"
          "$CAFFOOT_CHROMIUM_PATH" --version >> "$CAFFOOT_BATCH2_OUTPUT/Provenance.txt"
          (cd "$CAFFOOT_BATCH2_OUTPUT" && sha256sum *.png >> Provenance.txt)
      - name: Reproduce retained-focus refresh suppression only
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_FOCUS_DIAGNOSTIC: '1'
        run: node tests/milestone-01-correction-batch-3.cjs
      - name: Upload verified wording screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-followup-wording-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/native-followup-evidence/
          if-no-files-found: error
          retention-days: 14
