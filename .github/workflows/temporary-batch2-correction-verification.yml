name: Temporary Batch 2 correction verification

on:
  pull_request:
    branches: [milestone-1]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  focused-batch2:
    if: github.head_ref == 'fix/milestone-01-sidebar-device-staff-corrections' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tests" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Reproduce matched-viewport baseline and verify the focused corrections
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_BATCH2_OUTPUT: ${{ runner.temp }}/batch2-correction-evidence
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          mkdir -p "$CAFFOOT_BATCH2_OUTPUT"
          export CAFFOOT_CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          git worktree add --detach "$RUNNER_TEMP/batch2-baseline" da1be338b1842bab02e162963fdf46da3b70adcf
          cp tests/milestone-01-correction-batch-2.cjs "$RUNNER_TEMP/batch2-baseline/tests/"
          (cd "$RUNNER_TEMP/batch2-baseline" && CAFFOOT_BATCH2_BASELINE=1 node tests/milestone-01-correction-batch-2.cjs)
          node tests/milestone-01-correction-batch-2.cjs
          for image in sidebar-it-assets-overview-light sidebar-it-assets-overview-dark sidebar-device-inventory-light sidebar-device-inventory-dark virtual-device-light virtual-device-dark physical-device-assigned staff-active-light staff-active-dark staff-left-company-light staff-left-company-dark; do
            test -s "$CAFFOOT_BATCH2_OUTPUT/$image.png"
          done
          printf "Revision: %s\n" "$EXPECTED_REVISION" > "$CAFFOOT_BATCH2_OUTPUT/Provenance.txt"
          "$CAFFOOT_CHROMIUM_PATH" --version >> "$CAFFOOT_BATCH2_OUTPUT/Provenance.txt"
          (cd "$CAFFOOT_BATCH2_OUTPUT" && sha256sum *.png >> Provenance.txt)
      - name: Upload verified screenshot evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batch2-correction-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/batch2-correction-evidence/
          if-no-files-found: error
          retention-days: 14
