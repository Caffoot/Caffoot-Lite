name: Next backend checks

on:
  push:
    branches: [Next]
    paths:
      - "next/**"
      - ".github/workflows/next-backend.yml"
  pull_request:
    paths:
      - "next/**"
      - ".github/workflows/next-backend.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q backend tests
      - name: Run isolated backend tests
        run: python -m unittest discover -s tests -v
