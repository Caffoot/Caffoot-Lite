# One-off verification for stacked draft PR #428 ONLY.
# The exact branch and path filters cause this to run only when THIS file is
# initially committed (or explicitly edited) on the PR #428 branch.
# Remove this temporary workflow before merging PR #428 into PR #418.
name: PR 428 one-off UK date and Device Type evidence

on:
  push:
    branches:
      - fix/426-427-uk-dates-device-type-names
    paths:
      - .github/workflows/pr-428-one-off-verification.yml

permissions:
  contents: read

jobs:
  pr-428-only:
    if: github.repository == 'Caffoot/Caffoot-Lite' && github.ref == 'refs/heads/fix/426-427-uk-dates-device-type-names'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out this exact PR revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check UK date conversion, validation and calendar focus
        run: node tests/uk-date-controls.cjs
      - name: Run focused Equipment Lifecycle backend tests
        run: python -m unittest discover -s tests -p 'test_equipment_lifecycle.py' -v
      - name: Install isolated Chromium testing tools
        id: browser_tools
        run: |
          npm install --prefix "$RUNNER_TEMP/pr428-browser" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pr428-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run actual Equipment Lifecycle journey and capture corrected UI
        env:
          NODE_PATH: ${{ runner.temp }}/pr428-browser/node_modules
          CAFFOOT_LIFECYCLE_OUTPUT: ${{ runner.temp }}/pr428-lifecycle
        run: node tests/equipment-lifecycle-interface.cjs
      - name: Upload fictional Lifecycle and open-calendar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr428-lifecycle-desktop-mobile-light-dark-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr428-lifecycle/*.png
            ${{ runner.temp }}/pr428-lifecycle/captures.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Run actual Stock Intake journey and capture corrected UI
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        env:
          NODE_PATH: ${{ runner.temp }}/pr428-browser/node_modules
          CAFFOOT_STOCK_OUTPUT: ${{ runner.temp }}/pr428-stock
        run: node tests/stock-intake-interface.cjs
      - name: Upload fictional Stock Intake screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr428-stock-desktop-mobile-light-dark-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr428-stock/*.png
            ${{ runner.temp }}/pr428-stock/browser-results.json
          if-no-files-found: ignore
          retention-days: 14
