name: Temporary authentication correction verification

on:
  pull_request:
    branches: [milestone-1]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  focused-recovery:
    if: github.head_ref == 'fix/milestone-01-authentication-corrections' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tests" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Execute real HTTPS recovery regression and capture evidence
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_RECOVERY_OUTPUT: ${{ runner.temp }}/authentication-correction-evidence
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          mkdir -p "$CAFFOOT_RECOVERY_OUTPUT"
          export CAFFOOT_CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/recovery-confirmation.cjs
          for image in recovery-request-desktop recovery-request-mobile recovery-reset-desktop recovery-reset-mobile recovery-rejected-desktop-light recovery-rejected-desktop-dark recovery-rejected-mobile-light recovery-rejected-mobile-dark; do
            test -s "$CAFFOOT_RECOVERY_OUTPUT/$image.png"
          done
          printf "Revision: %s\n" "$EXPECTED_REVISION" > "$CAFFOOT_RECOVERY_OUTPUT/Provenance.txt"
          "$CAFFOOT_CHROMIUM_PATH" --version >> "$CAFFOOT_RECOVERY_OUTPUT/Provenance.txt"
          (cd "$CAFFOOT_RECOVERY_OUTPUT" && sha256sum *.png >> Provenance.txt)
      - name: Upload verified screenshot evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: authentication-correction-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/authentication-correction-evidence/
          if-no-files-found: error
          retention-days: 14
