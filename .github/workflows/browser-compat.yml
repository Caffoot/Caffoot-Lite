name: Caffoot Lite browser compatibility

on:
  push:
    branches: [main]
    paths:
      - "tests/browser-compat.cjs"
      - ".github/workflows/browser-compat.yml"
  pull_request:
    paths:
      - "tests/browser-compat.cjs"
      - "inventory.html"
      - "setup.html"
      - ".github/workflows/browser-compat.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tests" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise approved first-run MFA and inventory UI
        working-directory: .
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
        run: node tests/browser-compat.cjs

      - name: Save actual Dashboard browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-html-dashboard-screenshots
          path: browser-screenshots/
          if-no-files-found: ignore
          retention-days: 14
