name: Caffoot Lite browser compatibility

on:
  push:
    branches: [main, feat/approved-html-full-interface, feat/approved-modular-html-282]
    paths:
      - "interface/**"
      - "tests/browser-compat.cjs"
      - "tests/milestone-01-correction-batch-2.cjs"
      - "tests/milestone-01-correction-batch-3.cjs"
      - "tests/milestone-01-correction-batch-4.cjs"
      - "tests/email-templates-interface.cjs"
      - "tests/service-desk-reporting-interface.cjs"
      - "tests/fixtures/service_desk_reporting.py"
      - "tests/session-expiry-interface.cjs"
      - "tests/stage-6-6-sign-in-interface.cjs"
      - "tests/stage-6-6-account-security-interface.cjs"
      - "tests/department-details-interface.cjs"
      - "tests/stock-intake-interface.cjs"
      - "tests/stock-circulation-interface.cjs"
      - "tests/stock-issue-confirmation.cjs"
      - "tests/device-stock-interface.cjs"
      - "tests/associated-equipment-interface.cjs"
      - "tests/device-handover-interface.cjs"
      - "tests/device-storage-interface.cjs"
      - "tests/unassigned-device-return-interface.cjs"
      - "tests/pi-acceptance-corrections.cjs"
      - "tests/users-roles-interface.cjs"
      - "tests/device-editor-approved.cjs"
      - "tests/rack-shelf-associations.cjs"
      - "tests/contextual-device-catalogue.cjs"
      - "tests/device-form-followups.cjs"
      - "tests/rack-location-defaults.cjs"
      - "tests/host-select-review.cjs"
      - "tests/subnet-first-ipam.cjs"
      - "tests/subnet-private-corrections.cjs"
      - "tests/subnet-capacity-planning.cjs"
      - "tests/subnet-first-visual.cjs"
      - "tests/subnet-first-permissions.cjs"
      - "tests/approved-visual.cjs"
      - "tests/visual_fixtures.py"
      - "inventory.html"
      - "setup.html"
      - ".github/workflows/browser-compat.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "interface/**"
      - "tests/browser-compat.cjs"
      - "tests/milestone-01-correction-batch-2.cjs"
      - "tests/milestone-01-correction-batch-3.cjs"
      - "tests/milestone-01-correction-batch-4.cjs"
      - "tests/email-templates-interface.cjs"
      - "tests/service-desk-reporting-interface.cjs"
      - "tests/fixtures/service_desk_reporting.py"
      - "tests/session-expiry-interface.cjs"
      - "tests/stage-6-6-sign-in-interface.cjs"
      - "tests/stage-6-6-account-security-interface.cjs"
      - "tests/department-details-interface.cjs"
      - "tests/stock-intake-interface.cjs"
      - "tests/stock-circulation-interface.cjs"
      - "tests/stock-issue-confirmation.cjs"
      - "tests/device-stock-interface.cjs"
      - "tests/associated-equipment-interface.cjs"
      - "tests/device-handover-interface.cjs"
      - "tests/device-storage-interface.cjs"
      - "tests/unassigned-device-return-interface.cjs"
      - "tests/pi-acceptance-corrections.cjs"
      - "tests/users-roles-interface.cjs"
      - "tests/device-editor-approved.cjs"
      - "tests/rack-shelf-associations.cjs"
      - "tests/contextual-device-catalogue.cjs"
      - "tests/device-form-followups.cjs"
      - "tests/rack-location-defaults.cjs"
      - "tests/host-select-review.cjs"
      - "tests/subnet-first-ipam.cjs"
      - "tests/subnet-private-corrections.cjs"
      - "tests/subnet-capacity-planning.cjs"
      - "tests/subnet-first-visual.cjs"
      - "tests/subnet-first-permissions.cjs"
      - "tests/approved-visual.cjs"
      - "tests/visual_fixtures.py"
      - "inventory.html"
      - "setup.html"
      - ".github/workflows/browser-compat.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-compat:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tests" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 axe-core@4.14.0
          "$RUNNER_TEMP/caffoot-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check Email Templates and Company Branding in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
        run: node tests/email-templates-interface.cjs
      - name: Check Service Desk settings and reporting in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
        run: node tests/service-desk-reporting-interface.cjs
      - name: Check Raspberry Pi acceptance corrections in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_VISUAL_OUTPUT: ${{ runner.temp }}/pi-acceptance-corrections
        run: node tests/pi-acceptance-corrections.cjs
      - name: Save Raspberry Pi correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-corrections-chromium-${{ github.sha }}
          path: ${{ runner.temp }}/pi-acceptance-corrections
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Users roles, MFA and Staff My Account
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_AXE_SOURCE: ${{ runner.temp }}/caffoot-browser-tests/node_modules/axe-core/axe.min.js
          CAFFOOT_ROLES_OUTPUT: ${{ runner.temp }}/users-roles-evidence
        run: node tests/users-roles-interface.cjs
      - name: Check Milestone 01 correction Batch 2
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
        run: node tests/milestone-01-correction-batch-2.cjs
      - name: Check Milestone 01 correction Batch 3
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
        run: node tests/milestone-01-correction-batch-3.cjs
      - name: Check Milestone 01 correction Batch 4
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
        run: node tests/milestone-01-correction-batch-4.cjs
      - name: Exercise Stage 3 Staff Directory and Department interface
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_STAFF_OUTPUT: ${{ runner.temp }}/staff-directory-evidence
        run: node tests/staff-directory-interface.cjs
      - name: Exercise canonical Device assignments and My Equipment
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_EQUIPMENT_OUTPUT: ${{ runner.temp }}/device-assignment-evidence
        run: node tests/device-assignments-interface.cjs
      - name: Check stock receipts, inventory, readiness and feature privacy
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_STOCK_OUTPUT: ${{ runner.temp }}/stock-intake-evidence
        run: node tests/stock-intake-interface.cjs
      - name: Save stock intake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-intake-chromium-${{ github.sha }}
          path: ${{ runner.temp }}/stock-intake-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check canonical Device registration, reissue and optional storage
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_DEVICE_STOCK_OUTPUT: ${{ runner.temp }}/device-stock-evidence
          CAFFOOT_STORAGE_OUTPUT: ${{ runner.temp }}/device-storage-evidence
        run: |
          node tests/device-stock-interface.cjs
          node tests/device-storage-interface.cjs
      - name: Save Device stock and storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-stock-storage-chromium-${{ github.sha }}
          path: |
            ${{ runner.temp }}/device-stock-evidence
            ${{ runner.temp }}/device-storage-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check associated equipment and missing issued quantities
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_ASSOCIATION_OUTPUT: ${{ runner.temp }}/associated-equipment-evidence
          CAFFOOT_ASSOCIATION_CAPTURE: "1"
        run: node tests/associated-equipment-interface.cjs
      - name: Save associated equipment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: associated-equipment-chromium-${{ github.sha }}
          path: ${{ runner.temp }}/associated-equipment-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check approved direct handover and Devices-only preparation
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_HANDOVER_OUTPUT: ${{ runner.temp }}/device-handover-evidence
          CAFFOOT_HANDOVER_CAPTURE: "1"
        run: node tests/device-handover-interface.cjs
      - name: Save direct Device handover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-handover-chromium-${{ github.sha }}
          path: ${{ runner.temp }}/device-handover-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check attributed stock corrections and chronological balance safeguards
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_CORRECTION_OUTPUT: ${{ runner.temp }}/stock-correction-evidence
          CAFFOOT_CORRECTION_CAPTURE: "1"
        run: node tests/stock-correction-interface.cjs
      - name: Save stock correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-corrections-chromium-${{ github.sha }}
          path: ${{ runner.temp }}/stock-correction-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check stock issue, returns, preparation, write-off and safe equipment views
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_CIRCULATION_OUTPUT: ${{ runner.temp }}/stock-circulation-evidence
          CAFFOOT_CIRCULATION_CAPTURE: "1"
        run: node tests/stock-circulation-interface.cjs
      - name: Save stock circulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-circulation-chromium-${{ github.sha }}
          path: ${{ runner.temp }}/stock-circulation-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check explicitly confirmed returns of unassigned physical Devices
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_UNASSIGNED_RETURN_OUTPUT: ${{ runner.temp }}/unassigned-device-return-evidence
          CAFFOOT_UNASSIGNED_RETURN_CAPTURE: "1"
        run: node tests/unassigned-device-return-interface.cjs
      - name: Save unassigned Device return evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unassigned-device-return-chromium-${{ github.sha }}
          path: ${{ runner.temp }}/unassigned-device-return-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Department Details navigation, privacy and visual states
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_DEPARTMENT_OUTPUT: ${{ runner.temp }}/department-details-evidence
        run: node tests/department-details-interface.cjs
      - name: Save Department Details evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: department-details-${{ github.sha }}
          path: ${{ runner.temp }}/department-details-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Device assignment interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-assignment-interface-${{ github.sha }}
          path: ${{ runner.temp }}/device-assignment-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Staff and Department interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-3-staff-interface-${{ github.sha }}
          path: ${{ runner.temp }}/staff-directory-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Users roles and MFA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-roles-${{ github.sha }}
          path: ${{ runner.temp }}/users-roles-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check session-expiry sign-in navigation and capture approved views
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_SESSION_OUTPUT: ${{ runner.temp }}/session-expiry-evidence
        run: node tests/session-expiry-interface.cjs
      - name: Save session-expiry sign-in screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-expiry-sign-in-${{ github.sha }}
          path: ${{ runner.temp }}/session-expiry-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Exercise approved first-run MFA and inventory UI
        working-directory: .
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
        run: node tests/browser-compat.cjs
      - name: Verify Stage 6.6 sign-in and account security over HTTPS
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
        run: |
          node tests/stage-6-6-sign-in-interface.cjs
          node tests/stage-6-6-account-security-interface.cjs
      - name: Check approved Device editor forms and capture full scroll comparisons
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_DEVICE_EDITOR_APPROVED: "1"
          CAFFOOT_EDITOR_FULL_CAPTURES: "1"
          CAFFOOT_VISUAL_FILTER: "^$"
          CAFFOOT_VISUAL_OUTPUT: ${{ runner.temp }}/device-editor-evidence
        run: node tests/approved-visual.cjs
      - name: Save fictional Device editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-editor-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/device-editor-evidence/device-editor
          if-no-files-found: ignore
          retention-days: 14
      - name: Exercise approved shelf and contextual catalogue workflows
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_CONTEXTUAL_CATALOGUE: "1"
          CAFFOOT_RACK_SHELF_APPROVED: "1"
          CAFFOOT_VISUAL_FILTER: "^$"
          CAFFOOT_VISUAL_OUTPUT: ${{ runner.temp }}/issue-331-evidence
        run: node tests/approved-visual.cjs
      - name: Save fictional Issue 331 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-331-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/issue-331-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check dependent Device choices, rack locations and Details dismissal
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_DEVICE_FORM_FOLLOWUPS: "1"
          CAFFOOT_RACK_LOCATION_DEFAULTS: "1"
          CAFFOOT_VISUAL_FILTER: "^$"
          CAFFOOT_VISUAL_OUTPUT: ${{ runner.temp }}/issue-332-evidence
        run: node tests/approved-visual.cjs
      - name: Save fictional Issue 332 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-332-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/issue-332-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check native hypervisor selection and modal rack feedback
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_HOST_SELECT_REVIEW: "1"
          CAFFOOT_VISUAL_FILTER: "^$"
          CAFFOOT_VISUAL_OUTPUT: ${{ runner.temp }}/issue-333-evidence
        run: node tests/approved-visual.cjs
      - name: Save fictional Issue 333 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-333-chromium-${{ github.sha }}
          path: ${{ runner.temp }}/issue-333-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check subnet-first single, bulk and Device Networking workflows
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_SUBNET_FIRST: "1"
          CAFFOOT_VISUAL_FILTER: "^$"
          CAFFOOT_VISUAL_OUTPUT: ${{ runner.temp }}/issue-329-evidence
        run: node tests/approved-visual.cjs
      - name: Save fictional Issue 329 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-329-chromium-${{ github.sha }}
          path: ${{ runner.temp }}/issue-329-evidence
          if-no-files-found: ignore
          retention-days: 14
  native-select-engines:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tests" --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1 axe-core@4.14.0
          "$RUNNER_TEMP/caffoot-browser-tests/node_modules/.bin/playwright" install --with-deps "${{ matrix.engine }}"
      - name: Check Raspberry Pi acceptance corrections in each engine
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_PI_ENGINE: ${{ matrix.engine }}
          CAFFOOT_VISUAL_OUTPUT: ${{ runner.temp }}/pi-acceptance-corrections
        run: node tests/pi-acceptance-corrections.cjs
      - name: Save Raspberry Pi correction engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-corrections-${{ matrix.engine }}-${{ github.sha }}
          path: ${{ runner.temp }}/pi-acceptance-corrections
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Users roles, MFA and Staff My Account in each engine
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_ROLES_ENGINE: ${{ matrix.engine }}
          CAFFOOT_AXE_SOURCE: ${{ runner.temp }}/caffoot-browser-tests/node_modules/axe-core/axe.min.js
          CAFFOOT_ROLES_OUTPUT: ${{ runner.temp }}/users-roles-evidence
        run: node tests/users-roles-interface.cjs
      - name: Save Users roles engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-roles-${{ matrix.engine }}-${{ github.sha }}
          path: ${{ runner.temp }}/users-roles-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check native selection, rack feedback and pinned select appearance
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_VISUAL_ENGINE: ${{ matrix.engine }}
          CAFFOOT_HOST_SELECT_REVIEW: "1"
          CAFFOOT_SUBNET_FIRST: "1"
          CAFFOOT_VISUAL_FILTER: "^$"
          CAFFOOT_VISUAL_OUTPUT: ${{ runner.temp }}/issue-333-evidence
        run: node tests/approved-visual.cjs
      - name: Save fictional engine comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-333-${{ matrix.engine }}-${{ github.sha }}
          path: ${{ runner.temp }}/issue-333-evidence
          if-no-files-found: ignore
          retention-days: 14

  native-select-webkit:
    name: native-select-engines (webkit)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Verified against the same application revision by isolated issue #361 run #44320029826.
    # Keep WebKit separate to leave the working Firefox runner unchanged.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust only this checked-out repository for pinned Git reference reads
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tests" --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1 axe-core@4.14.0
          "$RUNNER_TEMP/caffoot-browser-tests/node_modules/.bin/playwright" --version
      - name: Check Raspberry Pi acceptance corrections in each engine
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_PI_ENGINE: webkit
          CAFFOOT_VISUAL_OUTPUT: ${{ runner.temp }}/pi-acceptance-corrections
        run: node tests/pi-acceptance-corrections.cjs
      - name: Save Raspberry Pi correction engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-corrections-webkit-${{ github.sha }}
          path: ${{ runner.temp }}/pi-acceptance-corrections
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Users roles, MFA and Staff My Account in each engine
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_ROLES_ENGINE: webkit
          CAFFOOT_AXE_SOURCE: ${{ runner.temp }}/caffoot-browser-tests/node_modules/axe-core/axe.min.js
          CAFFOOT_ROLES_OUTPUT: ${{ runner.temp }}/users-roles-evidence
        run: node tests/users-roles-interface.cjs
      - name: Save Users roles engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-roles-webkit-${{ github.sha }}
          path: ${{ runner.temp }}/users-roles-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Check native selection, rack feedback and pinned select appearance
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_VISUAL_ENGINE: webkit
          CAFFOOT_HOST_SELECT_REVIEW: "1"
          CAFFOOT_SUBNET_FIRST: "1"
          CAFFOOT_VISUAL_FILTER: "^$"
          CAFFOOT_VISUAL_OUTPUT: ${{ runner.temp }}/issue-333-evidence
        run: node tests/approved-visual.cjs
      - name: Save fictional engine comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-333-webkit-${{ github.sha }}
          path: ${{ runner.temp }}/issue-333-evidence
          if-no-files-found: ignore
          retention-days: 14
