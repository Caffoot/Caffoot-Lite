name: Caffoot Lite browser compatibility

on:
  push:
    branches: [main]
    paths:
      - "tests/browser-compat.cjs"
      - ".github/workflows/browser-compat.yml"
  pull_request:
    paths:
      - "tests/browser-compat.cjs"
      - "inventory.html"
      - "setup.html"
      - ".github/workflows/browser-compat.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Supply Portainer with an exact, review-only build context. A Git URL
      # was previously used for private tests without confirming the checkout.
      - name: Package verified private-test Docker build context
        shell: bash
        run: |
          test "$(git rev-parse --short=12 HEAD)" != ""
          grep -Fq 'YOUR INFRASTRUCTURE AT A GLANCE' inventory.html
          grep -Fq 'approved-devices-inventory-styles' inventory.html
          grep -Fq 'COPY inventory.html ./inventory.html' Dockerfile
          tar -czf "$RUNNER_TEMP/caffoot-pr279-devices-build-context.tar.gz" \
            Dockerfile Dockerfile.dockerignore backend setup.html inventory.html assets
          tar -xOzf "$RUNNER_TEMP/caffoot-pr279-devices-build-context.tar.gz" inventory.html > "$RUNNER_TEMP/pr279-verify-inventory.html"
          grep -Fq 'YOUR INFRASTRUCTURE AT A GLANCE' "$RUNNER_TEMP/pr279-verify-inventory.html"
          grep -Fq 'approved-devices-inventory-styles' "$RUNNER_TEMP/pr279-verify-inventory.html"
          tar -tzf "$RUNNER_TEMP/caffoot-pr279-devices-build-context.tar.gz" \
            | grep -Fx 'assets/caffoot-logo-256.png'
          printf 'Private HTML test build context checked for commit %s\n' "$(git rev-parse HEAD)"
      - name: Keep Portainer test build context
        uses: actions/upload-artifact@v4
        with:
          name: caffoot-pr279-devices-portainer-build-context
          path: ${{ runner.temp }}/caffoot-pr279-devices-build-context.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tests" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise approved first-run MFA and inventory UI
        working-directory: .
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
        run: node tests/browser-compat.cjs

      - name: Save real Dashboard and Devices browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-html-dashboard-and-devices-screenshots
          path: browser-screenshots/
          if-no-files-found: ignore
          retention-days: 14
