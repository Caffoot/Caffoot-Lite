name: Caffoot Lite Docker Compose lifecycle

on:
  push:
    branches: [feat/approved-html-full-interface, feat/approved-modular-html-282]
    paths:
      - "interface/**"
      - "backend/**"
      - "Dockerfile"
      - "compose.yaml"
      - "tests/test_compose_lifecycle.py"
      - ".github/workflows/compose-lifecycle.yml"
  pull_request:
    paths:
      - "interface/**"
      - "backend/**"
      - "Dockerfile"
      - "compose.yaml"
      - "tests/test_compose_lifecycle.py"
      - ".github/workflows/compose-lifecycle.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compose-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose availability
        run: docker compose version
      - name: Verify configurable port, persistent TLS and database after restart/recreate
        working-directory: .
        env:
          CAFFOOT_DOCKER_SMOKE: "1"
        run: python3 -m unittest discover -s tests -p 'test_compose_lifecycle.py' -v
