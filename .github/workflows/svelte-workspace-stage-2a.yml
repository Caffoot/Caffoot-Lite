name: v2.1 Batch 1 Svelte workspace and sign-in

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.dockerignore'
      - 'inventory.html'
      - 'backend/server.py'
      - 'tests/test_svelte_workspace_http.py'
      - 'tests/browser-svelte-workspace.cjs'
      - 'tests/browser-svelte-batch1.cjs'
      - 'pilots/svelte-device-details/**'
      - '.github/workflows/svelte-workspace-stage-2a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: Build and check protected workspace, Dashboard and Sign In
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development-only Svelte tools
        working-directory: pilots/svelte-device-details
        run: npm install --no-audit --no-fund
      - name: Preserve the original isolated Svelte pilot
        working-directory: pilots/svelte-device-details
        run: |
          npm run build
          npm run test:static
          node --test test/integration-data.test.mjs
          npm run test:dashboard-data
      - name: Build the new standalone workspace assets
        working-directory: pilots/svelte-device-details
        run: |
          npm run build:workspace
          npm run build:signin
      - name: Check workspace route, security and current application routes
        run: python -m unittest discover -s tests -p test_svelte_workspace_http.py -v
      - name: Run full backend regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install Chromium for real browser checks
        working-directory: pilots/svelte-device-details
        run: npx playwright install --with-deps chromium
      - name: Browser-test protected workspace with disposable SQLite data
        env:
          NODE_PATH: ${{ github.workspace }}/pilots/svelte-device-details/node_modules
        run: node tests/browser-svelte-workspace.cjs
      - name: Test Sign In, first-time MFA, Dashboard and independent permissions
        env:
          NODE_PATH: ${{ github.workspace }}/pilots/svelte-device-details/node_modules
        run: node tests/browser-svelte-batch1.cjs
      - name: Recheck all existing Caffoot Lite browser interactions
        env:
          NODE_PATH: ${{ github.workspace }}/pilots/svelte-device-details/node_modules
        run: node tests/browser-compat.cjs
      - name: Docker build including static Svelte, without a Node runtime
        run: |
          docker build -t caffoot-batch1:test .
          docker run --rm --entrypoint sh caffoot-batch1:test -c 'test -f /opt/caffoot/inventory.html && test -f /opt/caffoot/workspace-dist/workspace.html && test -f /opt/caffoot/workspace-dist/dashboard.html && test -f /opt/caffoot/signin-dist/signin.html && test -f /opt/caffoot/workspace-dist/OFL-Inter.txt && ls /opt/caffoot/workspace-dist/assets/*.woff2 >/dev/null && ! command -v node'
      - name: Save review screenshots without publishing an image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch1-svelte-workspace-screenshots
          path: pilots/svelte-device-details/workspace-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Batch 1 Dashboard and Sign In screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch1-svelte-dashboard-signin-screenshots
          path: pilots/svelte-device-details/batch1-screenshots/
          if-no-files-found: ignore
          retention-days: 14
