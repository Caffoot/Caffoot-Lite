# Approved #215 section 24: disposable browser capture for release user guides; capture tidy fictional inventory and open the real rack elevation.
name: Next documentation screenshots

on:
  push:
    branches: [Next]
    paths:
      - ".github/workflows/next-documentation-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-next-browser" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-next-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture genuine disposable application screens
        working-directory: next
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-next-browser/node_modules
          CAFFOOT_DOC_SCREENSHOTS: "1"
        run: node tests/browser-compat.cjs
