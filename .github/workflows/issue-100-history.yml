name: Issue 100 focused history verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-100-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned build dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Build standalone HTML
        working-directory: app
        run: npm run build
      - name: Install isolated Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tools" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run only issue 100 history assertions
        working-directory: app
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tools/node_modules
        run: node test-browser-issue100-history.cjs
