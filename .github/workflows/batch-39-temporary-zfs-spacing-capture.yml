# One-off read-only real-browser capture for the owner-approved ZFS action spacing correction.
name: Temporary Batch 3.9 ZFS Spacing Capture
on:
  push:
    branches: [feat/it-assets-device-registration-reissue]
    paths:
      - ".github/workflows/batch-39-temporary-zfs-spacing-capture.yml"
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated Chromium tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tests" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture genuine nested ZFS layouts
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_STORAGE_OUTPUT: ${{ runner.temp }}/batch-39-zfs
          CAFFOOT_DEVICE_CAPTURE: "1"
        run: node tests/device-storage-interface.cjs
      - name: Publish eight owner review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: batch-39-zfs-action-spacing
          path: |
            ${{ runner.temp }}/batch-39-zfs/server-zfs-vdev-*.png
            ${{ runner.temp }}/batch-39-zfs/server-zfs-boot-pool-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Emit PNG bytes and hashes for PR evidence commit
        env:
          CAFFOOT_STORAGE_OUTPUT: ${{ runner.temp }}/batch-39-zfs
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          for(const view of ['server-zfs-vdev','server-zfs-boot-pool'])
            for(const size of ['desktop','mobile'])
              for(const theme of ['light','dark']){
                const filename=view+'-'+size+'-'+theme+'.png';
                const bytes=fs.readFileSync(path.join(process.env.CAFFOOT_STORAGE_OUTPUT,filename));
                const hash=crypto.createHash('sha256').update(bytes).digest('hex');
                const b64=bytes.toString('base64');
                console.log('CAFFOOT_CAPTURE_BEGIN '+filename+' '+bytes.length+' '+hash);
                for(let i=0;i<b64.length;i+=3000)
                  console.log('CAFFOOT_CAPTURE_DATA '+filename+' '+i+' '+b64.slice(i,i+3000));
                console.log('CAFFOOT_CAPTURE_END '+filename);
              }
          NODE
