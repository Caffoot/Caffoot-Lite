name: Publish Caffoot Lite

# The only publishing entry point: manually approved from protected main.
# Pull requests run a read-only rehearsal of version checks, never publication.
on:
  pull_request:
    paths:
      - ".github/workflows/publish-release.yml"
      - ".github/workflows/v2-release-image.yml"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/browser-compat.yml"
      - ".github/workflows/compose-lifecycle.yml"
      - ".github/workflows/release-documentation.yml"
      - ".github/workflows/git-history-secrets.yml"
      - "scripts/verify_release.py"
      - "tests/test_release_preflight.py"
      - "README.md"
      - "INSTALLATION.md"
      - "inventory.html"
      - "portainer-v*.yaml"
      - "docs/historical/release-notes/**"
      - "docs/historical/development-handovers/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.0.3 or 2.1)"
        required: true
        type: string

concurrency:
  group: caffoot-release-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Check release version and safety
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ github.sha }}
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Only the approved maintainer may publish from main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ORIGINAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release must be started from protected main."
            exit 1
          fi
          if [[ "$ORIGINAL_ACTOR" != "sdelnevo" || "$TRIGGERING_ACTOR" != "sdelnevo" ]]; then
            echo "::error::Only the approved Caffoot Lite release maintainer can publish."
            exit 1
          fi

      - name: Test the release consistency checker
        run: python3 -m unittest discover -s tests -p 'test_release_preflight.py' -v

      - name: Validate version, About page, documents and root Portainer stack
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 scripts/verify_release.py --version "$REQUESTED_VERSION" --github-output "$GITHUB_OUTPUT"
          else
            # A PR checks its proposed version without granting publication rights.
            python3 scripts/verify_release.py --github-output "$GITHUB_OUTPUT"
          fi

  backend:
    name: Release backend regression checks
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    uses: ./.github/workflows/backend-tests.yml
    permissions:
      contents: read

  browser:
    name: Release browser regression checks
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    uses: ./.github/workflows/browser-compat.yml
    permissions:
      contents: read

  docker:
    name: Release Docker persistence and HTTPS check
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    uses: ./.github/workflows/compose-lifecycle.yml
    permissions:
      contents: read

  documentation:
    name: Release documentation and guide compatibility
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    uses: ./.github/workflows/release-documentation.yml
    permissions:
      contents: read

  history_scan:
    name: Release Git history secret scan
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    uses: ./.github/workflows/git-history-secrets.yml
    permissions:
      contents: read

  publish:
    name: Create approved tag, Docker images and GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: [preflight, backend, browser, docker, documentation, history_scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.source_sha }}
      IMAGE_NAME: ghcr.io/caffoot/caffoot-lite:${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Final check before any public change
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$latest_main" != "$RELEASE_SHA" || "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::Main changed during release checks. Review the new commit and start a fresh release run."
            exit 1
          fi

          # Treat missing (404) as safe; refuse collisions and API errors.
          check_absent() {
            local endpoint="$1" status
            status="$(curl --fail-with-body --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$endpoint")" || true
            if [[ "$status" != "404" ]]; then
              echo "::error::Expected no existing $endpoint; GitHub returned HTTP $status. Stop to review before retrying."
              exit 1
            fi
          }
          check_absent "git/ref/tags/$RELEASE_VERSION"
          check_absent "releases/tags/$RELEASE_VERSION"

          latest_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          python3 - "$RELEASE_VERSION" "$latest_release" <<'PY'
          import sys
          def parts(tag):
              return tuple(int(part) for part in tag.lstrip("v").split("."))
          candidate, previous = map(parts, sys.argv[1:3])
          a, b = list(candidate), list(previous)
          size = max(len(a), len(b))
          a += [0] * (size - len(a))
          b += [0] * (size - len(b))
          if a <= b:
              raise SystemExit(f"Requested version must be newer than {sys.argv[2]}")
          print(f"Version {sys.argv[1]} is newer than published {sys.argv[2]}")
          PY

      - name: Create the release tag at the tested commit
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_VERSION" \
            -f sha="$RELEASE_SHA" >/dev/null
          echo "Created release tag $RELEASE_VERSION at $RELEASE_SHA"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AMD64 and ARM64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=https://github.com/Caffoot/Caffoot-Lite
            org.opencontainers.image.title=Caffoot Lite
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
          provenance: false

      - name: Verify image platforms and public pull access
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE_NAME" > "$RUNNER_TEMP/caffoot-manifest.json"
          python3 - "$RUNNER_TEMP/caffoot-manifest.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as file:
              manifest = json.load(file)
          platforms = {
              (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture"))
              for item in manifest.get("manifests", [])
          }
          required = {("linux", "amd64"), ("linux", "arm64")}
          if not required.issubset(platforms):
              raise SystemExit(f"Missing Docker platforms: {sorted(required - platforms)}")
          print("Confirmed both published Docker architectures: amd64 and arm64")
          PY
          # A public package must be inspectable after local registry login is removed.
          docker logout ghcr.io
          docker buildx imagetools inspect --raw "$IMAGE_NAME" >/dev/null
          echo "Verified image can be inspected without registry credentials"

      - name: Publish the matching GitHub Release after the image is verified
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" \
            --verify-tag \
            --title "Caffoot Lite $RELEASE_VERSION" \
            --notes-file "docs/historical/release-notes/Release-Notes-$RELEASE_VERSION.md" \
            --latest
          is_draft="$(gh release view "$RELEASE_VERSION" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "false" ]]; then
            echo "::error::GitHub Release was not published."
            exit 1
          fi
          echo "Published Caffoot Lite $RELEASE_VERSION with both Docker architectures."
