name: Next browser compatibility milestone

on:
  push:
    branches: [Next]
    paths:
      - "next/tests/browser-compat.cjs"
      - ".github/workflows/next-browser-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-next-browser" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-next-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise approved first-run MFA and inventory UI
        working-directory: next
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-next-browser/node_modules
        run: node tests/browser-compat.cjs
