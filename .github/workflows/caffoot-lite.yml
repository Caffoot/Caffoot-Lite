name: Build Caffoot Lite standalone HTML

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/caffoot-lite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build-only dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Build and verify standalone HTML
        working-directory: app
        run: npm run release
      - name: Validate HTML JavaScript syntax
        working-directory: app
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('dist/Caffoot-Lite.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline application scripts found');
          for (const [index, script] of scripts.entries()) {
            new vm.Script(script[1], {filename: 'inline-script-' + (index + 1) + '.js'});
          }
          console.log('Checked ' + scripts.length + ' inline scripts');
          NODE
      - name: Upload standalone HTML for testing
        uses: actions/upload-artifact@v4
        with:
          name: caffoot-lite-offline-preview
          path: app/dist/Caffoot-Lite.html
          if-no-files-found: error
