name: Build Caffoot Lite standalone HTML

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/caffoot-lite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build-only dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Build and verify standalone HTML
        working-directory: app
        run: npm run release
      - name: Validate HTML JavaScript syntax
        working-directory: app
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('dist/Caffoot-Lite.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline application scripts found');
          for (const [index, script] of scripts.entries()) {
            new vm.Script(script[1], {filename: 'inline-script-' + (index + 1) + '.js'});
          }
          console.log('Checked ' + scripts.length + ' inline scripts');
          NODE
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tools" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run standalone HTML in Chromium (offline)
        working-directory: app
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tools/node_modules
        run: |
          node test-browser-offline.cjs
          node test-browser-import.cjs
          node test-browser-restore.cjs
      - name: Assemble private offline preview bundle
        run: |
          mkdir -p app/dist/preview-package/licenses
          cp app/dist/Caffoot-Lite.html app/dist/preview-package/
          cp LICENSE THIRD-PARTY-NOTICES.md app/dist/preview-package/
          cp licenses/FONT-AWESOME-6.4.0.txt licenses/TAILWIND-CSS-3.4.17.txt app/dist/preview-package/licenses/
          cd app/dist/preview-package
          zip -q -r ../Caffoot-Lite-preview.zip .
          for file in Caffoot-Lite.html LICENSE THIRD-PARTY-NOTICES.md licenses/FONT-AWESOME-6.4.0.txt licenses/TAILWIND-CSS-3.4.17.txt; do
            unzip -Z1 ../Caffoot-Lite-preview.zip | grep -Fxq "$file" || exit 1
          done
      - name: Upload standalone HTML and licensed preview bundle for testing
        uses: actions/upload-artifact@v4
        with:
          name: caffoot-lite-offline-preview
          path: |
            app/dist/Caffoot-Lite.html
            app/dist/Caffoot-Lite-preview.zip
          if-no-files-found: error
