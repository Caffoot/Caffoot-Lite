name: Validate Caffoot Lite release candidate

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/validate-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    # The Docker/SQLite Next release uses its own backend and Chromium checks.
    # Keep this v1.3.3 standalone release packaging gate for other PRs.
    if: github.event_name != 'pull_request' || github.head_ref != 'Next'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Run release checks and create verified package
        run: npm run release
      - name: Confirm application version and package
        run: |
          node -e "const fs=require('fs'); const src=fs.readFileSync('caffoot-lite.html','utf8'); const pkg=require('./package.json'); const v=pkg.version; const marker='const CAFFOOT_LITE_VERSION = '+String.fromCharCode(39)+v+String.fromCharCode(39)+';'; if (!src.includes(marker)) process.exit(1); if (!fs.readFileSync('dist/Caffoot-Lite.html','utf8').includes(marker)) process.exit(1); if (!fs.existsSync('dist/Caffoot-Lite-'+v+'.zip')) process.exit(1);"
      - name: Upload test build (not a published release)
        uses: actions/upload-artifact@v4
        with:
          name: caffoot-lite-release-candidate
          path: |
            app/dist/Caffoot-Lite.html
            app/dist/Caffoot-Lite-*.zip
          retention-days: 7
