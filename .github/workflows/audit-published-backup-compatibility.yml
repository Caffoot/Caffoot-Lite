name: Audit published v1.2.1 to v1.3.0 backup compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/audit-published-backup-compatibility.yml'
      - 'app/test-published-backup-compatibility.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-backup-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download original published release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caffoot-releases/1.2.1" "$RUNNER_TEMP/caffoot-releases/1.3.0"
          for version in 1.2.1 1.3.0; do
            for file in "Caffoot-Lite-${version}.zip" Caffoot-Lite.html SHA256SUMS; do
              curl --fail --location --retry 3 --silent --show-error \
                "https://github.com/Caffoot/Caffoot-Lite/releases/download/v${version}/${file}" \
                --output "$RUNNER_TEMP/caffoot-releases/${version}/${file}"
            done
            (cd "$RUNNER_TEMP/caffoot-releases/${version}" && sha256sum --check SHA256SUMS)
            unzip -t "$RUNNER_TEMP/caffoot-releases/${version}/Caffoot-Lite-${version}.zip"
          done
          echo "PASS: published v1.2.1 and v1.3.0 asset checksums and ZIP integrity"
      - name: Install isolated Chromium test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tools" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build current release candidate
        working-directory: app
        run: npm ci && npm run build && npm run check:build
      - name: Test real published version backup export and import
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tools/node_modules
          CAFFOOT_RELEASE_DIR: ${{ runner.temp }}/caffoot-releases
        run: node app/test-published-backup-compatibility.cjs
