name: Caffoot Lite backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "inventory.html"
      - "setup.html"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "inventory.html"
      - "setup.html"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q backend tests
      - name: Run isolated backend tests
        run: python -m unittest discover -s tests -v
