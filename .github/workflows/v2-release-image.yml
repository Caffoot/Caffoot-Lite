name: Caffoot Lite v2.0.1 release image

# Runs only when the approved v2.0.1 Git tag is created at the final release gate.
# Publishes the separately named, versioned image; does not change next-test.
on:
  push:
    tags:
      - "v2.0.1"

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Caffoot Lite v2.0.1 for Raspberry Pi 5 and PCs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/caffoot/caffoot-lite:v2.0.1
          labels: |
            org.opencontainers.image.source=https://github.com/Caffoot/Caffoot-Lite
            org.opencontainers.image.title=Caffoot Lite
            org.opencontainers.image.version=v2.0.1
          provenance: false
