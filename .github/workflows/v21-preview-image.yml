name: Caffoot Lite v2.1 preview image (ARM64 / AMD64)

# Preview only: no release/tag/latest/main publication.
# Rebuild on explicit v2.1 development commits, never modify stable v2.0.1.
on:
  push:
    branches: [v2.1]
    paths:
      - ".github/workflows/v21-preview-image.yml"
      - "Dockerfile"
      - "backend/**"
      - "inventory.html"
      - "setup.html"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caffoot-v21-preview-image
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q backend tests
      - name: Run backend regression tests before image publishing
        run: python -m unittest discover -s tests -v

  publish-preview:
    needs: backend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish isolated preview tag (Pi 5 / ARM64 and PC / AMD64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/caffoot/caffoot-lite:v2.1-preview
            ghcr.io/caffoot/caffoot-lite:v2.1-preview-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Caffoot/Caffoot-Lite
            org.opencontainers.image.title=Caffoot Lite v2.1 (unreleased development preview)
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
