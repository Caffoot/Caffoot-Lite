name: Temporary Batch 4 correction verification

on:
  pull_request:
    branches: [milestone-1]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  focused-batch4:
    if: github.head_ref == 'fix/milestone-01-audit-details' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check pinned interface stylesheet and template contracts
        run: PYTHONPATH=tests:. python -m unittest -v test_modular_interface
      - name: Install isolated Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caffoot-browser-tests" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caffoot-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify Activity Details and capture approved states
        env:
          NODE_PATH: ${{ runner.temp }}/caffoot-browser-tests/node_modules
          CAFFOOT_BATCH4_WIDTH_ONLY: '1'
          CAFFOOT_BATCH4_OUTPUT: ${{ runner.temp }}/batch4-correction-evidence
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          node tests/milestone-01-correction-batch-4.cjs
          for image in audit-supplier-name audit-legacy-technical audit-device-changes; do
            test -s "$CAFFOOT_BATCH4_OUTPUT/$image.png"
          done
      - name: Upload verified screenshot evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batch4-correction-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/batch4-correction-evidence/
          if-no-files-found: error
          retention-days: 14
