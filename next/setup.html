<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caffoot Lite — Sign in</title>
<style>
:root{font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#0f172a;background:#f1f5f9}
body{margin:0;min-height:100vh;display:grid;place-items:center}
main{width:min(420px,calc(100% - 40px));background:white;padding:30px;border:1px solid #cbd5e1;border-radius:16px;box-shadow:0 8px 28px #0f172a12}
h1{margin:0 0 8px;font-size:25px}p{color:#475569;line-height:1.5}
label{display:block;font-size:13px;font-weight:700;margin:18px 0 6px}
input{box-sizing:border-box;width:100%;min-height:44px;padding:10px;border:1px solid #64748b;border-radius:8px;font:inherit}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#4f46e5;color:white;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}#message{color:#b91c1c}#secret{overflow-wrap:anywhere;font-weight:700;color:#0f172a}
[hidden]{display:none!important}
</style></head><body><main>
<h1>Caffoot Lite</h1><p id="intro">Loading…</p>
<form id="form" hidden>
<div id="credentials"><label for="username">Username</label><input id="username" autocomplete="username" required maxlength="256">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<div id="enrolment" hidden><p>Add this secret to your authenticator app, then enter its six-digit code to finish setup.</p><p id="secret"></p></div>
<div id="code-field" hidden><label for="code">Authenticator code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></div>
<p id="message" role="alert"></p><button id="submit" type="submit">Continue</button></form>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
let mode='login';
async function request(path,data){
 const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const payload=await r.json();if(!r.ok)throw Error(payload.error||'Request failed');return payload;
}
function display(){
 $('form').hidden=false;$('message').textContent='';
 $('enrolment').hidden=mode!=='enrol';
 $('code-field').hidden=mode==='setup';
 $('intro').textContent=mode==='setup'?'Create the first administrator account. MFA is required.':mode==='enrol'?'Complete administrator MFA enrolment.':'Sign in to Caffoot Lite.';
 $('submit').textContent=mode==='setup'?'Create administrator':mode==='enrol'?'Confirm MFA':'Sign in';
 $('password').autocomplete=mode==='setup'?'new-password':'current-password';
 $('code').required=mode!=='setup';
}
(async()=>{try{
 const r=await fetch('/api/setup/status');if(!r.ok)throw Error('Unable to check setup');
 mode=(await r.json()).setupRequired?'setup':'login';display();
}catch(e){$('intro').textContent=e.message}})();
$('form').addEventListener('submit',async e=>{
 e.preventDefault();$('submit').disabled=true;$('message').textContent='';
 const data={username:$('username').value,password:$('password').value};
 try{
 if(mode==='setup'){
   const r=await request('/api/setup',data);$('secret').textContent=r.mfaSecret;mode='enrol';display();
 }else if(mode==='enrol'){
   await request('/api/setup/mfa',{...data,mfa_code:$('code').value});mode='login';display();$('message').style.color='#166534';$('message').textContent='MFA enrolled. Sign in to continue.';
 }else{
   await request('/api/login',{...data,mfa_code:$('code').value});
   $('intro').textContent='Signed in. The inventory interface is still being connected to the database.';
   $('form').hidden=true;
 }
 }catch(err){$('message').style.color='#b91c1c';$('message').textContent=err.message}
 finally{$('submit').disabled=false}
});
</script></body></html>
