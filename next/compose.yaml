services:
  caffoot-next:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - caffoot_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caffoot_data:
