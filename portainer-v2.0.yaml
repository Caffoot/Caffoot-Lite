# Caffoot Lite v2.0 — Portainer / Docker Compose release stack.
# Replace the example IP address, port and /data host path for your installation.
# The v2.0 image is published at the official release gate; not the earlier next-test image.
services:
  caffoot-lite:
    image: ghcr.io/caffoot/caffoot-lite:v2.0
    container_name: caffoot-lite
    restart: unless-stopped
    environment:
      CAFFOOT_WEB_ADDRESS: "https://10.128.20.3:8443"
      CAFFOOT_SERVER_ADDRESS: "10.128.20.3"
      CAFFOOT_PORT: "8443"
    ports:
      - "8443:8080"
    volumes:
      - /portainer/Files/AppData/Config/caffoot_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8080/health',context=ssl._create_unverified_context(),timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
