    <style>
        /* Use one offline-safe UI font stack for every page, including Dashboard. */
        html { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body, button, input, select, textarea { font-family: inherit; }
        /* Tailwind's font-sans utility otherwise selects a different system stack. */
        .font-sans { font-family: inherit; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
    
        /* RC1: validation takes precedence over the normal blue focus ring. */
        #modal-content :is(input,select,textarea)[aria-invalid="true"] {
            border-color: #b91c1c !important;
            outline: 3px solid #dc2626 !important;
            outline-offset: 2px !important;
            box-shadow: 0 0 0 1px #b91c1c !important;
        }
        #modal-content :is(input,select,textarea)[aria-invalid="true"]:focus-visible {

            border-color: #fda4af !important;
            outline-color: #fb7185 !important;
            box-shadow: 0 0 0 1px #fda4af !important;
        }
        /* Subnet-inspired selection tiles for server services and installed software. */
        .phase120-option-tile { display:flex; align-items:center; gap:.65rem; min-height:3.25rem; padding:.75rem; border:1px solid #cbd5e1; border-radius:.8rem; background:#f8fafc; cursor:pointer; transition:background-color .15s,border-color .15s; }
        .phase120-option-tile:hover { border-color:#d97706; }
        .phase120-option-tile:has(input:checked) { background:#fffbeb; border-color:#fbbf24; }
        .phase120-option-tile:focus-within { outline:2px solid #d97706; outline-offset:2px; }
        .phase120-option-tile input { accent-color:#b45309; flex-shrink:0; }
        .phase120-option-status { margin-left:auto; padding:.15rem .45rem; border-radius:.4rem; font-size:.68rem; font-weight:600; color:#92400e; background:#fff; display:none; white-space:nowrap; }

        .dark .phase120-option-tile { background:#1e293b; border-color:#475569; color:#f1f5f9; }

        .dark .phase120-option-status { background:#78350f; color:#fef3c7; }

        .form-shell { max-width: 900px; margin: 0 auto; }

        .dark .form-section-card { border-color: rgb(51 65 85); background: rgb(15 23 42 / .35); }
        .form-section-heading { display:flex; align-items:center; gap:.55rem; margin-bottom:.9rem; font-size:.78rem; font-weight:800; letter-spacing:.045em; text-transform:uppercase; color:rgb(71 85 105); }
        .dark .form-section-heading { color:rgb(148 163 184); }
        .form-field { min-width:0; }
        .form-label { display:flex; align-items:center; gap:.35rem; min-height:1.1rem; margin-bottom:.35rem; font-size:.72rem; line-height:1rem; font-weight:700; color:rgb(71 85 105); }
        .dark .form-label { color:rgb(203 213 225); }
        .required-mark { color:rgb(225 29 72); font-weight:800; }
        .form-help { margin-top:.3rem; font-size:.68rem; line-height:1.05rem; color:rgb(100 116 139); }
        .form-error { display:none; margin-top:.35rem; padding:.45rem .6rem; border-radius:.55rem; border:1px solid rgb(254 205 211); background:rgb(255 241 242); color:rgb(190 18 60); font-size:.7rem; line-height:1rem; }
        .dark .form-error { border-color:rgb(136 19 55); background:rgb(76 5 25 / .35); color:rgb(253 164 175); }
        .form-error.is-visible { display:block; }
        .form-actions { display:flex; justify-content:flex-end; align-items:center; gap:.65rem; padding-top:1rem; margin-top:.25rem; border-top:1px solid rgb(226 232 240); }
        .dark .form-actions { border-color:rgb(51 65 85); }

        @media (max-width:640px) { .form-actions > [data-action="delete-subnet"] { margin-right:0; } }
        .form-actions button { min-height:2.35rem; }
        @media (max-width:640px) { .form-actions { flex-direction:column-reverse; align-items:stretch; } .form-actions button { width:100%; } }

<style id="ui-accessibility-pass">
/* Page-level accessibility and theme consistency pass */
:root {
  --ui-text: #172033;
  --ui-text-muted: #4b5563;
  --ui-text-subtle: #6b7280;
  --ui-border: #cbd5e1;
  --ui-border-strong: #94a3b8;
  --ui-surface: #ffffff;
  --ui-surface-alt: #f8fafc;
  --ui-hover: #f1f5f9;
  --ui-focus: #2563eb;
}
.dark {
  --ui-text: #f8fafc;
  --ui-text-muted: #d1d5db;
  --ui-text-subtle: #cbd5e1;
  --ui-border: #475569;
  --ui-border-strong: #64748b;
  --ui-surface: #111827;
  --ui-surface-alt: #1f2937;
  --ui-hover: #273449;
  --ui-focus: #60a5fa;
}

body { color: var(--ui-text); }
.text-gray-400, .text-gray-500 { color: var(--ui-text-muted) !important; }
.text-gray-600, .text-gray-700 { color: var(--ui-text-muted) !important; }
.dark .text-gray-400, .dark .text-gray-500,
.dark .text-gray-600, .dark .text-gray-700 { color: var(--ui-text-muted) !important; }

.border-gray-100, .border-gray-200, .border-gray-300 { border-color: var(--ui-border) !important; }
.dark .border-gray-600, .dark .border-gray-700 { border-color: var(--ui-border) !important; }

.bg-gray-50 { background-color: var(--ui-surface-alt) !important; }
.dark .bg-gray-50 { background-color: var(--ui-surface-alt) !important; }
.dark .bg-gray-800, .dark .bg-gray-900 { background-color: var(--ui-surface) !important; }

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--ui-focus) !important;
  outline-offset: 2px;
}

input, select, textarea {
  border-color: var(--ui-border-strong);
}
input::placeholder, textarea::placeholder { color: var(--ui-text-subtle); opacity: 1; }
.dark input::placeholder, .dark textarea::placeholder { color: var(--ui-text-subtle); opacity: 1; }

/* Tables: clearer row separation and hover contrast */
thead th { border-bottom-color: var(--ui-border-strong) !important; }
tbody tr { border-bottom-color: var(--ui-border) !important; }
tbody tr:hover { background-color: var(--ui-hover) !important; }
.dark tbody tr:hover { background-color: var(--ui-hover) !important; }

/* Status badges retain semantic colour while improving text contrast. */
.badge, [class*="rounded-full"] { text-shadow: none; }

/* Navigation and clickable cards */
nav a:hover, nav button:hover { background-color: var(--ui-hover); }

/* Empty states and helper text should remain readable in both themes. */

/* Preserve readable disabled controls while clearly communicating disabled state. */
button:disabled, input:disabled, select:disabled, textarea:disabled {
  opacity: .65;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

<style id="phase18a-ui-consistency">
/* Phase 18A: accessible, consistent application controls without changing rack geometry. */
:root { --phase18-focus:#2563eb; --phase18-control-border:#94a3b8; }
.dark { --phase18-focus:#93c5fd; --phase18-control-border:#64748b; }
/* Use a visible keyboard-only focus indicator, including dynamically rendered controls. */
#app :is(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible,
#modal-container :is(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible {
  outline:3px solid var(--phase18-focus) !important;
  outline-offset:2px !important;
}
/* Match control heights while leaving checkbox, radio, file inputs and rack elements untouched. */
#main-content :is(input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]),select),
#modal-content :is(input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]),select) {
  box-sizing:border-box;
  min-height:44px;
}
#main-content textarea,#modal-content textarea { box-sizing:border-box; min-height:88px; }
#main-content :is(input,select,textarea):disabled,
#modal-content :is(input,select,textarea):disabled { opacity:.65; cursor:not-allowed; }
#main-content :is(input,select,textarea):not(:disabled),
#modal-content :is(input,select,textarea):not(:disabled) { max-width:100%; }
/* Prevent overflow in narrow form and dashboard grids. */
#main-content .grid > *,#modal-content .grid > * { min-width:0; }
#main-content table,#modal-content table { border-collapse:separate; border-spacing:0; }
#main-content th { line-height:1.4; }
#main-content td { line-height:1.45; }
/* Keyboard focus must remain clear against both sidebar themes. */
#sidebar .nav-btn:focus-visible { outline-offset:-3px !important; }
/* Avoid animation discomfort without disabling drag and drop. */
@media (prefers-reduced-motion:reduce) {
  #app *,#modal-container *,#toast { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
@media (max-width:640px) {
  #main-content { padding:14px; }
  #modal-container { padding:10px; }
  #modal-content { max-width:calc(100vw - 20px); }

    <script>
        const defaultData = {
            subnets: [],
            vlans: [],
            racks: [],
            devices: [],
            rackAccessories: [],
            deviceTypes: ['Server - Physical', 'Server - Virtual', 'Desktop', 'Laptop', 'Tablet', 'Switch', 'Layer 3 Switch', 'Router', 'Firewall', 'NAS', 'Printer', 'Scanner', 'Access Point', 'Wireless LAN Controller', 'PDU', 'UPS', 'Unknown'],
            deviceTypeGraphics: {},
            deviceLocations: ['Unknown'],
            ipAllocations: {},
            serverFunctions: [],
            installedSoftware: [],
            managedOptionsCleared: false
        };

        const STATE_VERSION = 3;

        function cloneDefaultData() {
            return JSON.parse(JSON.stringify(defaultData));
        }

        function isPlainObject(value) {
            return value !== null && typeof value === 'object' && !Array.isArray(value);
        }

        function isValidIpv4(ip) {
            const parts = String(ip || '').trim().split('.');
            return parts.length === 4 && parts.every(part => {
                if (!/^\d{1,3}$/.test(part)) return false;
                const n = Number(part);
                return n >= 0 && n <= 255;
            });
        }

        // Phase 12A: unsigned IPv4 math; supported host ranges /23 through /30.
        function phase12IpNumber(ip) {
            if (!isValidIpv4(ip)) return null;
            return ip.split('.').reduce((n,part)=>((n*256)+Number(part)),0);
        }
        function phase12IpString(n) {
            return [24,16,8,0].map(shift=>Math.floor(n/2**shift)%256).join('.');
        }
        function phase12Cidr(cidr) {
            const m=String(cidr||'').match(/^([^/]+)\/(\d{1,2})$/);
            if(!m) return null;
            const prefix=Number(m[2]), raw=phase12IpNumber(m[1]);
            if(raw===null||prefix<23||prefix>30) return null;
            const size=2**(32-prefix), network=Math.floor(raw/size)*size;
            if(raw!==network) return null;
            return {prefix,network,last:network+size-1,first:network+1,lastHost:network+size-2,capacity:size-2,size};
        }
        function phase12Overlap(a,b) {
            const x=phase12Cidr(a),y=phase12Cidr(b);
            return !!(x&&y&&x.network<=y.last&&y.network<=x.last);
        }
        function phase12Usable(ip,cidr) {
            const x=phase12Cidr(cidr),n=phase12IpNumber(ip);
            return !!(x&&n!==null&&n>=x.first&&n<=x.lastHost);

        // Phase 10C: a compact, local, best-effort audit trail.

        const AUDIT_KEY = 'caffoot_audit_v1';
        const AUDIT_LIMIT = 200;
        function readAuditHistory() {
            try {
                const parsed = JSON.parse(localStorage.getItem(AUDIT_KEY) || '[]');

        let auditHistory = readAuditHistory();

        let nextAuditReason = '';
        function auditChanges(before, after) {
            const changes = [];
            const categories = [
                ['devices','Device','name'],
                ['subnets','Subnet','cidr'],
                ['racks','Rack','name'],
                ['vlans','VLAN','name']
            ];
            for (const [key,kind,labelKey] of categories) {
                const left = new Map((Array.isArray(before[key]) ? before[key] : []).map(x=>[String(x.id),x]));
                const right = new Map((Array.isArray(after[key]) ? after[key] : []).map(x=>[String(x.id),x]));
                for (const [id,item] of right) {
                    const old=left.get(id), label=String(item[labelKey] || id).slice(0,100);
                    if (!old) changes.push({action:'Created',kind,label,fields:[]});
                    else if (JSON.stringify(old)!==JSON.stringify(item)) {
                        const fields=[...new Set([...Object.keys(old),...Object.keys(item)])]
                            .filter(k=>k!=='id' && JSON.stringify(old[k])!==JSON.stringify(item[k]));
                        changes.push({action:'Updated',kind,label,fields:fields.slice(0,16)});
                    }
                }
                for (const [id,item] of left) if (!right.has(id))
                    changes.push({action:'Deleted',kind,label:String(item[labelKey] || id).slice(0,100),fields:[]});
            }
            const oldIp=before.ipAllocations || {}, newIp=after.ipAllocations || {};
            for (const ip of new Set([...Object.keys(oldIp),...Object.keys(newIp)])) {
                if (JSON.stringify(oldIp[ip]) === JSON.stringify(newIp[ip])) continue;
                const action = !(ip in oldIp) ? 'Created' : !(ip in newIp) ? 'Deleted' : 'Updated';
                changes.push({action,kind:'IPAM',label:ip,fields:action==='Updated'
                    ? [...new Set([...Object.keys(oldIp[ip] || {}),...Object.keys(newIp[ip] || {})])]
                        .filter(k=>JSON.stringify(oldIp[ip]?.[k])!==JSON.stringify(newIp[ip]?.[k])).slice(0,16) : []});
            }
            for (const key of ['deviceTypes','deviceLocations']) {
                if (JSON.stringify(before[key])!==JSON.stringify(after[key]))
                    changes.push({action:'Updated',kind:key==='deviceTypes'?'Device types':'Locations',label:'Managed list',fields:[]});
            }
            return changes;
        }
        function recordAudit(before,after,reason) {
            const changes = auditChanges(before,after);

                    </div>

                </section>

                    ${entry.omitted?`<p class="text-xs text-amber-800 dark:text-amber-200">Plus ${entry.omitted} additional changes not displayed in this event.</p>`:''}

        // Phase 1 data-integrity helpers

        function findDeviceUsingIp(ip, excludeDeviceId = null) {
            if (!ip) return null;

        function setDevicePrimaryIp(device, newIp) {
            const oldIp = device.primaryIp || '';
            const trimmedIp = (newIp || '').trim();

            if (trimmedIp && findDeviceUsingIp(trimmedIp, device.id)) {
                throw new Error(`IP address ${trimmedIp} is already assigned to another device.`);
            }
            // Phase 17C: refuse to take an IPAM address owned by a different device.
            // Validate before releasing the old address so a failed edit leaves it intact.
            if (trimmedIp) {
                const gatewaySubnet = phase10GatewaySubnet(trimmedIp);
                if (gatewaySubnet && trimmedIp !== oldIp && !['Firewall', 'Router', 'Layer 3 Switch'].includes(device.type)) {
                    throw new Error(`Gateway ${trimmedIp} may only be assigned to a Firewall, Router or Layer 3 Switch.`);
                }
                if (!appState.subnets.some(subnet => ipBelongsToSubnet(trimmedIp, subnet.cidr))) {
                    throw new Error(`IP address ${trimmedIp} is not in a configured subnet.`);
                }
                const allocation = appState.ipAllocations[trimmedIp];
                if (allocation?.deviceId && allocation.deviceId !== device.id) {
                    throw new Error(`IP address ${trimmedIp} is linked to another device in IPAM.`);
                }
                if (allocation?.reservedForDeviceId && allocation.reservedForDeviceId !== device.id) {
                    throw new Error(`IP address ${trimmedIp} is reserved for another device.`);
                }
                if (trimmedIp !== oldIp && allocation && !allocation.deviceId &&
                    ['Reserved', 'Assigned'].includes(allocation.status) &&
                    allocation.reservedForDeviceId !== device.id) {
                    throw new Error(`IP address ${trimmedIp} is already ${allocation.status.toLowerCase()} in IPAM.`);
                }
            }

            if (oldIp && appState.ipAllocations[oldIp]?.deviceId === device.id) {
                delete appState.ipAllocations[oldIp];
            }

            device.primaryIp = trimmedIp;

            if (trimmedIp) {
                const existing = appState.ipAllocations[trimmedIp] || {};
                appState.ipAllocations[trimmedIp] = {
                    ...existing,
                    status: device.ipReserved ? 'Reserved' : 'Assigned',
                    deviceId: device.id,
                    hostname: device.name || existing.hostname || '',
                    notes: device.notes || existing.notes || ''
                };
            }
        }

        // Keep the IPAM record in sync when any device details change.

        function validateRackPlacement(deviceId, rackId, face, startU, endU = startU) {
            const rack = appState.racks.find(r => r.id === rackId);
            if (!rack) return 'Selected rack no longer exists.';

            const start = Number(startU);
            const end = Number(endU);
            const rackHeight = Number(rack.heightU);

            if (!Number.isInteger(start) || !Number.isInteger(end)) {
                return 'Rack U positions must be whole numbers.';
            }
            if (start < 1 || end < 1 || start > rackHeight || end > rackHeight) {
                return `Rack position must be between U1 and U${rackHeight}.`;
            }
            if (end < start) {
                return 'Rack end U cannot be below the start U.';
            }

            const overlaps = appState.devices.some(d => {
                if (d.id === deviceId || d.rackId !== rackId || (d.face || 'front') !== (face || 'front')) return false;
                const otherStart = Number(d.rackUStart);
                const otherEnd = Number(d.rackUEnd || d.rackUStart);
                if (!Number.isInteger(otherStart) || !Number.isInteger(otherEnd)) return false;
                return start <= otherEnd && end >= otherStart;
            });

            if (overlaps) {
                return `The selected U position overlaps another device on the ${face || 'front'} face.`;
            }
            if ((appState.rackAccessories || []).some(a => a.rackId === rackId && !['pdu_vertical','cable_vertical'].includes(a.type) && a.face === (face || 'front') && start <= Number(a.startU) + Number(a.heightU) - 1 && end >= Number(a.startU))) {
                return 'The selected U position overlaps a rack accessory.';
            }
            return null;
        }

        function showToast(message, type = 'success') {

                    formError.classList.add('is-visible');
                }
                // Highlight the relevant control for common application-level
                // validation failures (native required-field errors are handled
                // separately by the 'invalid' listener).
                const rules = [
                    [/rack name/i, 'rack-name'],
                    [/device name|hostname|unique device name/i, 'dev-name'],
                    [/device type/i, 'dev-type'],
                    [/mounting option/i, 'dev-mount-type'],
                    [/select a location/i, 'dev-location'],
                    [/existing subnet|selected subnet/i, 'dev-subnet'],

                    [/vlan id/i, 'sub-vlan'],

                const match = rules.find(([pattern, id]) => pattern.test(message) &&
                    document.getElementById(id)?.closest('#modal-container form'));

                    const field = document.getElementById(match[1]);
                    field.setAttribute('aria-invalid', 'true');
                    field.focus();
                }

        function phase11CPlan(state=appState) {
            const fixes=[], blocked=[];
            const owners=new Map();
            for(const d of state.devices) if(d.primaryIp) {
                if(!owners.has(d.primaryIp)) owners.set(d.primaryIp,[]);
                owners.get(d.primaryIp).push(d);
            }
            for(const [ip,devices] of owners) {
                if(devices.length!==1) { blocked.push(`Duplicate primary IP ${ip}: manual resolution required.`); continue; }
                const d=devices[0], existing=state.ipAllocations[ip];
                if(!state.subnets.some(n=>ipBelongsToSubnet(ip,n.cidr))) {
                    blocked.push(`${d.name}: ${ip} has no matching subnet.`); continue;
                }
                if(existing?.deviceId && existing.deviceId!==d.id) {
                    blocked.push(`${ip} belongs to another IPAM record (${existing.deviceId}). Review manually.`); continue;
                }
                if(existing && !existing.deviceId && existing.status && existing.status!=='Available') {
                    blocked.push(`${ip} is ${existing.status} without a matching owner. Review manually.`); continue;
                }
                const expected={status:d.ipReserved?'Reserved':'Assigned',deviceId:d.id,hostname:d.name||'',notes:d.notes||''};
                if(!existing || Object.entries(expected).some(([k,v])=>existing[k]!==v)) {
                    fixes.push({ip,deviceId:d.id,name:d.name,expected,
                        reason:existing?'Synchronise device-owned IPAM fields':'Create missing device IPAM allocation'});
                }
            }
            for(const [ip,a] of Object.entries(state.ipAllocations)) {
                if(a?.deviceId && !state.devices.some(d=>d.id===a.deviceId && d.primaryIp===ip))
                    blocked.push(`${ip} has a stale or orphaned IPAM link. Review manually.`);
                if(a?.reservedForDeviceId && !state.devices.some(d=>d.id===a.reservedForDeviceId))
                    blocked.push(`${ip} has an orphaned reservation. Review manually.`);
            }
            for(const d of state.devices) if(d.rackId && !state.racks.some(r=>r.id===d.rackId))

            if(!confirm(`Apply ${fixes.length} proposed IPAM repair(s)? A pre-repair snapshot will be stored first. Conflicts are not changed.`)) return;
            const before=JSON.stringify(appState);
            const previousSnapshot=localStorage.getItem(PHASE11C_SNAPSHOT_KEY);
            try {

                localStorage.setItem(PHASE11C_SNAPSHOT_KEY,before);
                for(const f of fixes) {

                    .reduce((sum,d)=>{

                        return sum+(Number.isInteger(a)&&Number.isInteger(b)&&b>=a?b-a+1:0);
                    },0);
                const front=occupancy('front'),rear=occupancy('rear');
                const percent=height?Math.round(Math.max(front,rear)/height*100):0;
                return {name:r.name||r.id,height,front,rear,devices:installed.length,percent};

        function getCategoryIcon(type) {
            switch(type) {
                case 'Server': return 'fa-server';
                case 'Switch': return 'fa-network-wired';
                case 'Router': return 'fa-route';
                case 'PDU': return 'fa-bolt';
                case 'Patch Panel': return 'fa-plug';
                case 'NAS': case 'Storage': return 'fa-hard-drive';
                case 'UPS': return 'fa-battery-full';
                default: return 'fa-microchip';
            }
        }

        // Phase 13G: lightweight, offline rack fascias configured per managed device type.
        const phase13GPresets = {automatic:'Automatic',switch24:'24-port switch',switch48:'48-port switch',server:'Server',router:'Router / firewall',storage:'Storage / NAS',ups:'UPS / PDU',plain:'Plain front panel'};
        function phase13GDefault(type) {
            const t=String(type||'').toLowerCase();
            if(t.includes('switch'))return 'switch24';
            if(t.includes('server'))return 'server';
            if(t.includes('router')||t.includes('firewall'))return 'router';
            if(t.includes('nas')||t.includes('storage'))return 'storage';
            if(t.includes('ups')||t.includes('pdu'))return 'ups';
            return 'plain';
        }
        function phase13GFascia(type) {
            const chosen=appState.deviceTypeGraphics?.[type];
            const preset=phase13GPresets[chosen]&&chosen!=='automatic'?chosen:phase13GDefault(type);
            const ports=count=>`<span class="phase13g-ports">${Array.from({length:count},(_,i)=>`<i title="Port ${i+1}"></i>`).join('')}</span>`;
            let contents='';
            if(preset==='switch24'||preset==='switch48')contents=ports(preset==='switch48'?48:24);
            else if(preset==='server')contents='<span class="phase13g-bays"><i></i><i></i><i></i><i></i></span><span class="phase13g-led"></span>';
            else if(preset==='router')contents='<span class="phase13g-led"></span>'+ports(6);
            else if(preset==='storage')contents='<span class="phase13g-bays"><i></i><i></i><i></i><i></i><i></i><i></i></span>';
            else if(preset==='ups')contents='<span class="phase13g-led"></span><span class="phase13g-display">POWER</span>';
            else contents='<span class="phase13g-display">'+escapeHtml(type||'DEVICE')+'</span>';
            return `<span class="phase13g-fascia phase13g-${preset}" title="${escapeHtml(type||'Device')} front panel" aria-hidden="true">${contents}</span>`;
        }
        function phase13GOpenGraphics(type) {
            if(!getUniqueDeviceTypes().includes(type))return;
            const current=appState.deviceTypeGraphics?.[type]||'automatic';
            openModal(`<div class="p-6 space-y-4"><div class="flex items-center justify-between"><h3 class="font-bold text-lg text-slate-900 dark:text-white">Rack graphic: ${escapeHtml(type)}</h3><button data-action="close-modal" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm text-slate-600 dark:text-slate-300">Choose a front-panel design for every rack-mounted device of this type. This does not affect inventory or rack placement.</p><label class="block text-sm font-semibold text-slate-900 dark:text-white">Graphic style<select id="phase13g-style" class="phase13c-field">${Object.entries(phase13GPresets).map(([key,label])=>`<option value="${key}" ${current===key?'selected':''}>${label}</option>`).join('')}</select></label><div class="flex justify-end gap-2"><button type="button" data-action="open-manage-types" class="phase13b-secondary caffoot-modal-cancel">Cancel</button><button type="button" data-action="phase13g-save" data-name="${escapeHtml(type)}" class="phase13b-primary">Save Graphic</button></div></div>`);
        }
        function phase13GSaveGraphics(type) {
            const choice=document.getElementById('phase13g-style')?.value;
            if(!getUniqueDeviceTypes().includes(type)||!Object.hasOwn(phase13GPresets,choice))return;
            if(!isPlainObject(appState.deviceTypeGraphics))appState.deviceTypeGraphics={};
            if(choice==='automatic')delete appState.deviceTypeGraphics[type];
            else appState.deviceTypeGraphics[type]=choice;
            saveState();openManageTypesModal();renderContent();
        }
        // Phase 13L: calculate occupancy by unique U slots, not by summing item heights.
        let phase13LHeight = 1;
        function phase13LUsage(rack, face) {
            const used = new Set();
            const height = Number(rack.heightU) || 0;
            appState.devices.filter(d => d.rackId === rack.id && (d.face || 'front') === face).forEach(d => {
                for (let u = Number(d.rackUStart); u <= Number(d.rackUEnd || d.rackUStart); u++) {
                    if (Number.isInteger(u) && u >= 1 && u <= height) used.add(u);
                }
            });
            (appState.rackAccessories || []).filter(a => a.rackId === rack.id && a.face === face).forEach(a => {
                for (let u = Number(a.startU); u < Number(a.startU) + Number(a.heightU); u++) {
                    if (Number.isInteger(u) && u >= 1 && u <= height) used.add(u);
                }
            });
            return {occupied:used.size, available:Math.max(0,height-used.size), capacity:height, percent:height?Math.round(used.size/height*100):0};
        }
        function phase13LFreeRuns(rack, face, requiredHeight = 1) {
            const height = Number(rack.heightU) || 0;
            const needed = Number(requiredHeight);
            if (!Number.isInteger(needed) || needed < 1 || needed > height) return [];
            const result = [];
            for (let start = 1; start + needed - 1 <= height; start++) {
                if (!validateRackPlacement(null, rack.id, face, start, start + needed - 1)) result.push(start);
            }
            return result;
        }
        function phase13LPrintRack(rackId) {
            const rack = appState.racks.find(r=>r.id===rackId);
            if (!rack) { showToast('Rack not found.', 'error'); return; }
            const w=window.open('','_blank');
            if (!w) { showToast('Allow pop-ups to print the rack elevation.', 'error'); return; }
            const safe = value => escapeHtml(String(value ?? ''));
            const pages=['front','rear'].map(face=>{
                const usage=phase13LUsage(rack,face);
                const slots=Array.from({length:Number(rack.heightU)},(_,i)=>Number(rack.heightU)-i).map(u=>{
                    const d=appState.devices.find(d=>d.rackId===rack.id&&(d.face||'front')===face&&Number(d.rackUStart)<=u&&Number(d.rackUEnd||d.rackUStart)>=u);
                    const a=(appState.rackAccessories||[]).find(a=>a.rackId===rack.id&&a.face===face&&!['pdu_vertical','cable_vertical'].includes(a.type)&&Number(a.startU)<=u&&Number(a.startU)+Number(a.heightU)-1>=u);
                    const item=d||a;
                    const name=d?.name||a?.name||'';
                    const cls=d?'device':a?'accessory':'empty';
                    const first=d?u===Number(d.rackUEnd||d.rackUStart):a?u===Number(a.startU)+Number(a.heightU)-1:false;
                    return `<tr class="${cls}"><th>U${u}</th><td>${item&&first?safe(name):item?'↳':''}</td></tr>`;
                }).join('');
                return `<section><h2>${face==='front'?'Front':'Rear'} elevation</h2><p>${usage.occupied}U occupied · ${usage.available}U available · ${usage.percent}% utilised</p><table>${slots}</table></section>`;
            }).join('');
            w.document.open();
            w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${safe(rack.name)} — Rack elevations</title><style>body{font:13px system-ui,sans-serif;color:#0f172a;margin:20px}h1{margin:0 0 4px}section{break-before:page;page-break-before:always}section:first-of-type{break-before:auto;page-break-before:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}tr{height:19px}th{width:55px;background:#1e293b;color:#fff;font-size:10px}td{padding:1px 12px;text-align:center;font-weight:600;border:1px solid #94a3b8}.device td{background:#14532d;color:white}.accessory td{background:#334155;color:white}.empty td{background:#f1f5f9}p{color:#475569}@media print{body{margin:8mm}section{break-inside:avoid}thead{display:table-header-group}}</style></head><body><h1>${safe(rack.name)}</h1><p>${safe(rack.location||'')} · ${safe(rack.heightU)}U · Printed ${safe(new Date().toLocaleString())}</p>${pages}</body></html>`);
            w.document.close();
            w.focus();
            // User initiates the browser print/PDF flow explicitly via the toolbar.
            w.print();
        }

        // v1.3.0 Phase 1A: estate-wide, read-only rack overview. Existing rack editor/elevations are unchanged.
        function renderRackHubV13() {
            const racks=appState.racks||[], devices=appState.devices||[], accessories=appState.rackAccessories||[];
            const totalU=racks.reduce((sum,r)=>sum+(Number(r.heightU)||0),0);
            const mounted=devices.filter(d=>racks.some(r=>r.id===d.rackId));
            const linkedAccessories=accessories.filter(a=>racks.some(r=>r.id===a.rackId));
            const card=(label,value,icon)=>`<div class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-5"><div class="text-sm font-semibold text-slate-600 dark:text-slate-300"><i class="fa-solid ${icon} mr-2" aria-hidden="true"></i>${label}</div><div class="text-3xl font-extrabold mt-2 text-slate-900 dark:text-white">${value}</div></div>`;
            let body='';
            if(v13RackSection==='overview') {
                const insights=racks.map(r=>{
                    const height=Math.max(0,Number(r.heightU)||0);
                    const rackDevices=mounted.filter(d=>d.rackId===r.id);
                    const rackAccessories=linkedAccessories.filter(a=>a.rackId===r.id);
                    const faces=['front','rear'].map(face=>{
                        const occupied=new Set();
                        const mark=(start,end)=>{if(!Number.isInteger(start)||!Number.isInteger(end)||end<start)return;for(let u=Math.max(1,start);u<=Math.min(height,end);u++)occupied.add(u);};
                        rackDevices.filter(d=>String(d.face||d.rackFace||'front').toLowerCase()===face).forEach(d=>mark(Number(d.rackUStart),Number(d.rackUEnd??d.rackUStart)));
                        rackAccessories.filter(a=>!['pdu_vertical','cable_vertical'].includes(a.type) && String(a.face||'front').toLowerCase()===face && Number(a.heightU)>0).forEach(a=>mark(Number(a.startU),Number(a.startU)+Number(a.heightU)-1));
                        let run=0,largest=0;
                        for(let u=1;u<=height;u++){run=occupied.has(u)?0:run+1;largest=Math.max(largest,run);}
                        return {face,used:occupied.size,free:height-occupied.size,largest};
                    });
                    return {rack:r,height,devices:rackDevices.length,accessories:rackAccessories.length,faces};
                });
                const totalFaceCapacity=insights.reduce((n,r)=>n+r.height*2,0);
                const usedFaceU=insights.reduce((n,r)=>n+r.faces[0].used+r.faces[1].used,0);
                const percent=totalFaceCapacity?Math.round(usedFaceU/totalFaceCapacity*100):0;
                const locations=new Map();
                insights.forEach(r=>{const name=r.rack.location||'Not recorded';const prev=locations.get(name)||{racks:0,devices:0};prev.racks++;prev.devices+=r.devices;locations.set(name,prev);});
                const tabs=[['capacity','Capacity'],['equipment','Equipment'],['locations','Locations & Types']];
                const tabNav=tabs.map(([id,label])=>`<button type="button" data-action="v13-overview-tab" data-tab="${id}" aria-pressed="${v13RackOverviewTab===id}" class="rounded-xl px-4 py-2.5 text-sm font-semibold ${v13RackOverviewTab===id?'bg-indigo-700 text-white':'border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}">${label}</button>`).join('');
                const bar=(used,height)=>`<div class="h-3 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden" role="img" aria-label="${used} of ${height} rack units occupied"><div class="h-full bg-indigo-600 dark:bg-indigo-400" style="width:${height?Math.min(100,Math.round(used/height*100)):0}%"></div></div>`;
                const chartBox=(title,description,content)=>`<div class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-5 space-y-4"><div><h3 class="font-bold text-slate-900 dark:text-white">${title}</h3><p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${description}</p></div>${content}</div>`;
                const chartRows=(entries,max,unit='')=>entries.map(([label,value])=>`<div class="space-y-1.5"><div class="flex justify-between gap-3 text-sm"><span class="text-slate-700 dark:text-slate-200 break-words">${escapeHtml(String(label))}</span><strong class="text-slate-900 dark:text-white whitespace-nowrap">${value}${unit}</strong></div><div class="h-3 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden"><div class="h-full bg-indigo-500 dark:bg-indigo-400 rounded-full" style="width:${max?Math.min(100,value/max*100):0}%"></div></div></div>`).join('')||'<p class="text-sm text-slate-500 dark:text-slate-400">No data recorded yet.</p>';
                // An illustrative rack diagram makes the distinction between total free U and contiguous free U explicit.
                const rackSpaceGuide=()=>{
                    const cells=Array.from({length:12},(_,i)=>{
                        const u=12-i,free=u>=7||u<=3;
                        return `<div class="flex items-center gap-2"><span class="w-5 text-right text-xs text-slate-500 dark:text-slate-400">${u}</span><div class="h-4 flex-1 rounded-sm border ${free?'border-emerald-300 dark:border-emerald-700 bg-emerald-100 dark:bg-emerald-900/40':'border-slate-400 dark:border-slate-500 bg-slate-300 dark:bg-slate-600'}"></div></div>`;
                    }).join('');
                    return chartBox('Understanding available rack space','Illustrative 12U rack — not a live reading or an actual inventory rack.',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-5 items-center"><div class="space-y-1" role="img" aria-label="12U example rack: units 12 through 7 free, units 6 through 4 occupied, units 3 through 1 free">${cells}</div><div class="space-y-4"><div><p class="text-sm text-slate-600 dark:text-slate-300">Total free space</p><strong class="text-2xl text-slate-900 dark:text-white">9U</strong><p class="text-xs text-slate-500 dark:text-slate-400">All empty units added together.</p></div><div class="border-t border-slate-200 dark:border-slate-700 pt-3"><p class="text-sm text-slate-600 dark:text-slate-300">Largest contiguous free block</p><strong class="text-2xl text-emerald-700 dark:text-emerald-400">6U</strong><p class="text-xs text-slate-500 dark:text-slate-400">Six uninterrupted empty units at the top. Actual device fit also depends on depth and mounting constraints.</p></div></div></div><div class="flex flex-wrap gap-4 text-xs text-slate-600 dark:text-slate-300"><span><i class="fa-solid fa-square text-emerald-500 mr-1" aria-hidden="true"></i>Free</span><span><i class="fa-solid fa-square text-slate-400 mr-1" aria-hidden="true"></i>Occupied</span></div>`);
                };
                let panel='';
                if(v13RackOverviewTab==='capacity'){
                    const front=insights.reduce((n,r)=>n+r.faces[0].used,0),rear=insights.reduce((n,r)=>n+r.faces[1].used,0);
                    const faceChart=chartRows([['Front occupied',front],['Rear occupied',rear]],totalU,'U');
                    const freeChart=chartRows(insights.map(r=>[r.rack.name,Math.max(r.faces[0].largest,r.faces[1].largest)]).sort((a,b)=>b[1]-a[1]),Math.max(1,...insights.map(r=>r.height)),'U');
                    panel=`<div class="space-y-4">${chartBox('Combined face utilisation','Front and rear rack-unit capacity are counted separately.',`${bar(usedFaceU,totalFaceCapacity)}<div class="flex flex-wrap justify-between gap-2 text-sm font-semibold text-slate-700 dark:text-slate-200"><span>${usedFaceU}U occupied</span><span>${totalFaceCapacity-usedFaceU}U free</span><span>${percent}% used</span></div>`)}<div class="grid grid-cols-1 xl:grid-cols-2 gap-4">${chartBox('Front vs rear occupancy','Occupied units on each face, compared with physical estate height.',`<div class="space-y-4">${faceChart}</div>`)}${chartBox('Largest contiguous free space','Longest uninterrupted empty U block on either the front or rear face of each rack. A rack can have more free U in total than this value.',`<div class="space-y-4">${freeChart}</div>`)}</div>${rackSpaceGuide()}</div>`;
                } else if(v13RackOverviewTab==='equipment'){
                    const counts=new Map();mounted.forEach(d=>{const name=d.type||'Unspecified';counts.set(name,(counts.get(name)||0)+1);});
                    const types=[...counts.entries()].sort((a,b)=>b[1]-a[1]);
                    panel=`<div class="grid grid-cols-1 xl:grid-cols-2 gap-4">${chartBox('Mounted equipment by type','Each bar counts devices assigned to a rack, grouped by their recorded device type. A device is counted once.',`<div class="space-y-4">${chartRows(types,Math.max(1,...types.map(x=>x[1])))}</div>`)}${chartBox('Devices and accessories by rack','Compare how many devices and rack accessories are recorded in each rack. These are item counts, not rack-unit usage.',`<div class="space-y-5">${insights.map(r=>`<div><p class="text-sm font-semibold text-slate-800 dark:text-slate-100 mb-2">${escapeHtml(r.rack.name)}</p><div class="space-y-2">${chartRows([['Devices',r.devices],['Accessories',r.accessories]],Math.max(1,...insights.map(x=>Math.max(x.devices,x.accessories))))}</div></div>`).join('')||'<p class="text-sm text-slate-500">No racks recorded.</p>'}</div>`)}</div>`;
                    panel+=chartBox('How to read these charts','Equipment figures describe saved inventory records, not live device status.',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm"><div class="rounded-xl bg-indigo-50 dark:bg-indigo-900/20 p-4"><i class="fa-solid fa-server text-indigo-600 dark:text-indigo-300 mr-2" aria-hidden="true"></i><strong class="text-slate-900 dark:text-white">Devices</strong><p class="mt-2 text-slate-600 dark:text-slate-300">A mounted server, switch or other device contributes one to its type and rack totals, regardless of its height in U.</p></div><div class="rounded-xl bg-slate-100 dark:bg-slate-700/60 p-4"><i class="fa-solid fa-layer-group text-slate-600 dark:text-slate-300 mr-2" aria-hidden="true"></i><strong class="text-slate-900 dark:text-white">Accessories</strong><p class="mt-2 text-slate-600 dark:text-slate-300">PDUs, cable managers and other recorded accessories are counted separately. A 0U accessory still counts as an item.</p></div></div>`);
                } else {
                    const ranked=[...locations.entries()].sort((a,b)=>b[1].racks-a[1].racks);
                    panel=`<div class="grid grid-cols-1 xl:grid-cols-2 gap-4">${chartBox('Racks by location','Each bar counts racks assigned to that location, regardless of rack height.',`<div class="space-y-4">${chartRows(ranked.map(([name,value])=>[name,value.racks]),Math.max(1,...ranked.map(x=>x[1].racks)))}</div>`)}${chartBox('Mounted devices by location','Each bar counts devices mounted in racks at that location; unmounted devices are excluded.',`<div class="space-y-4">${chartRows(ranked.map(([name,value])=>[name,value.devices]),Math.max(1,...ranked.map(x=>x[1].devices)))}</div><p class="text-xs text-slate-500 dark:text-slate-400">Rack-type charts will follow the Phase 1C rack-type schema update.</p>`)}</div>`;
                    panel+=chartBox('How to read location charts','Locations come from the rack records in your inventory.',`<div class="text-sm text-slate-700 dark:text-slate-200 space-y-2"><p><strong>Racks by location:</strong> a 12U cabinet and a 42U rack each count as one rack.</p><p><strong>Mounted devices by location:</strong> devices inherit their location from the rack they are mounted in. This is not a count of all devices at that site.</p><p class="text-xs text-slate-500 dark:text-slate-400">Locations not recorded are grouped under “Not recorded”.</p></div>`);
                }
                body=`<section class="space-y-5" aria-label="Estate-wide rack overview"><div><h2 class="text-xl font-bold text-slate-900 dark:text-white">Rack Overview</h2><p class="text-sm text-slate-600 dark:text-slate-300">Estate-wide rack capacity and equipment insights. Manage individual racks in Rack Inventory.</p></div><div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">${card('Total racks',racks.length,'fa-server')}${card('Physical rack capacity',totalU+'U','fa-ruler-vertical')}${card('Mounted devices',mounted.length,'fa-hard-drive')}${card('Rack accessories',linkedAccessories.length,'fa-layer-group')}</div><div class="flex flex-wrap gap-2" role="group" aria-label="Rack overview charts">${tabNav}</div>${panel}<p class="text-xs text-slate-500 dark:text-slate-400">Inventory-based estimates, not live monitoring. Front and rear capacity is counted separately; physical rack height is not doubled.</p></section>`;
            } else if(v13RackSection==='inventory') {
                if(v13RackDetailOpen && racks.some(r=>r.id===selectedRackId)) {
                    const selected=racks.find(r=>r.id===selectedRackId);
                    body=`<div class="space-y-4"><h2 class="text-xl font-bold text-slate-900 dark:text-white">${escapeHtml(selected.name)}</h2>${renderRacksHTML()}</div>`;
                } else {
                    const rackCards=racks.map(r=>{
                        const rackDevices=mounted.filter(d=>d.rackId===r.id);
                        const acc=linkedAccessories.filter(a=>a.rackId===r.id).length;
                        const height=Math.max(0,Number(r.heightU)||0);
                        const occupied=new Set();
                        rackDevices.forEach(d=>{
                            const start=Number(d.rackUStart),end=Number(d.rackUEnd??d.rackUStart);
                            if(Number.isInteger(start)&&Number.isInteger(end)&&end>=start)
                                for(let u=Math.max(1,start);u<=Math.min(height,end);u++) occupied.add(u);
                        });
                        const percent=height?Math.round(occupied.size/height*100):0;
                        const name=escapeHtml(r.name||'Unnamed rack'),location=escapeHtml(r.location||'Not recorded');
                        const search=escapeHtml((r.name||'')+' '+(r.location||''));
                        return `<button type="button" data-v13-rack-row data-search="${search}" data-action="v13-open-rack" data-id="${escapeHtml(r.id)}" class="group w-full text-left rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-5 shadow-sm hover:border-indigo-400 dark:hover:border-indigo-500 hover:shadow-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 transition-all">
                            <div class="flex justify-between items-start gap-3"><div class="rounded-xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-300 p-3"><i class="fa-solid fa-server" aria-hidden="true"></i></div><span class="text-xs font-bold rounded-full bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-1">${percent}%</span></div>
                            <h3 class="mt-4 font-bold text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-300 break-words">${name}</h3>
                            <p class="mt-1 text-sm text-slate-600 dark:text-slate-300"><i class="fa-solid fa-location-dot mr-1" aria-hidden="true"></i>${location}</p>
                            <div class="mt-4 flex justify-between gap-2 text-xs text-slate-600 dark:text-slate-300"><span>${height}U height</span><span>${occupied.size}U occupied</span></div>
                            <div class="mt-2 h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div class="h-full ${percent>=80?'bg-amber-500':'bg-indigo-500'}" style="width:${percent}%"></div></div>
                            <div class="mt-4 flex justify-between gap-2 text-sm text-slate-700 dark:text-slate-200"><span>${rackDevices.length} devices</span><span>${acc} accessories</span></div>
                            <div class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-700 flex justify-between items-center text-sm font-semibold text-indigo-600 dark:text-indigo-300"><span>View elevation</span><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></div>
                        </button>`;
                    }).join('');
                    body=`<section class="space-y-4" aria-label="Rack inventory"><div class="flex flex-wrap gap-3 justify-between items-center"><div><h2 class="text-xl font-bold text-slate-900 dark:text-white">Rack Inventory</h2><p class="text-sm text-slate-600 dark:text-slate-300">Select a rack card to view its equipment and settings.</p></div><button type="button" data-action="open-rack-modal" class="rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 text-sm font-bold"><i class="fa-solid fa-plus mr-2" aria-hidden="true"></i>Add Rack</button></div><div><label for="v13-rack-search" class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-2">Search racks</label><input id="v13-rack-search" type="search" placeholder="Search by rack name or location" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white px-3 py-2.5" /></div><div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${rackCards||'<p class="text-sm text-slate-600 dark:text-slate-300">No racks recorded yet. Add a rack to get started.</p>'}</div><p class="text-xs text-slate-500 dark:text-slate-400">Utilisation shows unique occupied rack units across both faces, not combined face capacity. Inventory-based estimates, not live monitoring.</p><p id="v13-rack-no-results" class="hidden text-sm text-slate-600 dark:text-slate-300">No racks match your search.</p></section>`;
                }
            } else {
                body=`<section class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-5 space-y-4"><h2 class="text-xl font-bold text-slate-900 dark:text-white">Rack Accessories</h2><p class="text-sm text-slate-600 dark:text-slate-300">Existing accessories remain editable from each rack's elevation. Choose a rack below to manage its accessories.</p>${racks.map(r=>`<button type="button" data-action="v13-open-rack" data-id="${escapeHtml(r.id)}" class="block w-full text-left rounded-xl border border-slate-200 dark:border-slate-700 px-4 py-3 hover:bg-indigo-50 dark:hover:bg-slate-700 font-semibold text-slate-900 dark:text-white">${escapeHtml(r.name)} — ${linkedAccessories.filter(a=>a.rackId===r.id).length} accessories</button>`).join('')||'<p class="text-sm text-slate-600 dark:text-slate-300">No racks recorded yet.</p>'}</section>`;
            }
            return `<div class="min-w-0">${body}</div>`;
        }

        document.addEventListener('change', event => {
            if (event.target?.id !== 'v13-rack-detail-select') return;
            const rack = appState.racks.find(r => r.id === event.target.value);
            if (!rack) return;
            selectedRackId = rack.id;
            phase13BRackTab = 'view';
            renderContent();
        });

        function renderRacksHTML() {
            const currentRack = appState.racks.find(r => r.id === selectedRackId) || appState.racks[0];

            if (!currentRack) {
                return `
                    <div class="space-y-6 text-center py-12">
                        <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto text-slate-400 text-xl">
                            <i class="fa-solid fa-hard-drive"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white">No Network Racks Defined</h3>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Create a rack enclosure to begin mounting hardware equipment.</p>
                        <button data-action="open-rack-modal" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold shadow-md">Add Network Rack</button>
                    </div>
                `;
            }

            const rackDevices = appState.devices.filter(d => d.rackId === currentRack.id);
            const faceDevices = rackDevices.filter(d => (d.face || 'front') === activeRackFace);
            const rackAccessories=(appState.rackAccessories||[]).filter(a=>a.rackId===currentRack.id);
            const faceAccessories=rackAccessories.filter(a=>a.face===activeRackFace && !phase13CAccessoryTypes[a.type]?.vertical);
            const verticalAccessories=rackAccessories.filter(a=>a.face===activeRackFace && phase13CAccessoryTypes[a.type]?.vertical);

            const faceUUsed = faceDevices.reduce((acc, d) => {
                const height = (parseInt(d.rackUEnd || d.rackUStart) - parseInt(d.rackUStart) + 1) || 1;
                return acc + height;
            }, 0);
            const accessoryUUsed=faceAccessories.reduce((sum,a)=>sum+a.heightU,0);
            const totalCapacityPercent = Math.min(100, Math.round(((faceUUsed+accessoryUUsed) / currentRack.heightU) * 100));

            const uMap = {};
            faceDevices.forEach(d => {
                const start = parseInt(d.rackUStart);
                const end = parseInt(d.rackUEnd || d.rackUStart);
                const minU = Math.min(start, end);
                const maxU = Math.max(start, end);
                for (let u = minU; u <= maxU; u++) {
                    uMap[u] = { device: d, isTopSlot: u === maxU };
                }
            });

            faceAccessories.forEach(a=>{for(let u=a.startU;u<a.startU+a.heightU;u++)uMap[u]={accessory:a,isTopSlot:u===a.startU+a.heightU-1};});
            let rackSlotsHtml = '';
            const heightU = currentRack.heightU || 42;

            for (let u = heightU; u >= 1; u--) {
                const occupancy = uMap[u];
                if (occupancy) {
                    if (occupancy.accessory) {
                        if(occupancy.isTopSlot){
                            const a=occupancy.accessory, kind=phase13CAccessoryTypes[a.type]||phase13CAccessoryTypes.blank;
                            rackSlotsHtml+=`<div draggable="true" data-rack-accessory="${escapeHtml(a.id)}" data-rack-face="${a.face==='rear'?'rear':'front'}" data-rack-drop-u="${u}" data-rack-drop-id="${escapeHtml(currentRack.id)}" style="height:${a.heightU*40}px" title="${escapeHtml(a.name||kind.label)} · ${kind.label} · ${a.heightU}U · ${a.face}" class="phase13-device phase13c-accessory phase13i-rack-item phase13h-rack-item border-b border-slate-400 dark:border-slate-600"><span class="phase13j-u" aria-label="Rack position">${a.heightU===1?`U${a.startU}`:`U${a.startU}–${a.startU+a.heightU-1}`}</span><span class="phase13i-name" title="${escapeHtml(a.name||kind.label)}">${escapeHtml(a.name||kind.label)}</span><div class="phase13i-actions"><button type="button" data-action="phase13c-edit" data-id="${escapeHtml(a.id)}" class="phase13c-icon" aria-label="Edit ${escapeHtml(a.name||kind.label)}"><i class="fa-solid fa-pen"></i></button><button type="button" data-action="phase13c-delete" data-id="${escapeHtml(a.id)}" class="phase13c-icon" aria-label="Remove ${escapeHtml(a.name||kind.label)}"><i class="fa-solid fa-trash"></i></button></div></div>`;
                        }
                        continue;
                    }
                    if (occupancy.isTopSlot) {
                        const dev = occupancy.device;
                        const start = parseInt(dev.rackUStart);
                        const end = parseInt(dev.rackUEnd || dev.rackUStart);
                        const span = Math.abs(end - start) + 1;
                        const isRear = dev.face === 'rear';
                        const badgeBg = isRear ? 'bg-purple-600 text-white' : 'bg-emerald-600 text-white';
                        const borderCol = isRear 
                            ? 'border-purple-300 dark:border-purple-800 bg-purple-50/90 dark:bg-purple-950/40' 
                            : 'border-emerald-300 dark:border-emerald-800 bg-emerald-50/90 dark:bg-emerald-950/40';

                        rackSlotsHtml += `
                            <div draggable="true" data-rack-device="${escapeHtml(dev.id)}" data-rack-face="${isRear?'rear':'front'}" data-rack-drop-u="${u}" data-rack-drop-id="${escapeHtml(currentRack.id)}" style="height: ${span * 40}px;" title="${escapeHtml(dev.name)} · ${escapeHtml(dev.type)} · ${escapeHtml(dev.primaryIp||'No IP')} · ${span}U · ${dev.face||'front'}" class="phase13-device phase13i-rack-item border-b border-slate-200 dark:border-slate-800 ${borderCol} transition hover:brightness-105 shadow-sm relative group">
                                <span class="phase13j-u" aria-label="Rack position">${span===1?`U${start}`:`U${start}–${end}`}</span>
                                <span class="phase13i-device-details"><span class="phase13i-name" title="${escapeHtml(dev.name)}">${escapeHtml(dev.name)}</span><span class="phase13i-device-meta" title="${escapeHtml(dev.type||'Device')} · ${escapeHtml(dev.primaryIp||'No IP recorded')}">${escapeHtml(dev.type||'Device')} · ${escapeHtml(dev.primaryIp||'No IP recorded')}</span></span>
                                <div class="phase13i-actions">
                                    <button data-action="assign-device" data-device-id="${escapeHtml(dev.id)}" data-rack-id="${escapeHtml(currentRack.id)}" data-u="${start}" class="phase13i-action" title="Edit placement" aria-label="Edit rack placement for ${escapeHtml(dev.name)}"><i class="fa-solid fa-pen"></i></button>
                                    <button data-action="unassign-device" data-id="${escapeHtml(dev.id)}" class="phase13i-action text-rose-600" title="Remove from rack" aria-label="Remove ${escapeHtml(dev.name)} from rack"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    }
                    continue;
                } else {
                    rackSlotsHtml += `
                        <button type="button" aria-label="Place equipment at U${u} on ${activeRackFace} of ${escapeHtml(currentRack.name)}" data-action="phase18b-place" data-rack-drop-u="${u}" data-rack-drop-id="${escapeHtml(currentRack.id)}" data-rack-id="${escapeHtml(currentRack.id)}" data-u="${u}" class="phase13-empty w-full h-10 border-b border-dashed border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 hover:bg-emerald-50/50 dark:hover:bg-emerald-950/20 cursor-pointer transition group">
                            <span class="text-xs font-mono font-bold text-slate-700 dark:text-slate-200 group-hover:text-emerald-800 dark:group-hover:text-emerald-200">U${u}</span>
                            <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-200 opacity-100 transition group-hover:text-emerald-800 dark:group-hover:text-emerald-200"><i class="fa-solid fa-plus mr-1" aria-hidden="true"></i> Place here (${activeRackFace})</span>
                        </button>
                    `;
                }
            }

            return `
                <div class="space-y-5 phase13b-workspace">
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 sm:p-5 space-y-3">
                        <div><h2 class="text-lg font-bold text-slate-900 dark:text-white">Rack Workspace</h2><p class="text-sm text-slate-600 dark:text-slate-300">Visualise equipment, review placements, or manage rack properties in separate sections.</p></div>
                        <nav class="phase13b-tabs" aria-label="Rack workspace sections">
                            ${[['view','Rack view','fa-server'],['equipment','Equipment','fa-list'],['settings','Rack settings','fa-gear']].map(([tab,label,icon])=>`<button type="button" data-action="phase13b-tab" data-tab="${tab}" aria-current="${phase13BRackTab===tab?'page':'false'}" class="phase13b-tab ${phase13BRackTab===tab?'phase13b-selected':''}"><i class="fa-solid ${icon} mr-2"></i>${label}</button>`).join('')}
                        </nav>
                    </div>
                    <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-2 min-w-0 w-full md:w-auto">
                            <label for="v13-rack-detail-select" class="text-xs font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap">Viewing rack</label>
                            <select id="v13-rack-detail-select" aria-label="Choose rack to view" class="w-full sm:w-72 max-w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white px-3 py-2 text-sm font-semibold">
                                ${appState.racks.map(r=>`<option value="${escapeHtml(r.id)}" ${r.id===currentRack.id?'selected':''}>${escapeHtml(r.name)}</option>`).join('')}
                            </select>
                        </div>

                        <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
                            <div class="${phase13BRackTab==='settings'?'hidden':'flex'} items-center bg-slate-100 dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
                                <button data-action="rack-face-front" aria-pressed="${activeRackFace === 'front'}" class="px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider transition flex items-center space-x-1.5 ${activeRackFace === 'front' ? 'bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}">
                                    <i class="fa-solid fa-desktop"></i>
                                    <span>Front</span>
                                </button>
                                <button data-action="rack-face-rear" aria-pressed="${activeRackFace === 'rear'}" class="px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider transition flex items-center space-x-1.5 ${activeRackFace === 'rear' ? 'bg-white dark:bg-slate-800 text-orange-700 dark:text-orange-400 shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}">
                                    <i class="fa-solid fa-server"></i>
                                    <span>Rear</span>
                                </button>
                            </div>

                        </div>
                    </div>

                    <section class="${phase13BRackTab==='view'?'':'hidden'} space-y-4" aria-label="Visual rack view">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start ${Number(currentRack.heightU)>12?'phase17d-tall-layout':''}">
                        <div class="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden flex flex-col ${Number(currentRack.heightU)>12?'phase17d-tall-panel':''}">
                            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <span class="w-3 h-3 rounded-full ${activeRackFace === 'front' ? 'bg-emerald-500' : 'bg-orange-500'}"></span>
                                    <h3 class="font-bold text-base text-slate-900 dark:text-white">${escapeHtml(currentRack.name)} — <span class="uppercase text-sm ${activeRackFace === 'front' ? 'text-emerald-600 dark:text-emerald-400' : 'text-orange-700 dark:text-orange-400'}">${activeRackFace} View</span></h3>
                                </div>
                                <span class="text-xs text-slate-600 dark:text-slate-300 font-semibold">${faceDevices.length} devices · ${faceAccessories.length} accessories · ${totalCapacityPercent}% ${activeRackFace} face occupied</span>
                            </div>

                            <div class="phase17d-rack-scroll p-6 overflow-y-auto custom-scrollbar bg-slate-100 dark:bg-slate-900/80" data-rack-scroll="true" data-rack-scrollable="${Number(currentRack.heightU) > 12 ? 'true' : 'false'}" tabindex="0" aria-label="Scrollable rack elevation">
                                <div class="phase13k-elevation max-w-5xl mx-auto bg-white dark:bg-slate-800 border-2 border-slate-300 dark:border-slate-700 rounded-xl shadow-inner overflow-hidden">
                                    <div class="bg-slate-800 text-slate-200 px-4 py-2 text-xs font-bold flex justify-between uppercase tracking-wider">
                                        <span>Rack Units (U)</span>
                                        <span>Equipment — ${activeRackFace.toUpperCase()} face</span>
                                        <span>Placement</span>
                                    </div>
                                    <div class="phase13-vertical-layout" aria-label="0U vertical accessory rail preview">
                                        ${phase13VRenderRail(currentRack,verticalAccessories,"left")}
                                        <div class="flex flex-col min-w-0">
                                            ${rackSlotsHtml}
                                        </div>
                                        ${phase13VRenderRail(currentRack,verticalAccessories,"right")}
                                    </div>
                                    <div class="phase13-vertical-rail-labels" aria-label="Side orientation as viewed from ${activeRackFace} face">
                                        <span>L</span><span>As viewed from ${activeRackFace} face</span><span>R</span>
                                    </div>
                                    <div class="bg-slate-800 text-slate-400 px-4 py-2 text-xs text-center font-mono">
                                        ${escapeHtml(currentRack.location || 'Server Room')} • Total Height: ${currentRack.heightU}U
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">
                                <div class="flex items-center justify-between gap-2 mb-3"><h3 class="font-bold text-base text-slate-900 dark:text-white">Rack Capacity &amp; Details</h3><button type="button" data-action="phase13l-print" data-id="${escapeHtml(currentRack.id)}" class="phase13b-secondary"><i class="fa-solid fa-print mr-1"></i> Print / PDF</button></div>
                                <p class="text-xs text-slate-600 dark:text-slate-300 mb-3">Each face has ${currentRack.heightU}U of potential mounting positions. Front and rear figures are separate; they do not double the physical rack height.</p>
                                <div class="space-y-3 text-sm">
                                    ${['front','rear'].map(face=>{const v=phase13LUsage(currentRack,face);return `<div class="space-y-1"><div class="flex justify-between gap-2"><span class="font-semibold capitalize">${face}</span><span class="font-mono">${v.occupied}U used · ${v.available}U free</span></div><div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden" role="progressbar" aria-label="${face} utilisation" aria-valuenow="${v.percent}" aria-valuemin="0" aria-valuemax="100"><div class="h-full ${face==='front'?'bg-emerald-700':'bg-orange-500'}" style="width:${v.percent}%"></div></div></div>`;}).join('')}
                                    <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-700">
                                        <span class="text-slate-500">Location</span>
                                        <span class="font-medium text-slate-900 dark:text-white">${escapeHtml(currentRack.location || 'N/A')}</span>
                                    </div>
                                    <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-700">
                                        <span class="text-slate-500 dark:text-slate-400">Physical rack height</span>
                                        <span class="font-medium text-slate-900 dark:text-white">${currentRack.heightU} U</span>
                                    </div>
                                    <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-700">
                                        <span class="text-slate-500">Front Mounted Devices</span>

        function phase120ManufacturerSave(id='',remove=false){
            const items=phase120HardwareCatalogue().map(x=>({...x}));
            const entry=items.find(x=>x.id===id&&!x.model);
            const builtInName=typeof id==='string'&&id.startsWith('builtin:')?id.slice(8):'';
            const makerName=entry?.manufacturer||builtInName;
            const seedTypes=Object.entries(phase120HardwareSeed).filter(([type,m])=>Object.keys(m).some(n=>n.toLowerCase()===makerName.toLowerCase())).map(([type])=>type);
            const builtIn=seedTypes.length>0||['Dell','HP','HPE','Lenovo','ASUS','Apple','Cisco','Samsung','Microsoft','Toshiba'].some(n=>n.toLowerCase()===makerName.toLowerCase());
            if(id&&!entry&&!builtInName)return;
            if(remove&&builtIn){showToast('Built-in manufacturers cannot be removed.','error');return;}
            const previousName=makerName?.toLowerCase();
            const existing=previousName?items.filter(x=>!x.model&&x.manufacturer.toLowerCase()===previousName):[];
            let name='',types=[];
            if(!remove){
                const field=document.getElementById('phase120-maker-name');
                const error=document.getElementById('phase120-maker-error');
                name=String(field?.value||'').trim();
                types=[...document.querySelectorAll('input[name="phase120-maker-type"]:checked')].map(x=>x.value);
                types.push(...seedTypes);
                types=[...new Set(types)];
                const message=builtIn&&name.toLowerCase()!==makerName.toLowerCase()?'Built-in manufacturer names cannot be changed.':!name?'Enter a manufacturer name.':name.length>120?'Manufacturer name must be 120 characters or fewer.':!types.length?'Select at least one device type.':types.some(t=>items.some(x=>!x.model&&!existing.includes(x)&&x.type===t&&x.manufacturer.toLowerCase()===name.toLowerCase()))?'This manufacturer already has a custom association for a selected device type.':'';
                if(message){if(error){error.textContent=message;error.classList.remove('hidden');}field?.focus();return;}
            }
            // Only manufacturer-only rows are managed here. Model rows remain untouched.
            const keep=items.filter(x=>!existing.includes(x));
            if(!remove){
                types.filter(type=>!seedTypes.includes(type)).forEach(type=>{
                    const old=existing.find(x=>x.type===type);
                    keep.push(old?{...old,manufacturer:name}:{id:'hardware_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9),type,manufacturer:name,model:''});
                });
            }
            const previous=appState.hardwareCatalogue;
            appState.hardwareCatalogue=keep;
            if(!saveState()){if(previous===undefined)delete appState.hardwareCatalogue;else appState.hardwareCatalogue=previous;showToast('Could not save the catalogue.','error');return;}
            closeModal(true);
            renderContent();
            showToast(remove?'Manufacturer suggestions removed.':'Manufacturer saved.');
        }

        function phase120ModelAllowedTypes(manufacturer){

            const custom=phase120HardwareCatalogue().filter(x=>!x.model&&x.manufacturer.toLowerCase()===key&&x.type!=='Server - Virtual').map(x=>x.type);
            return [...new Set([...builtin,...custom])].sort((a,b)=>a.localeCompare(b));
        }

        function phase120ModelSave(id='',remove=false){
            const items=phase120HardwareCatalogue().map(x=>({...x}));
            const item=items.find(x=>x.id===id&&x.model);
            if(id&&!item)return;
            let model='',manufacturer='',type='';
            if(!remove){
                model=String(document.getElementById('phase120-model-name')?.value||'').trim();
                manufacturer=String(document.getElementById('phase120-model-manufacturer')?.value||'').trim();
                type=String(document.getElementById('phase120-model-device-type')?.value||'').trim();
                const seeded=(phase120HardwareSeed[type]||{});
                const builtin=Object.entries(seeded).some(([m,models])=>m.toLowerCase()===manufacturer.toLowerCase()&&models.some(v=>v.toLowerCase()===model.toLowerCase()));
                const duplicate=items.some(x=>x.id!==id&&x.type===type&&x.manufacturer.toLowerCase()===manufacturer.toLowerCase()&&String(x.model||'').toLowerCase()===model.toLowerCase());
                const allowed=phase120ModelAllowedTypes(manufacturer);
                const legacy=!!item&&item.manufacturer===manufacturer&&item.type===type;
                const error=!model?'Enter a model name.':!manufacturer?'Select a manufacturer.':!type?'Select a device type.':!allowed.includes(type)&&!legacy?'This device type is not associated with this manufacturer. Update Manufacturers first.':builtin?'This is already a built-in model suggestion.':duplicate?'This model suggestion already exists.':'';
                if(error){const el=document.getElementById('phase120-model-error');if(el){el.textContent=error;el.classList.remove('hidden');}return;}
            }
            if(remove)items.splice(items.findIndex(x=>x.id===id),1);
            else if(item)Object.assign(item,{model,manufacturer,type});
            else items.push({id:'hardware_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8),model,manufacturer,type});
            const previous=appState.hardwareCatalogue;
            appState.hardwareCatalogue=items;
            if(!saveState()){if(previous===undefined)delete appState.hardwareCatalogue;else appState.hardwareCatalogue=previous;showToast('Could not save the model.','error');return;}
            closeModal(true);renderContent();showToast(remove?'Model suggestion removed.':'Model suggestion saved.');
        }

        function phase10SubnetSummary(subnet) {
            const range=phase12Cidr(subnet?.cidr);
            if(!range) return {supported:false,cidr:subnet?.cidr||'',capacity:0,assigned:0,reserved:0,available:0,next:null,utilisation:0,duplicates:[]};

            }
            const duplicates=[...owners].filter(([,a])=>a.length>1).map(([ip,owners])=>({ip,owners}));
            let assigned=0,reserved=0,next=null;
            for(let n=range.first;n<=range.lastHost;n++) {
                const ip=phase12IpString(n), alloc=appState.ipAllocations[ip];
                const status=alloc?.status||(owners.has(ip)?'Assigned':'Available');
                if(status==='Reserved') reserved++;
                else if(status==='Assigned') assigned++;
                else if(ip===subnet.gateway) reserved++; // Protected without writing an allocation record.
                else if(next===null && status==='Available' && !owners.has(ip)) next=ip;
            }
            return {supported:true,cidr:subnet.cidr,capacity:range.capacity,assigned,reserved,

                utilisation:Math.round((assigned+reserved)/range.capacity*100),duplicates};

        // Phase 12B: CIDR-aware, bounded bulk edits. Offset 1 is the first usable IP.
        function phase12BBulkPlan(subnet, start, end, status, hostname, notes) {
            const range=phase12Cidr(subnet?.cidr);
            if (!range) return {error:'Unsupported or invalid subnet.'};
            if (!Number.isInteger(start)||!Number.isInteger(end)||start<1||end<start||end>range.capacity)
                return {error:`Enter host offsets from 1 to ${range.capacity}, in ascending order.`};
            if (end-start+1>512) return {error:'Maximum 512 addresses per operation. Split larger ranges into batches.'};
            if (!['Reserved','Available'].includes(status)) return {error:'Choose Reserve or Release.'};
            const changes=[],blocked=[];
            for(let offset=start;offset<=end;offset++) {
                const ip=phase12IpString(range.network+offset);
                if (ip === subnet.gateway) { blocked.push(ip); continue; }
                const owners=appState.devices.filter(d=>d.primaryIp===ip);
                const old=appState.ipAllocations[ip];
                if (owners.length || (old?.deviceId && getDeviceById(old.deviceId))) {
                    blocked.push(ip); continue;
                }
                if(status==='Available') {
                    if(old && old.status!=='Available') changes.push({ip,offset,old,updated:null});
                } else {
                    if(old?.status==='Assigned') {blocked.push(ip);continue;}
                    const updated={...old,status:'Reserved',deviceId:'',hostname:hostname?`${hostname}-${offset}`:(old?.hostname||''),notes:notes||old?.notes||''};
                    if(JSON.stringify(old)!==JSON.stringify(updated)) changes.push({ip,offset,old,updated});
                }
            }
            return {changes,blocked,range,status};
        }

        function handleBulkIpSubmit(e,subnetId) {
            e.preventDefault();
            const subnet=appState.subnets.find(s=>s.id===subnetId);
            const start=Number(document.getElementById('bulk-start')?.value),end=Number(document.getElementById('bulk-end')?.value);
            const status=document.getElementById('bulk-status')?.value;
            const hostname=document.getElementById('bulk-hostname')?.value.trim()||'';

            const plan=phase12BBulkPlan(subnet,start,end,status,hostname,notes);
            if(plan.error) return showToast(plan.error,'error');
            const sample=plan.changes.slice(0,6).map(x=>x.ip).join(', ');
            openModal(`<div class="p-6 space-y-4"><h3 class="font-bold text-lg text-slate-900 dark:text-white">Confirm bulk ${status==='Reserved'?'reservation':'release'}</h3>
