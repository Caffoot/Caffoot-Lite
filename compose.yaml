services:
  caffoot-lite:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CAFFOOT_WEB_ADDRESS: "${CAFFOOT_WEB_ADDRESS:?Set the HTTPS browser address in CAFFOOT_WEB_ADDRESS}"
      CAFFOOT_SERVER_ADDRESS: "${CAFFOOT_SERVER_ADDRESS:?Set the server IP or hostname in CAFFOOT_SERVER_ADDRESS}"
      CAFFOOT_PORT: "${CAFFOOT_PORT:-8080}"
    ports:
      - "${CAFFOOT_PORT:-8080}:8080"
    # The default uses a Docker-managed named volume. Keep CAFFOOT_DATA_PATH
    # unchanged if an existing installation uses a custom host directory.
    volumes:
      - "${CAFFOOT_DATA_PATH:-caffoot_data}:/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://127.0.0.1:8080/health', context=ssl._create_unverified_context(), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caffoot_data:
