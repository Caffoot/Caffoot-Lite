<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Caffoot Lite — #452 design proposal</title><style>
:root{--canvas:#f2f5f8;--white:#fff;--ink:#17334b;--muted:#718ba1;--line:#d8e3ed;--orange:#ee852c;--control:#fff}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:var(--ink);background:var(--canvas)}body.dark{--canvas:#0f172a;--white:#1e293b;--ink:#f1f5f9;--muted:#cbd5e1;--line:#475569;--control:#0f172a}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ed852c;outline-offset:2px}button{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-size:12px;font-weight:700}button.primary{background:var(--orange);border-color:var(--orange);color:white}button:disabled{opacity:.5;cursor:not-allowed}.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}aside{background:#142b40;color:#e0ebf5;padding:22px 12px;display:flex;flex-direction:column;gap:6px}.brand{padding:0 8px 30px;font-size:19px;font-weight:bold;color:white}.brand span{color:#f48a35}.brand small{display:block;font-size:9px;letter-spacing:1px;color:#a9bed1}.navlabel{font-size:10px;font-weight:bold;letter-spacing:1.4px;color:#a1b9d0;margin:10px 10px}.nav{padding:12px 10px;border:none;background:none;text-align:left;color:inherit;font-weight:bold;display:block;width:100%;border-radius:9px}.nav.child{padding-left:24px}.nav.active{background:#2c435a;color:white}.nav.off{cursor:default}.bottom{margin-top:auto;border-top:1px solid #395065;padding-top:12px}.top{height:61px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-size:12px}.main{padding:26px 34px}.preview{font-size:11px;color:var(--muted);margin:0 0 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{font-size:11px;font-weight:bold;letter-spacing:1.6px;color:#cc7025}.header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:5px 0 24px;flex-wrap:wrap}h1{margin:0;font-size:30px;letter-spacing:-1px}h2{font-size:19px;margin:0 0 8px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.55;margin:8px 0;color:var(--muted)}.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}.cardhead{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}.toolbar,.actions,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.actions{justify-content:flex-end}.field{display:grid;gap:8px;min-width:0}.field label{font-weight:700;font-size:12px}input:not([type=checkbox]),select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--control);padding:11px 12px;min-height:40px}input[readonly]{background:var(--canvas)}.toolbar{margin-bottom:16px;align-items:end}.toolbar .field:first-child{width:min(440px,100%)}.table{padding:0;overflow-x:auto}.listrow{display:grid;grid-template-columns:1.4fr .85fr .85fr 1fr 155px;gap:12px;align-items:center;padding:18px;min-width:750px;border-bottom:1px solid var(--line)}.listhead{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:var(--muted);padding-top:14px;padding-bottom:14px}.who{display:flex;align-items:center;gap:12px}.initial{border-radius:50%;width:36px;height:36px;display:grid;place-items:center;background:#e5edf3;color:#416783;font-weight:bold;flex:none}.small{font-size:11px;color:var(--muted);line-height:1.6}.badge{display:inline-block;border-radius:14px;background:#e5eff8;color:#31658b;padding:5px 9px;font-size:10px;font-weight:700;margin:2px 2px 2px 0}.green{background:#e1f2e9;color:#247557}.neutral{background:#e7edf3;color:#405b73}.footer{padding:14px 18px;color:var(--muted);font-size:11px}.main-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(315px,.8fr);gap:17px;align-items:start}.fields,.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.wide{grid-column:1/-1}.hint{background:var(--canvas);border-radius:9px;padding:13px;font-size:12px;color:var(--muted);line-height:1.6}.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}.toggle input{appearance:none;width:40px;height:23px;border-radius:30px;background:#bcc9d6;position:relative;cursor:pointer;flex:none}.toggle input:before{content:'';width:17px;height:17px;position:absolute;top:3px;left:3px;background:white;border-radius:50%}.toggle input:checked{background:var(--orange)}.toggle input:checked:before{left:20px}.info-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:13px 0;font-size:12px}.info-row span{color:var(--muted)}.access-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.access{border:1px solid var(--line);border-radius:10px;padding:12px}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:bold;color:var(--muted);margin:22px 0 12px}.role{display:flex;align-items:center;gap:10px;padding:9px 0}dialog{background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:15px;max-height:90vh;width:min(700px,95vw);padding:0}dialog::backdrop{background:#142b409e}.modal-head{padding:22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;gap:10px}.modal-body{padding:22px}.status{font-size:12px;color:var(--muted)}.tab{border:none;border-radius:0;border-bottom:2px solid transparent;background:none}.tab.selected{border-bottom-color:var(--orange)}[hidden]{display:none!important}@media(max-width:1100px){.main-grid{grid-template-columns:1fr}}@media(max-width:700px){.shell{grid-template-columns:1fr}aside{display:none}.main{padding:16px}.top{padding:0 16px}.fields,.two-col{grid-template-columns:1fr}.access-grid{grid-template-columns:1fr 1fr}.header h1{font-size:25px}} 
.table .listrow{grid-template-columns:minmax(180px,1.4fr) minmax(100px,.85fr) minmax(155px,.85fr) minmax(140px,1fr) 172px;min-width:831px}.table .listrow:not(.listhead){padding-top:14px;padding-bottom:14px}.table .listrow .actions{flex-wrap:nowrap;gap:7px}.table .listrow .actions button{white-space:nowrap;padding:8px 10px;min-height:36px}.staff-list-status{display:flex;align-items:center;gap:5px;flex-wrap:nowrap}.staff-list-status .badge{white-space:nowrap;margin:0}.table .listrow .who>div,.table .listrow .small{overflow-wrap:anywhere}
</style><body><div class="shell"><aside><div class="brand">Caffoot <span>Lite</span><small>INFRASTRUCTURE, SIMPLIFIED.</small></div><div class="navlabel">WORKSPACE</div><div class="nav off">▣　My Equipment</div><div class="nav off">◷　My Tickets</div><div class="nav off">⚒　IT　⌄</div><div class="nav child off">Devices</div><div class="nav child off">IPAM</div><div class="nav child off">Network Racks</div><div class="nav child off">Service Desk</div><div class="nav off">♧　Staff　⌄</div><button class="nav child active" id="staffnav" onclick="list()">Staff Members</button><div class="nav child off">Departments</div><button class="nav child" id="permnav" onclick="permissions()">Permissions</button><div class="nav off">◷　Audit Trail</div><div class="bottom"><div class="nav off">⚙　Settings & Data</div><div class="nav off">▤　Collapse Menu</div></div></aside><div><div class="top"><span>Caffoot Lite　›　<b id="crumb">Staff Members</b></span><button onclick="document.body.classList.toggle('dark')">Light / Dark</button></div><main class="main"><div class="preview"><span>DESIGN PREVIEW #452 · fictional data · changes only in this page</span><button onclick="location.reload()">Reset Preview</button></div><div id="content"></div></main></div></div><dialog id="manage"></dialog><script>
const C=document.querySelector('#content'), M=document.querySelector('#manage'); const sections=['Devices','IPAM','Racks','Staff Members','Departments','IT Assets','Suppliers','Service Desk'];let people=[{id:1,first:'Alex',last:'Morgan',email:'alex.morgan@example.org',department:'IT',job:'Support Technician',phone:'',location:'',active:true,login:'alex.morgan',mfa:true,role:true,access:{Devices:'Edit'},accountActive:true},{id:2,first:'Jamie',last:'Taylor',email:'',department:'Finance',job:'',phone:'',location:'',active:true,login:'',access:{}},{id:3,first:'',last:'',email:'',department:'',job:'',phone:'',location:'',active:true,login:'legacy.user',mfa:true,role:false,access:{},accountActive:true}];let next=4;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const name=p=>[p.first,p.last].filter(Boolean).join(' ')||'Name Not Recorded';const get=id=>people.find(p=>p.id===id);const b=(s,fn,primary=false)=>`<button type="button" ${primary?'class="primary"':''} onclick="${fn}">${s}</button>`;function nav(staff=true){document.querySelector('#crumb').textContent=staff?'Staff Members':'Permissions';document.querySelector('#staffnav').classList.toggle('active',staff);document.querySelector('#permnav').classList.toggle('active',!staff)}function header(title,desc,actions='',eyebrow='STAFF DIRECTORY'){return `<div class="eyebrow">${eyebrow}</div><div class="header"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}function field(label,key,value='',type='text',req=false){return `<div class="field"><label for="${key}">${label}</label><input id="${key}" name="${key}" type="${type}" value="${esc(value)}" ${req?'required':''} ${type==='password'?'autocomplete="new-password"':''}></div>`}function select(label,key,opts,value){return `<div class="field"><label for="${key}">${label}</label><select id="${key}" name="${key}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}function badge(s,cls=''){return `<span class="badge ${cls}">${s}</span>`}function list(){nav();C.innerHTML=header('Staff Members','Manage Staff profiles and optional Caffoot logins.',b('+ Add Staff Member','staffForm()',true))+`<div class="toolbar">${field('Find A Staff Member','search')}${select('Staff Status','filter',['All Statuses','Active','Inactive'],'All Statuses')}</div><div class="card table"><div class="listrow listhead"><span>Staff Member</span><span>Department</span><span>Login & Status</span><span>Contact & Location</span><span>Actions</span></div><div id="rows"></div><div class="footer" id="count"></div></div>`;document.querySelector('#search').placeholder='Search by name, username or department…';document.querySelector('#search').oninput=rows;document.querySelector('#filter').onchange=rows;rows()}function rows(){let q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;let visible=people.filter(p=>[name(p),p.login,p.department].join(' ').toLowerCase().includes(q)&&(f==='All Statuses'||(f==='Active')===p.active));document.querySelector('#rows').innerHTML=visible.map(p=>`<div class="listrow"><div class="who"><span class="initial">${esc(p.first[0]||'?')}</span><div><strong>${esc(name(p))}</strong>${p.login?`<div class="small">Username: ${esc(p.login)}</div>`:''}${!p.first?'<div class="small">Migrated Record · Details Blank</div>':''}</div></div><div>${esc(p.department||'No Department')}</div><div class="staff-list-status">${badge(p.login?'Linked Login':'No Login','neutral')}${badge(p.active?'Active':'Inactive',p.active?'green':'neutral')}</div><div class="small">${esc(p.email||'No Email Recorded')}<br>${esc(p.location)}</div><div class="actions">${b('View Details',`details(${p.id})`)}${b('Edit',`staffForm(${p.id})`)}</div></div>`).join('')||'<p style="padding:20px">No matching Staff Members.</p>';document.querySelector('#count').textContent=`Showing ${visible.length} of ${people.length} Staff Members`}
function staffForm(id,forceLogin=false){nav();let p=get(id)||{first:'',last:'',email:'',department:'',job:'',phone:'',location:'',active:true,login:''};C.innerHTML=header(id?'Edit Staff Member':'Add Staff Member','A Staff profile does not require a Caffoot login.',b('Back To Staff Members','list()'))+`<form id="staffform"><div class="main-grid"><div class="card"><div class="cardhead"><h3>Personal Details</h3><p>Basic information about the person, whether or not they sign in.</p></div><div class="fields">${field('First Name *','first',p.first,'text',!id)}${field('Surname *','last',p.last,'text',!id)}<div class="wide">${field('Email Address','email',p.email,'email')}</div>${select('Department · Optional','department',['No Department','IT','Finance'],p.department||'No Department')}${field('Job Title','job',p.job)}${field('Telephone Number','phone',p.phone)}${field('Location','location',p.location)}<div class="wide">${select('Staff Status','staffstatus',['Active','Inactive'],p.active?'Active':'Inactive')}<p class="small">Changing Staff status does not automatically enable or disable a Caffoot login.</p></div></div></div><div><div class="card"><div class="cardhead"><h3>Caffoot Login</h3><p>Optional account access, managed using the existing permissions system.</p></div>${p.login?`<strong>${esc(p.login)}</strong><p>${badge('Linked Account','green')}</p>${b('Manage Permissions',`openManage(${id})`)}`:`<label class="toggle"><span><strong>Create Caffoot Login</strong><br><span class="small">Enable this if the person needs to sign in to Caffoot Lite.</span></span><input type="checkbox" id="createLogin" ${forceLogin?'checked':''}></label><div id="loginfields" hidden><div class="section-label">Account details</div>${field('Username *','username')}${field('Initial Password *','password','','password')}${field('Confirm Initial Password *','confirm','','password')}<div class="hint" style="margin-top:15px"><strong>Staff Member — default role</strong><br>New logins have no inventory access. Configure additional access after saving, here in Staff Details.</div></div>`}</div><div class="card"><h3>Equipment And Ticket Access</h3><p>A Staff record can hold equipment without a login. A linked login provides only permitted personal access.</p><p>• Equipment stays linked to this Staff Member.<br>• Eligible linked users can access My Equipment and My Tickets.<br>• No automatic IT inventory permission or department-based grant.</p></div></div></div><div class="card row" style="justify-content:space-between"><span class="small">Save the Staff record and optional login together.</span><div class="actions">${b('Cancel',id?`details(${id})`:'list()')}<button type="submit" class="primary">Save Staff Member</button></div></div><p id="error" role="alert"></p></form>`;let toggle=document.querySelector('#createLogin');if(toggle){let update=()=>{document.querySelector('#loginfields').hidden=!toggle.checked;['username','password','confirm'].forEach(k=>document.getElementById(k).required=toggle.checked)};toggle.onchange=update;update()}document.querySelector('#staffform').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);let creating=toggle?.checked;let u=String(d.get('username')||'').trim();let error=document.querySelector('#error');if(creating&&(!u||d.get('password')!==d.get('confirm')||people.some(a=>a.login.toLowerCase()===u.toLowerCase()))){error.textContent='Enter a unique username and matching passwords.';return}let saved={...p,id:id||next++,first:d.get('first'),last:d.get('last'),email:d.get('email'),department:d.get('department')==='No Department'?'':d.get('department'),job:d.get('job'),phone:d.get('phone'),location:d.get('location'),active:d.get('staffstatus')==='Active',login:creating?u:p.login,access:p.access||{},mfa:creating?false:p.mfa,accountActive:creating?true:p.accountActive};if(id)people=people.map(x=>x.id===id?saved:x);else people.push(saved);details(saved.id,creating?'Staff Member and login saved in preview.':'Staff Member saved in preview.')}}
function info(k,v){return `<div class="info-row"><span>${k}</span><strong>${esc(v||'Not Recorded')}</strong></div>`}function details(id,message=''){nav();let p=get(id);C.innerHTML=header('Staff Details',esc(name(p)),b('Back To Staff Members','list()')+b('Edit Staff Member',`staffForm(${id})`,true))+`<div class="row" style="justify-content:space-between;margin-bottom:18px"><div><h2>${esc(name(p))}</h2><p>${esc(p.department||'No Department')}</p></div>${badge(p.active?'Active':'Inactive','green')}</div>${message?`<p class="hint" role="status">${esc(message)}</p>`:''}<div class="two-col"><div class="card"><h3>Personal Details</h3>${info('First Name',p.first)}${info('Surname',p.last)}${info('Email Address',p.email)}${info('Telephone',p.phone)}</div><div class="card"><h3>Organisation</h3>${info('Department',p.department||'No Department')}${info('Job Title',p.job)}${info('Location',p.location)}<p>Staff status is independent of account status.</p></div></div><div class="card"><h3>Caffoot Login</h3>${p.login?`${info('Username',p.login)}${info('Account Status',p.accountActive?'Active':'Disabled')}${info('Authenticator',p.mfa?'MFA Enrolled':'Not Enrolled')}${info('Assigned Roles',p.role?'Staff Member, IT Staff':'Staff Member')}<div class="actions" style="margin-top:16px">${b('Manage Permissions',`openManage(${id})`)}</div>`:`<p>This Staff Member has no Caffoot login.</p>${b('Create Login',`staffForm(${id},true)`)}`}</div><div style="margin:16px 0">${b(p.active?'Mark Inactive':'Reactivate',`toggleStaff(${id})`)}</div><div class="card"><h3>Assigned Equipment</h3><p>Existing equipment actions and records remain unchanged. Not simulated in this preview.</p></div><div class="card"><h3>Assignment History</h3><p>Existing assignment history remains unchanged.</p></div>`}function toggleStaff(id){let p=get(id);if(confirm('Change Staff status only? Login and equipment are unchanged.')){p.active=!p.active;details(id)}}
function openManage(id){let p=get(id);M.innerHTML=`<div class="modal-head"><div><h2>Manage ${esc(p.login)}</h2><p>Review access and account controls for this user.</p></div>${b('Close ×','M.close()')}</div><div class="modal-body">${badge(p.accountActive?'Active':'Disabled','green')}${badge('Staff Member')}${badge(p.mfa?'MFA Enrolled':'Not Enrolled','neutral')}<div class="section-label">Account details</div><div class="field"><label for="readonlyUser">Username</label><input id="readonlyUser" readonly value="${esc(p.login)}"><span class="small">Username used to sign in. Personal details are managed on Staff Details.</span></div><div class="section-label">Assigned roles</div><p>Staff Member is automatic. Enabled additional roles and wider access require MFA.</p><label class="role"><input type="checkbox" checked disabled>Staff Member · Protected</label><label class="role"><input type="checkbox" id="itrole" ${p.role?'checked':''} ${p.mfa?'':'disabled'}>IT Staff · Protected</label><div class="section-label">Section permissions</div><p>Choose Inherit, No Access, Read or Edit. Individual overrides take precedence.</p>${!p.mfa?'<p class="hint">MFA must be enrolled before granting wider access. This preview does not enrol MFA.</p>':''}<div class="access-grid">${sections.map((s,i)=>`<div class="access">${select(s,'access'+i,['Inherit','No Access','Read','Edit'],p.access[s]||'Inherit')}<p class="small">Inherited: No Access<br>Effective: ${esc(p.access[s]||'No Access')}</p></div>`).join('')}</div><div class="section-label">Account controls</div><p class="hint">Existing protected account status, password, authenticator and account deletion controls remain. Their security actions are not simulated.</p><div class="actions">${b('Cancel','M.close()')}${b('Save Access',`saveAccess(${id})`,true)}</div></div>`;if(!p.mfa)M.querySelectorAll('.access select').forEach(x=>x.disabled=true);M.showModal()}function saveAccess(id){let p=get(id);if(p.mfa){p.role=M.querySelector('#itrole').checked;sections.forEach((s,i)=>p.access[s]=M.querySelector('#access'+i).value)}M.close();details(id,'Access choices saved in preview only.')}function permissions(){nav(false);C.innerHTML=header('Permissions','Manage reusable roles and their section permissions.','','ACCOUNT ADMINISTRATION')+`<div class="hint">Administrator-only workspace. Individual accounts are managed in Staff Members.</div><div class="row" style="margin:18px 0;border-bottom:1px solid var(--line)"><button class="tab selected" onclick="roleTab(false,this)">Overview</button><button class="tab" onclick="roleTab(true,this)">Manage Roles</button></div><div id="rolepanel" class="card"><h3>Security roles</h3><p>Staff Member is the default role. Additional roles and wider access require MFA.</p><p>Existing role definitions and their access rules remain unchanged.</p></div>`}function roleTab(manage,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');document.querySelector('#rolepanel').innerHTML=manage?'<h3>Manage Roles</h3><p>Existing reusable role management is retained. Role editing is outside this preview.</p><div class="info-row"><b>Staff Member</b><span>Protected</span></div><div class="info-row"><b>IT Staff</b><span>Protected</span></div>':'<h3>Security roles</h3><p>Staff Member is the default role. Additional roles and wider access require MFA.</p>'}list();</script></body></html>
