.attention-pill.warranty-soon{background:#fff1e4;color:#976222;border-color:#f2d8b1}.attention-pill.warranty-expired{background:#fff0ed;color:#aa4e44;border-color:#ecc4be}.attention-pill.replacement-soon{background:#eaf2fd;color:#356ea3;border-color:#caddf2}.attention-pill.replacement-overdue{background:#ffeded;color:#a53e43;border-color:#f3c5c7}.attention-pill.historical{background:#f0f3f7;color:#657c8e;border-color:#dbe4eb}
html.dark .attention-pill.warranty-soon{background:#533e29;color:#ffd9a0;border-color:#745536}html.dark .attention-pill.warranty-expired{background:#532c2c;color:#ffbcb2;border-color:#794445}html.dark .attention-pill.replacement-soon{background:#244366;color:#c0dffe;border-color:#375e84}html.dark .attention-pill.replacement-overdue{background:#532b32;color:#ffb6c1;border-color:#78404c}html.dark .attention-pill.historical{background:#334155;color:#d5e1ed;border-color:#506177}
.data-table td{vertical-align:top}.data-table td:first-child .date-muted{display:block}.data-table td:last-child{min-width:164px}.data-table td:nth-child(4),.data-table td:nth-child(5){white-space:nowrap}
.details-link{border:none;background:none;padding:0;font:inherit;font-size:11.5px;color:#ad6b35;text-decoration:underline;text-underline-offset:3px;font-weight:750;text-align:left}.details-link:hover{color:var(--heading)}
.db-metric{cursor:pointer}.db-metric.picked{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.db-metric .db-metric-head{align-items:flex-start}.db-metric .db-metric-head .iconwrap{flex-shrink:0}
.review-only{border:1px solid var(--notice-border);background:var(--notice-bg);color:var(--notice-text);border-radius:10px;font-size:11px;line-height:1.7;padding:12px 15px;margin:13px 0 17px}
.review-only strong{color:inherit}.empty-state{text-align:center;padding:33px 15px;color:var(--secondary);font-size:12px}
.preview-tabs-note{color:var(--secondary);font-size:12px;padding:24px;background:var(--soft);border:1px dashed var(--line);border-radius:10px;line-height:1.7}
.detail-visit{padding:14px 16px;display:none;align-items:flex-start;justify-content:space-between;gap:14px;margin-top:14px;background:var(--soft);border:1px solid var(--line);border-radius:11px;font-size:11.5px}.detail-visit.show{display:flex}.detail-visit strong{color:var(--heading)}.detail-visit p{margin:4px 0 0;color:var(--secondary);line-height:1.6}
.date-muted{font-size:10px;color:var(--secondary);margin-top:4px}.filter-status{border-bottom:1px solid var(--line);padding:10px 0 0;line-height:1.6}
@media(max-width:700px){.subnav{gap:15px}.subnav button{font-size:12px}.filter-field{flex:1 1 170px}.filter-field.search{flex:1 1 100%}.data-table td:last-child{min-width:0}.data-table td:nth-child(4),.data-table td:nth-child(5){white-space:normal}.db-metric-head{min-width:0}}
</style></head><body>
<div class="reviewbar" role="region" aria-label="Prototype review controls"><div class="reviewbar-left"><span class="review-label">STAGE 4 · DESIGN REVIEW</span><span>Lifecycle tab only · fictional Devices · no changes to Caffoot Lite</span></div>
<div class="review-controls"><label for="scenario">Example data</label><select id="scenario"><option value="sample">Example devices</option><option value="few">Few devices</option><option value="empty">No devices</option></select><label for="access">Lifecycle access</label><select id="access"><option value="enabled">Enabled</option><option value="disabled">Feature off</option><option value="denied">No access</option></select><button id="theme" class="mode-btn" type="button" aria-pressed="false">Dark mode</button></div></div>
<div class="nav-scrim" id="nav-scrim" aria-hidden="true"></div><div class="shell">
<aside class="sidebar" aria-label="Application navigation illustration">
 <div class="brand"><div class="brandmark" aria-hidden="true">c</div><div class="brand-text"><div class="brand-name">Caffoot <span>Lite</span></div><div class="brand-sub">INFRASTRUCTURE, SIMPLIFIED.</div></div></div>
 <div class="nav-label">WORKSPACE</div>
 <div class="nav-group"><div class="nav-parent-row"><button class="nav-item nav-parent current" id="it-nav" type="button" aria-expanded="true" aria-controls="it-children" data-page="it" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 4a6 6 0 0 0-7 7L2 16l6 6 5-5a6 6 0 0 0 7-7l-5 4-5-5Z"/></svg><span class="nav-text">IT</span></button><button type="button" class="nav-toggle" id="it-toggle" data-toggle-group="it" aria-expanded="true" aria-controls="it-children" aria-label="Collapse IT submenu"><span aria-hidden="true">›</span></button></div><div class="nav-children" id="it-children"><button type="button" class="nav-sub" data-page="it-child" data-label="Devices">Devices</button><button type="button" class="nav-sub" data-page="it-child" data-label="IT Assets">IT Assets</button><button type="button" class="nav-sub" data-page="it-child" data-label="IPAM">IPAM</button><button type="button" class="nav-sub" data-page="it-child" data-label="Network Racks">Network Racks</button></div></div>
 <div class="nav-group"><button class="nav-item nav-parent" id="staff-nav" type="button" aria-expanded="false" aria-controls="staff-children" data-page="staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1"/></svg><span class="nav-text">Staff</span><span class="chevron" aria-hidden="true">›</span></button><div class="nav-children" id="staff-children" hidden><button class="nav-sub" type="button" data-page="staff-child" data-label="Staff Members">Staff Members</button><button class="nav-sub" type="button" data-page="staff-child" data-label="Departments">Departments</button></div></div>
 <div class="nav-group" id="purchasing-group"><div class="nav-parent-row"><button class="nav-item nav-parent" id="purchasing-nav" type="button" aria-expanded="false" aria-controls="purchasing-children" data-page="purchasing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 8h18l-2 12H5L3 8Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg><span class="nav-text">Purchasing</span></button><button type="button" class="nav-toggle" id="purchasing-toggle" data-toggle-group="purchasing" aria-expanded="false" aria-controls="purchasing-children" aria-label="Collapse Purchasing submenu"><span aria-hidden="true">›</span></button></div><div class="nav-children" id="purchasing-children" hidden><button type="button" class="nav-sub" id="suppliers-nav" data-page="suppliers">Suppliers</button></div></div>
 <button type="button" class="nav-item" data-page="other" data-label="Audit Trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11a9 9 0 1 1 2.5 6.5M3 4v7h7M12 7v5l3 2"/></svg><span class="nav-text">Audit Trail</span></button>
 <div class="nav-bottom"><button type="button" class="nav-item" data-page="other" data-label="My Equipment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M8 13h8M8 17h8"/></svg><span class="nav-text">My Equipment</span></button><button type="button" class="nav-item" data-page="other" data-label="Settings &amp; Data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3m0-14-3 3m-8 8-3 3"/></svg><span class="nav-text">Settings &amp; Data</span></button><div class="identity"><span class="avatar">DA</span><div class="identity-text"><div class="who">Demo Administrator</div><div class="meta">Preview only</div></div></div><button class="sidebar-button" id="sidebar-toggle" type="button" aria-label="Collapse or expand menu"><span aria-hidden="true">≡</span><span class="collapse-text">Collapse Menu</span></button></div>
</aside>
<div class="workspace"><header class="topbar"><button type="button" id="mobile-nav-toggle" class="mobile-menu-button" aria-label="Open navigation menu" aria-expanded="false">☰</button><div class="crumb"><span>Caffoot Lite</span><span aria-hidden="true">›</span><span id="crumb-section">IT</span><span aria-hidden="true">›</span><b id="crumb-page">Dashboard</b></div><div class="top-right"><span class="role">Preview Administrator</span><span class="topavatar">DA</span></div></header><main class="main" id="main-content"></main></div></div>
<script>
'use strict';
/* DESIGN-REVIEW DEMONSTRATION ONLY. No backend, real user data or app changes.
   Fixed example date = 17 November 2026; notice periods = 90 exact days. */
const DAY=86400000, TODAY='2026-11-17';
const devices=[
{id:'d1',name:'CORE-SRV-01',type:'Physical Server',status:'Active',warranty:'2026-11-23',replacement:'2027-06-10'},
{id:'d2',name:'FIN-PC-04',type:'Desktop',status:'Active',warranty:'2026-10-01',replacement:'2026-12-02'},
{id:'d3',name:'IT-LAP-12',type:'Laptop',status:'Active',warranty:'2027-05-12',replacement:'2026-10-28'},
{id:'d4',name:'HR-PC-03',type:'Desktop',status:'Maintenance',warranty:'2026-11-17',replacement:'2026-11-17'},
{id:'d5',name:'PRINT-SRV-02',type:'Physical Server',status:'Active',warranty:'2024-08-25',replacement:'2027-05-19'},
{id:'d6',name:'OPS-LAP-06',type:'Laptop',status:'Active',warranty:'2027-03-18',replacement:'2027-01-28'},
{id:'d7',name:'OPS-PC-18',type:'Desktop',status:'Active',warranty:'2027-01-31',replacement:'2027-09-07'},
{id:'d8',name:'SPARE-PC-01',type:'Desktop',status:'Retired',warranty:'2023-01-14',replacement:'2024-03-15'},
{id:'d9',name:'DC-SRV-04',type:'Physical Server',status:'Retired',warranty:'2026-11-19',replacement:'2026-11-20'},
{id:'d10',name:'DEV-LAP-08',type:'Laptop',status:'Active',warranty:'',replacement:''},
{id:'d11',name:'LAB-PC-07',type:'Desktop',status:'Active',warranty:'2027-02-15',replacement:'2027-05-03'},
{id:'d12',name:'MEET-PC-02',type:'Desktop',status:'Active',warranty:'',replacement:'2027-01-12'}
];
const defs=[{key:'warranty-soon',label:'Warranty Expiring Soon',sub:'Warranty expires within 90 days',icon:'calendar',tone:'orange'},
{key:'warranty-expired',label:'Warranty Expired',sub:'Recorded warranty date has passed',icon:'alert',tone:'orange'},
{key:'replacement-soon',label:'Replacement Due Soon',sub:'Planned replacement within 90 days',icon:'calendar',tone:''},
{key:'replacement-overdue',label:'Replacement Overdue',sub:'Planned replacement date has passed',icon:'alert',tone:'orange'}];
const state={tab:'lifecycle',theme:'light',access:'enabled',scenario:'sample',filter:'all',type:'all',search:'',retired:false,section:'it',selected:''};
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 10h18"/>',alert:'<path d="M12 3 2 21h20L12 3Zm0 6v5m0 4h.01"/>',history:'<path d="M3 11a9 9 0 1 1 2.5 6.5M3 4v7h7M12 7v5l3 2"/>',check:'<path d="m5 12 5 5L20 7"/>',box:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M8 13h8M8 17h8"/>'};
const svg=name=>`<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true">${icons[name]}</svg>`;
const wrap=(name,tone='')=>`<span class="iconwrap ${tone}">${svg(name)}</span>`;
const utc=x=>Date.parse(x+'T00:00:00Z');
const days=x=>x?Math.round((utc(x)-utc(TODAY))/DAY):null;
function types(d){if(d.status==='Retired')return []; const w=days(d.warranty),r=days(d.replacement),a=[]; if(w!==null){if(w<0)a.push('warranty-expired');else if(w<=90)a.push('warranty-soon')}if(r!==null){if(r<0)a.push('replacement-overdue');else if(r<=90)a.push('replacement-soon')}return a}
function fmt(v){if(!v)return 'Not recorded';const [y,m,d]=v.split('-').map(Number);return new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d)))}
function entries(){if(state.scenario==='empty')return [];if(state.scenario==='few')return devices.slice(0,3);return devices}
function metrics(){const live=entries().filter(x=>x.status!=='Retired');return Object.fromEntries(defs.map(z=>[z.key,live.filter(x=>types(x).includes(z.key)).length]))}
const tabnames=[['overview','Overview'],['insights','Insights'],['activity','Activity'],['lifecycle','Lifecycle']];
function setNavGroup(id,expanded){const b=el(id+'-nav'),p=el(id+'-children'),t=el(id+'-toggle');if(!b||!p)return;b.setAttribute('aria-expanded',String(expanded));p.hidden=!expanded;if(t){t.setAttribute('aria-expanded',String(expanded));t.setAttribute('aria-label',(expanded?'Collapse ':'Expand ')+id+' submenu')}}
function setMobileNav(open){document.querySelector('.sidebar').classList.toggle('mobile-open',open);el('nav-scrim').classList.toggle('open',open);el('mobile-nav-toggle').setAttribute('aria-expanded',String(open))}
function metric(z){const n=metrics()[z.key];return `<button type="button" class="db-metric ${state.filter===z.key?'picked':''}" data-filter-card="${z.key}" aria-pressed="${state.filter===z.key}" aria-label="${esc(z.label)}: ${n}. Filter equipment"><span class="db-metric-head">${esc(z.label)}${wrap(z.icon,z.tone)}</span><strong>${n}</strong><small>${esc(z.sub)}</small></button>`}
function badges(d){if(d.status==='Retired')return `<span class="attention-pill historical">Retired · historical dates</span>`;const v=types(d);return v.length?v.map(t=>`<span class="attention-pill ${t}">${esc(defs.find(o=>o.key===t).label)}</span>`).join(''):'<span class="date-muted">No upcoming warning</span>'}
function row(d){return `<tr><td data-label="Device"><button type="button" class="details-link" data-device="${d.id}" aria-label="Open existing Device Details for ${esc(d.name)}">${esc(d.name)}</button><span class="date-muted">${esc(d.type)}</span></td><td data-label="Status">${esc(d.status)}</td><td data-label="Warranty Expiry">${esc(fmt(d.warranty))}</td><td data-label="Replacement">${esc(fmt(d.replacement))}</td><td data-label="Attention"><div class="status-pills">${badges(d)}</div></td></tr>`}
function rows(){let data=entries().filter(d=>state.retired||d.status!=='Retired');if(state.filter!=='all')data=data.filter(d=>types(d).includes(state.filter));else if(!state.retired)data=data.filter(d=>types(d).length>0);if(state.type!=='all')data=data.filter(d=>d.type===state.type);if(state.search)data=data.filter(d=>`${d.name} ${d.type} ${d.status}`.toLowerCase().includes(state.search.toLowerCase()));data.sort((a,b)=>{const p=d=>Math.min(...[d.warranty,d.replacement].filter(Boolean).map(x=>Math.abs(days(x))),999999);return p(a)-p(b)||a.name.localeCompare(b.name)});return data}
function tableHTML(){const a=rows();return a.length?`<div class="table-scroll" role="region" tabindex="0" aria-label="Lifecycle example equipment list"><table class="data-table"><thead><tr><th>Device</th><th>Status</th><th>Warranty Expiry</th><th>Planned Replacement</th><th>Attention</th></tr></thead><tbody>${a.map(row).join('')}</tbody></table></div>`:'<div class="empty-state">No Devices match the current selection.</div>'}
function renderTable(){el('results').innerHTML=tableHTML();el('result-count').textContent=`Showing ${rows().length} ${rows().length===1?'Device':'Devices'} in this example`;document.querySelectorAll('[data-filter-card]').forEach(b=>{b.classList.toggle('picked',b.dataset.filterCard===state.filter);b.setAttribute('aria-pressed',String(b.dataset.filterCard===state.filter))});}
function render(){const main=el('main-content');document.querySelectorAll('.sidebar [data-page]').forEach(b=>{let current=(state.section==='it'&&b.dataset.page==='it')||(state.section!=='it'&&b.dataset.page===state.section);b.classList.toggle('current',current);if(current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});el('crumb-section').textContent=state.section==='it'?'IT':state.section==='purchasing'?'Purchasing':'IT';el('crumb-page').textContent=state.section==='it'?'Dashboard':state.selected||'Approved section';
if(state.section!=='it'){main.innerHTML=`<div class="eyebrow">NAVIGATION REFERENCE</div><div class="header"><div><h1>${esc(state.selected||'Existing section')}</h1><p>The approved destination is not being redesigned in this Lifecycle-only review.</p></div></div><div class="preview-tabs-note">Return to <button type="button" class="btn" data-go-it="true">IT Dashboard</button> to review the new Lifecycle tab. Existing application sections stay exactly as approved.</div>`;return;}
const allowed=state.access==='enabled';if(!allowed&&state.tab==='lifecycle')state.tab='overview';
main.innerHTML=`<div class="caffoot-dashboard"><div class="eyebrow">YOUR INFRASTRUCTURE AT A GLANCE</div><div class="header"><div><h1>Dashboard</h1><p>An organised view of your saved Devices, IPAM and Network Racks.</p></div></div>
<nav class="subnav dashboard-tabs" aria-label="Dashboard sections" role="tablist">${tabnames.filter(z=>allowed||z[0]!=='lifecycle').map(([key,label])=>`<button type="button" role="tab" aria-selected="${state.tab===key}" data-tab="${key}" class="${state.tab===key?'active':''}">${label}</button>`).join('')}</nav>
${!allowed?`<div class="review-only"><strong>${state.access==='disabled'?'Lifecycle feature is switched off.':'Viewer does not have Lifecycle access.'}</strong> The three existing Dashboard tabs remain available; Lifecycle content and warnings are hidden. Stored lifecycle values remain preserved.</div>`:''}
${state.tab!=='lifecycle'?`<div class="preview-tabs-note"><strong>${esc(tabnames.find(t=>t[0]===state.tab)[1])} — existing, unchanged Dashboard tab.</strong><p>This approved application content is intentionally <strong>not recreated</strong> in the Lifecycle review preview. The real application's ${esc(tabnames.find(t=>t[0]===state.tab)[1])} screen stays exactly as it is.</p>${allowed?'<button type="button" class="btn btn-primary" data-tab="lifecycle">Preview Lifecycle tab</button>':''}</div>`:
`<section aria-label="Lifecycle overview"><div class="panel-head"><div><h2>Equipment Lifecycle</h2><p>Warranty and replacement planning based on saved Device dates. Warnings are informational only.</p></div><div class="version">Example reference date: 17 Nov 2026</div></div>
<section class="db-summary" aria-label="Lifecycle summary cards">${defs.map(metric).join('')}</section>
<section class="card db-card" aria-labelledby="attention-heading"><div class="card-head">${wrap('box','orange')}<div><h3 id="attention-heading">Equipment Requiring Attention</h3><p class="sub">Active and Maintenance Devices by default. Open an existing Device record to review its dates.</p></div></div><div class="divider"></div>
<div class="filters-row"><div class="filter-field search"><label for="device-search">Search Devices</label><input class="input" type="search" id="device-search" placeholder="Device name, type or status" value="${esc(state.search)}"></div><div class="filter-field"><label for="condition-filter">Attention</label><select class="input" id="condition-filter"><option value="all">All conditions</option>${defs.map(d=>`<option value="${d.key}" ${state.filter===d.key?'selected':''}>${d.label}</option>`).join('')}</select></div><div class="filter-field"><label for="type-filter">Device Type</label><select class="input" id="type-filter"><option value="all">All Device Types</option>${['Desktop','Laptop','Physical Server'].map(t=>`<option value="${t}" ${state.type===t?'selected':''}>${t}</option>`).join('')}</select></div><label class="show-retired"><input id="show-retired" type="checkbox" ${state.retired?'checked':''}>Include Retired history</label></div>
<div class="table-summary"><span id="result-count"></span><button type="button" class="btn" id="reset-filters">Clear Filters</button></div><div id="results">${tableHTML()}</div><div class="detail-visit" id="detail-visit" aria-live="polite"></div>
<p class="section-note">A Device may appear in more than one summary count. Missing dates do not trigger warnings. Retired Devices retain their dates but are not shown as routine outstanding replacement work.</p></section>
<div class="review-only"><strong>Design boundary:</strong> The existing Dashboard's Overview, Insights and Activity screens, Add Device form and individual Device Details are not redesigned here. The selected Device would open the existing Device Details experience. Separate 90-day warnings are configurable by administrators in Settings &amp; Data; this tab does not edit the global settings.</div></section>`}</div>`;
if(state.tab==='lifecycle')renderTable();}
const nav=(page,label)=>{state.section=page==='it'?'it':page;state.selected=label||page;if(page==='it')setNavGroup('it',true);if(page==='purchasing')setNavGroup('purchasing',true);setMobileNav(false);render()};
function changeTab(tab){if(tab==='lifecycle'&&state.access!=='enabled')return;state.tab=tab;render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.id==='theme'){state.theme=state.theme==='light'?'dark':'light';document.documentElement.classList.toggle('dark',state.theme==='dark');b.textContent=state.theme==='light'?'Dark mode':'Light mode';b.setAttribute('aria-pressed',String(state.theme==='dark'));return}
if(b.dataset.tab){changeTab(b.dataset.tab);return}
if(b.dataset.filterCard){state.filter=state.filter===b.dataset.filterCard?'all':b.dataset.filterCard;render();return}
if(b.id==='reset-filters'){state.filter='all';state.type='all';state.search='';state.retired=false;render();return}
if(b.dataset.device){let d=entries().find(x=>x.id===b.dataset.device);const panel=el('detail-visit');if(!d||!panel)return;panel.classList.add('show');panel.innerHTML=`<div><strong>Existing Device Details: ${esc(d.name)}</strong><p>In Caffoot Lite this opens the existing Device record, where the separately approved lifecycle editing controls will be available. This review deliberately does not recreate that form.</p></div><button class="btn" data-close-detail="true" type="button">Dismiss</button>`;return}
if(b.dataset.closeDetail){el('detail-visit').classList.remove('show');return}
if(b.dataset.goIt){nav('it');return}
if(b.dataset.toggleGroup){const id=b.dataset.toggleGroup;setNavGroup(id,el(id+'-nav').getAttribute('aria-expanded')==='false');return}
if(b.dataset.page){if(b.dataset.page==='staff'){setNavGroup('staff',el('staff-nav').getAttribute('aria-expanded')==='false');return}nav(b.dataset.page,b.dataset.label);return}
if(b.id==='mobile-nav-toggle'){setMobileNav(!document.querySelector('.sidebar').classList.contains('mobile-open'));return}
if(b.id==='sidebar-toggle'){if(innerWidth<=780)setMobileNav(!document.querySelector('.sidebar').classList.contains('mobile-open'));else document.querySelector('.shell').classList.toggle('sidebar-collapsed');return}
});
document.addEventListener('input',e=>{if(e.target.id==='device-search'){state.search=e.target.value;renderTable()}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){state.scenario=e.target.value;state.filter='all';state.search='';state.type='all';render();return}if(e.target.id==='access'){state.access=e.target.value;render();return}if(e.target.id==='condition-filter'){state.filter=e.target.value;render();return}if(e.target.id==='type-filter'){state.type=e.target.value;render();return}if(e.target.id==='show-retired'){state.retired=e.target.checked;render();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')setMobileNav(false)});
el('nav-scrim').addEventListener('click',()=>setMobileNav(false));
render();
</script></body></html>
