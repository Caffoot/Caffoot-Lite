function renderLocations(s){return `<div class="section-heading"><div><h2>Supplier Locations</h2><p>Multiple offices and branches, sharing company-wide contacts without duplicates.</p></div>${action(`${icon('plus')} Add Location`,'add-location','btn-primary')}</div><div class="row-list">${s.locations.map(l=>{const local=s.contacts.filter(c=>c.companyWide||c.locationIds.includes(l.id));return `<div class="card card-padded"><div class="between"><div><h3>${html(l.name)} ${l.id===s.mainLocationId?'<span class="pill blue">Primary Address</span>':''}</h3><div class="description">${formatAddress(l)}</div></div>${action(`${icon('edit')} Edit Location`,'edit-location','btn-sm btn-outline').replace('data-action=',`data-id="${html(l.id)}" data-action=`)}</div><div class="divider"></div><div class="between"><h3>Contacts At This Location</h3><span class="pill">${local.length} Contacts</span></div>${local.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Contact</th><th>Role</th><th>Location Scope</th><th></th></tr></thead><tbody>${local.map(c=>`<tr><td><button type="button" class="row-link" data-action="open-contact" data-id="${html(c.id)}">${html(c.name)}</button></td><td>${html(c.role)}</td><td>${c.companyWide?'<span class="tag">Company-wide</span>':html(formatContactLocation(s,c))}</td><td>${action('View','open-contact','btn-sm').replace('data-action=',`data-id="${html(c.id)}" data-action=`)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted small">No Location-Specific Or Company-wide Contacts Yet.</div>'}</div>`}).join('')}</div><div class="handback">Company-wide Contacts appear in every Location list; multi-Location Contacts appear wherever assigned, but remain a single Contact record.</div>`;}

 const editing=kind==='edit-contact',c=editing?findContact(s,id):{name:'',role:'',phones:[],emails:[],profiles:[],companyWide:false,locationIds:[]};
 title=editing?'Edit Contact':'Add Contact';subtitle='One Contact Record Can Serve Several Supplier Locations';submitLabel=editing?'Save Contact':'Add Contact';wide=true;
 content=`<form id="contact-form" data-contact-id="${editing?html(id):''}"><div class="field-grid"><div class="field"><label>Contact Name *</label><input name="contactName" required value="${html(c.name)}"></div><div class="field"><label>Job Title / Role</label><input name="role" value="${html(c.role)}" placeholder="Account Manager"></div><div class="field"><label>Telephone Numbers</label><textarea name="phones" placeholder="One Telephone Number Per Line">${html(c.phones.join('\n'))}</textarea></div><div class="field"><label>Email Addresses</label><textarea name="emails" placeholder="One Email Address Per Line">${html(c.emails.join('\n'))}</textarea></div><div class="field full"><label>Professional / Social Links</label><textarea name="profiles" placeholder="One Per Line: LinkedIn | https://www.linkedin.com">${html(c.profiles.map(p=>p.label+' | '+p.url).join('\n'))}</textarea><small>Use a label and a full web address, separated by |.</small></div></div><div class="form-section"><div class="two-check"><label><input type="checkbox" name="companyWide" id="contact-company-wide" ${c.companyWide?'checked':''}> Company-wide Contact</label></div><p>Company-wide Contacts appear at every Location. Otherwise choose one or more Locations.</p><div id="contact-location-choices" class="check-grid">${locationChecks(s,c.locationIds)}</div></div></form>`;
}else if(kind==='open-contact'){
 const c=findContact(s,id);if(!c){notify('Contact Not Found');return;}
 title=c.name;subtitle='Contact Details';wide=true;
 const related=s.issues.filter(i=>i.contactIds.includes(c.id));
 content=`<div class="between"><div>${badge(c.companyWide?'Company-wide':'Location Contact')} <span class="muted small">${html(c.role)}</span></div><button class="btn btn-sm" data-action="edit-contact" data-id="${html(c.id)}">${icon('edit')} Edit Contact</button></div>
<div class="grid-two" style="margin-top:16px"><div class="soft-card"><h4>Contact Information</h4><div class="info-row"><span>Telephone</span><strong>${c.phones.map(html).join('<br>')||'Not Recorded'}</strong></div><div class="info-row"><span>Email</span><strong>${c.emails.map(html).join('<br>')||'Not Recorded'}</strong></div><div class="info-row"><span>Locations</span><strong>${html(formatContactLocation(s,c))}</strong></div><div class="info-row"><span>Professional Links</span><strong>${c.profiles.length?c.profiles.map(p=>`<a href="${html(p.url)}" target="_blank" rel="noopener noreferrer">${html(p.label)} ${icon('link',12)}</a>`).join('<br>'):'Not Recorded'}</strong></div></div><div class="soft-card"><div class="between"><h4>Contact Notes</h4><button class="btn btn-sm" data-action="add-contact-note" data-id="${html(c.id)}">${icon('plus')} Add Note</button></div>${c.notes.length?c.notes.map(n=>`<div class="note"><div class="between"><small>${html(n.date)}</small><button class="btn btn-sm btn-outline" data-action="edit-contact-note" data-id="${html(n.id)}" data-contact-id="${html(c.id)}">${icon('edit')} Edit</button></div><p>${html(n.text)}</p></div>`).join(''):'<p class="muted small">No Contact Notes Yet.</p>'}</div></div>
<div class="form-section"><h3>Associated Supplier Issues</h3><p>These Issues belong to the Supplier company. Contact handover does not duplicate or delete an Issue.</p>${related.length?related.map(i=>`<div class="row-card"><div><h3>${html(i.title)}</h3><p>${html(i.created)} · ${html(i.status)}</p></div><button class="btn btn-sm" data-action="open-issue" data-id="${html(i.id)}">View Supplier Issue</button></div>`).join(''):'<div class="empty-panel">No Supplier Issues Are Linked To This Contact.</div>'}</div>`;
}else if(['add-supplier-note','add-contact-note','edit-supplier-note','edit-contact-note'].includes(kind)){
 const editing=kind.startsWith('edit-'),isContactNote=kind.endsWith('contact-note');
 const contact=isContactNote?findContact(s,editing?contactId:id):null;
 if(isContactNote&&!contact){notify('Contact Not Found');return;}
 const note=editing?(contact||s).notes.find(n=>n.id===id):null;
 if(editing&&!note){notify('Note Not Found');return;}
 title=`${editing?'Edit':'Add'} ${contact?'Contact':'Supplier'} Note`;
 subtitle=contact?`Contact: ${contact.name}`:`Supplier: ${s.name}`;
 submitLabel=editing?'Save Changes':'Save Note';
 content=`<form id="note-form" data-contact-id="${contact?html(contact.id):''}"><div class="field"><label for="note-text">Note *</label><textarea id="note-text" name="noteText" rows="5" required placeholder="Record useful information or a conversation.">${editing?html(note.text):''}</textarea></div></form>`;
}else if(kind==='add-issue'||kind==='open-issue'){
 const editing=kind==='open-issue',i=editing?findIssue(s,id):{title:'',description:'',status:'Open',contactIds:[],created:today(),updates:[]};
 title=editing?'Supplier Issue Details':'Add Supplier Issue';subtitle=editing?`Created ${i.created} · Belongs To ${s.name}`:'Tracked Issues Belong To The Supplier, Not A Contact';submitLabel=editing?'Save Issue Changes':'Add Issue';wide=true;
 content=`<form id="issue-form" data-issue-id="${editing?html(i.id):''}"><div class="field-grid"><div class="field full"><label>Issue Title *</label><input name="issueTitle" required value="${html(i.title)}" placeholder="Damaged Delivery"></div><div class="field"><label>Issue Status</label><select name="status">${['Open','In Progress','Resolved','Closed'].map(v=>`<option value="${v}" ${i.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Main Description *</label><textarea name="description" rows="4" required>${html(i.description)}</textarea></div></div><div class="form-section"><h3>Associated Contacts</h3><p>Link any contacts who are dealing with the issue. The Supplier keeps ownership when those people change.</p><div class="check-grid">${s.contacts.map(c=>`<label class="check-chip"><input type="checkbox" name="issueContacts" value="${html(c.id)}" ${i.contactIds.includes(c.id)?'checked':''}> ${html(c.name)}</label>`).join('')||'<span class="muted small">Add Contacts Before Associating Them With Issues.</span>'}</div></div>${editing?`<div class="form-section"><h3>Chronological Updates</h3>${i.updates.length?i.updates.map(u=>`<div class="issue-update"><strong>${html(u.date)}</strong><p>${html(u.text)}</p></div>`).join(''):'<p class="muted small">No Updates Yet.</p>'}<div class="field" style="margin-top:14px"><label>New Dated Update (Optional)</label><textarea name="newUpdate" placeholder="Record the next update without changing previous entries."></textarea></div></div>`:''}</form>`;
}else if(kind==='categories'){
 title='Manage Supplier Categories';subtitle='Illustrative Administrator Controls';wide=true;
 content=`<p class="description">Administrators can add, rename, archive and reactivate categories. Archived categories remain on existing Suppliers but cannot be selected for new assignments.</p><div class="row-list" style="margin-top:15px">${categories.map(c=>`<div class="row-card"><div style="min-width:130px"><strong>${html(c.name)}</strong><div>${badge(c.active?'Active':'Archived')}</div></div><div class="header-actions"><button class="btn btn-sm" data-action="rename-category" data-id="${html(c.id)}">Rename</button><button class="btn btn-sm" data-action="toggle-category" data-id="${html(c.id)}">${c.active?'Archive':'Reactivate'}</button></div></div>`).join('')}</div><div class="form-section"><h3>Add Category</h3><div class="flex"><input id="new-category-name" class="search grow" maxlength="70" placeholder="Category Name" aria-label="New Category Name"><button class="btn btn-primary" data-action="add-category">${icon('plus')} Add Category</button></div></div><p class="muted tiny" style="margin-top:12px">This is a functional example only; the Category Management screen placement and initial category list have not been visually approved.</p>`;
}else if(kind==='rename-category'){
 const c=categories.find(x=>x.id===id);if(!c)return;
 title='Rename Category';subtitle='Existing Supplier Associations Remain Intact';submitLabel='Save Category';content=`<form id="rename-category-form" data-category-id="${html(c.id)}"><div class="field"><label>Category Name *</label><input name="categoryName" required value="${html(c.name)}"></div></form>`;
}else if(kind==='equipment-details'){
 const e=s.equipment.find(x=>x.id===id);if(!e||!hasVisibleEquipment(e)){notify('Equipment Is Not Available In This Preview');return;}
 title=e.name;subtitle='Canonical Equipment Navigation Example';
 content=`<p class="description">In the finished Caffoot Lite application, this action would open the existing <strong>${html(e.kind)} Details</strong> page, subject to the relevant feature and your permissions.</p><div class="info-row"><span>Type</span><strong>${html(e.type)}</strong></div><div class="info-row"><span>Identifier</span><strong>${html(e.identifier)}</strong></div><div class="info-row"><span>Status</span><strong>${html(e.status)}</strong></div><div class="handback">This is only a navigation illustration. The preview does not invent a parallel equipment details form or change existing Devices or IT Assets.</div>`;
}else if(kind==='archive-supplier'||kind==='reactivate-supplier'){
 title=kind==='archive-supplier'?'Archive Supplier?':'Reactivate Supplier?';subtitle=s.name;
 content=`<p class="description">${kind==='archive-supplier'?'The supplier and its Locations, Contacts, Notes, Issues, category assignments and equipment history will remain available as an archived record.':'The original Supplier record and its history will become active again. No duplicate Supplier will be created.'}</p><div class="form-section"><p class="muted small">This confirmation changes only the preview data.</p></div>`;
 submitLabel=kind==='archive-supplier'?'Archive Supplier':'Reactivate Supplier';
}else{return;}
const formId={ 'add-supplier':'supplier-add-form','edit-supplier':'supplier-edit-form','add-location':'location-form','edit-location':'location-form','add-contact':'contact-form','edit-contact':'contact-form','add-supplier-note':'note-form','add-contact-note':'note-form','edit-supplier-note':'note-form','edit-contact-note':'note-form','add-issue':'issue-form','open-issue':'issue-form','rename-category':'rename-category-form'}[kind];
const root=document.getElementById('modal-root');root.classList.add('open');root.setAttribute('aria-hidden','false');root.dataset.kind=kind;root.dataset.id=id||'';
root.innerHTML=`<div class="modal ${wide?'wide-modal':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-header"><div><h2 id="dialog-title">${html(title)}</h2><p>${html(subtitle)}</p></div><button type="button" class="modal-close" data-action="close-modal" aria-label="Close Dialog">×</button></div><div class="modal-body">${content}</div><div class="modal-footer"><button type="button" class="btn" data-action="close-modal">Close</button>${submitLabel?`<button class="btn btn-primary" type="button" data-action="modal-save">${html(submitLabel)}</button>`:''}</div></div>`;
setTimeout(()=>root.querySelector('input:not([type=checkbox]),textarea,button')?.focus(),0);
}
function categoryChecks(selected){return categories.filter(c=>c.active||selected.includes(c.id)).map(c=>`<label class="check-chip"><input type="checkbox" name="categories" value="${html(c.id)}" ${selected.includes(c.id)?'checked':''} ${!c.active&&!selected.includes(c.id)?'disabled':''}> ${html(c.name)}${c.active?'':' (Archived)'}</label>`).join('')||'<span class="muted small">No Active Categories Yet.</span>';}
function locationChecks(s,selected){return s.locations.map(l=>`<label class="check-chip"><input type="checkbox" name="locations" value="${html(l.id)}" ${selected.includes(l.id)?'checked':''}> ${html(l.name)}</label>`).join('');}
function contactEntry(index){return `<div class="soft-card" data-new-contact style="margin-top:10px"><div class="between"><h4>Contact ${index+1}</h4><button type="button" class="btn btn-sm" data-action="remove-contact-entry">Remove</button></div><div class="field-grid"><div class="field"><label>Contact Name</label><input name="newContactName" placeholder="Contact Name"></div><div class="field"><label>Role / Job Title</label><input name="newContactRole" placeholder="Account Manager"></div><div class="field"><label>Telephone Numbers</label><textarea name="newContactPhones" placeholder="One Per Line"></textarea></div><div class="field"><label>Email Addresses</label><textarea name="newContactEmails" placeholder="One Per Line"></textarea></div><div class="field full"><label>Contact Scope</label><select name="newContactScope"><option value="main">Main Office</option><option value="company">Company-wide</option></select></div></div></div>`;}
function addressFields(l){return `<div class="field full"><label>Address</label><input name="address" value="${html(l.address||'')}"></div><div class="field"><label>Town / City</label><input name="city" value="${html(l.city||'')}"></div><div class="field"><label>Postcode</label><input name="postcode" value="${html(l.postcode||'')}"></div><div class="field full"><label>Country</label><input name="country" value="${html(l.country||'United Kingdom')}"></div>`;}
function closeModal(){const root=document.getElementById('modal-root');root.classList.remove('open');root.innerHTML='';root.removeAttribute('data-kind');root.removeAttribute('data-id');if(lastFocus?.isConnected)lastFocus.focus();}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),3500);}
function getFormData(form){return new FormData(form);}
function values(form,name){return [...form.querySelectorAll(`input[name="${name}"]:checked`)].map(e=>e.value);}
function validateWebsite(raw){const v=tidy(raw);if(!v)return '';try{const u=new URL(v);if(!['https:','http:'].includes(u.protocol))throw new Error('scheme');return u.href;}catch{notify('Enter A Valid Website Address Beginning With https://');return null;}}
function handleSave(){const root=document.getElementById('modal-root'),kind=root.dataset.kind,id=root.dataset.id,s=findSupplier(),form=root.querySelector('form');if(!form&&kind!=='archive-supplier'&&kind!=='reactivate-supplier')return;
 if(form&&!form.reportValidity())return;
 const f=form?getFormData(form):null;
 if(kind==='add-supplier'||kind==='edit-supplier'){
  const name=tidy(f.get('name'));if(!name){notify('Enter A Supplier Name');return;}const website=validateWebsite(f.get('website'));if(website===null)return;
  const address=tidy(f.get('address')),city=tidy(f.get('city')),postcode=tidy(f.get('postcode')),country=tidy(f.get('country'));
  const cats=values(form,'categories');
  if(kind==='add-supplier'){
   const id='s'+Date.now(),mainId='l'+Date.now();const added={id,name,website,description:tidy(f.get('description')),archived:false,categories:cats,mainLocationId:mainId,locations:[{id:mainId,name:'Main Office',address,city,postcode,country}],contacts:[],notes:[],issues:[],equipment:[]};
   const entries=[...form.querySelectorAll('[data-new-contact]')];
   for(const e of entries){const cname=tidy(e.querySelector('[name="newContactName"]').value);if(!cname)continue;const scope=e.querySelector('[name="newContactScope"]').value;added.contacts.push({id:'c'+Date.now()+added.contacts.length,name:cname,role:tidy(e.querySelector('[name="newContactRole"]').value),phones:multiline(e.querySelector('[name="newContactPhones"]').value),emails:multiline(e.querySelector('[name="newContactEmails"]').value),profiles:[],companyWide:scope==='company',locationIds:scope==='main'?[mainId]:[],notes:[]});}
   suppliers.push(added);state.supplierId=added.id;state.tab='overview';state.view='detail';notify('Supplier Added To This Preview');
  }else{if(!s)return;s.name=name;s.website=website;s.description=tidy(f.get('description'));s.categories=cats;Object.assign(findLocation(s,s.mainLocationId),{address,city,postcode,country});notify('Supplier Details Updated In This Preview');}
 }else if(kind==='add-location'||kind==='edit-location'){
  const data={name:tidy(f.get('locationName')),address:tidy(f.get('address')),city:tidy(f.get('city')),postcode:tidy(f.get('postcode')),country:tidy(f.get('country'))};
  if(!data.name){notify('Enter A Location Name');return;}
  if(kind==='add-location')s.locations.push({id:'l'+Date.now(),...data});else Object.assign(findLocation(s,id),data);
  notify('Location Saved In This Preview');
 }else if(kind==='add-contact'||kind==='edit-contact'){
  const cName=tidy(f.get('contactName'));if(!cName){notify('Enter A Contact Name');return;}
  const wide=form.querySelector('[name="companyWide"]').checked;const locations=wide?[]:values(form,'locations');
  const profileLines=multiline(f.get('profiles'));const profiles=[];
  for(const line of profileLines){const chunks=line.split('|');if(chunks.length<2){notify('Use Label | https://example.com For Each Professional Link');return;}const url=validateWebsite(chunks.slice(1).join('|').trim());if(url===null)return;profiles.push({label:chunks[0].trim(),url});}
  const data={name:cName,role:tidy(f.get('role')),phones:multiline(f.get('phones')),emails:multiline(f.get('emails')),profiles,companyWide:wide,locationIds:locations};
  if(kind==='add-contact')s.contacts.push({id:'c'+Date.now(),...data,notes:[]});else Object.assign(findContact(s,id),data);
  notify('Contact Saved In This Preview');
 }else if(kind==='add-supplier-note'||kind==='add-contact-note'){
  const noteText=tidy(f.get('noteText'));if(!noteText){notify('Enter A Note');return;}
  const target=kind==='add-supplier-note'?s:findContact(s,id);target.notes.push({id:'n'+Date.now(),text:noteText,date:today()});notify('Note Saved In This Preview');
 }else if(kind==='edit-supplier-note'||kind==='edit-contact-note'){
  const noteText=tidy(f.get('noteText'));if(!noteText){notify('Enter A Note');return;}
  const target=kind==='edit-supplier-note'?s:findContact(s,form.dataset.contactId);
  const note=target?.notes.find(n=>n.id===id);
  if(!note){notify('Note Not Found');return;}
  note.text=noteText;notify('Note Updated In This Preview');
 }else if(kind==='add-issue'||kind==='open-issue'){
  const data={title:tidy(f.get('issueTitle')),description:tidy(f.get('description')),status:tidy(f.get('status')),contactIds:values(form,'issueContacts')};
  if(!data.title||!data.description){notify('An Issue Title And Description Are Required');return;}
  if(kind==='add-issue'){s.issues.push({id:'i'+Date.now(),...data,created:today(),updates:[]});notify('Supplier Issue Added In This Preview');}
  else{const issue=findIssue(s,id);Object.assign(issue,data);const newUpdate=tidy(f.get('newUpdate'));if(newUpdate)issue.updates.push({date:today(),text:newUpdate});notify('Supplier Issue Updated In This Preview');}
 }else if(kind==='rename-category'){
  const name=tidy(f.get('categoryName'));if(!name){notify('Enter A Category Name');return;}
  if(categories.some(c=>c.id!==id&&c.name.toLowerCase()===name.toLowerCase())){notify('A Category With This Name Already Exists');return;}
  categories.find(c=>c.id===id).name=name;notify('Category Renamed Without Changing Supplier Links');
 }else if(kind==='archive-supplier'||kind==='reactivate-supplier'){
  s.archived=kind==='archive-supplier';notify(s.archived?'Supplier Archived In This Preview':'Supplier Reactivated In This Preview');
 }
 closeModal();render();
}
function handleAction(action,id,el){const s=findSupplier();
 if(action==='close-modal'){closeModal();return;}
 if(action==='back-directory'){state.view='directory';state.tab='overview';render();return;}
 if(action==='open-supplier'){state.supplierId=id;state.view='detail';state.tab='overview';render();return;}
 if(action==='tab'){state.tab=id;render();return;}
 if(action==='notes-view'){state.notesView=id;render();return;}
 if(action==='modal-save'){handleSave();return;}
 if(action==='add-contact-entry'){const root=document.getElementById('new-contact-entries');root.insertAdjacentHTML('beforeend',contactEntry(root.querySelectorAll('[data-new-contact]').length));return;}
 if(action==='remove-contact-entry'){const entry=el.closest('[data-new-contact]');if(entry){entry.remove();}return;}
 if(action==='add-category'){
  const input=document.getElementById('new-category-name'),name=tidy(input?.value);if(!name){notify('Enter A Category Name');return;}
  if(categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){notify('This Category Already Exists');return;}
  categories.push({id:'cat'+Date.now(),name,active:true});notify('Category Added In This Preview');closeModal();render();openModal('categories');return;
 }
 if(action==='toggle-category'){
  const c=categories.find(cat=>cat.id===id);if(!c)return;c.active=!c.active;notify(c.active?'Category Reactivated':'Category Archived; Existing Supplier Links Preserved');closeModal();render();openModal('categories');return;
 }
 if(action==='rename-category'){closeModal();openModal('rename-category',id);return;}
 if(action==='edit-contact'||action==='open-issue'||action==='add-contact-note'||action==='edit-contact-note'||action==='edit-supplier-note'){
  const root=document.getElementById('modal-root');if(root.classList.contains('open'))closeModal();
 }
 if(action==='equipment-details'&&!s.equipment.some(e=>e.id===id&&hasVisibleEquipment(e))){notify('Equipment Is Not Available In This Preview');return;}
 openModal(action,id,el?.dataset.contactId||'');
}
document.addEventListener('click',event=>{
 const clicked=event.target.closest('[data-action]');if(clicked){event.preventDefault();handleAction(clicked.dataset.action,clicked.dataset.id||'',clicked);return;}
 if(event.target.matches('[data-demo-nav]'))notify(`${event.target.dataset.demoNav} Is Outside This Supplier Review Preview`);
 if(event.target.id==='navigation-suppliers'){state.view='directory';render();}
 if(event.target.id==='modal-root')closeModal();
});
document.addEventListener('input',event=>{
 const v=event.target;
 if(v.id==='supplier-search'){const start=v.selectionStart;state.search=v.value;render();const i=document.getElementById('supplier-search');i.focus();i.setSelectionRange(start,start);}
 if(v.id==='contact-search'){const start=v.selectionStart;state.contactsSearch=v.value;render();const i=document.getElementById('contact-search');i.focus();i.setSelectionRange(start,start);}
});
document.addEventListener('change',event=>{
 const v=event.target;
 const mappings={'supplier-category-filter':'category','contact-location-filter':'contactsLocation','notes-owner-filter':'notesFilter','issue-status-filter':'issueStatus','equipment-type-filter':'equipmentType'};
 if(mappings[v.id]){state[mappings[v.id]]=v.value;render();}
 if(v.id==='show-devices'||v.id==='show-assets'){state[v.id==='show-devices'?'devicesVisible':'assetsVisible']=v.checked;state.equipmentType='all';render();}
 if(v.id==='contact-company-wide'){const container=document.getElementById('contact-location-choices');if(container){container.style.opacity=v.checked?'.4':'1';container.querySelectorAll('input').forEach(i=>i.disabled=v.checked);}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal-root').classList.contains('open'))closeModal();});
render();document.querySelectorAll('.sidebar [data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon,19));
</script>
</body>
