 <div class="nav-group"><div class="nav-parent-row"><button class="nav-item nav-parent" id="it-nav" type="button" aria-expanded="true" aria-controls="it-children" data-page="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 4a6 6 0 0 0-7 7L2 16l6 6 5-5a6 6 0 0 0 7-7l-5 4-5-5Z"/></svg><span class="nav-text">IT</span></button><button type="button" class="nav-toggle" id="it-toggle" data-toggle-group="it" aria-expanded="true" aria-controls="it-children" aria-label="Collapse IT submenu"><span aria-hidden="true">›</span></button></div><div class="nav-children" id="it-children"><button type="button" class="nav-sub" data-page="it-child" data-label="Devices">Devices</button><button type="button" class="nav-sub" data-page="it-child" data-label="IT Assets">IT Assets</button><button type="button" class="nav-sub" data-page="it-child" data-label="IPAM">IPAM</button><button type="button" class="nav-sub" data-page="it-child" data-label="Network Racks">Network Racks</button></div></div>

</aside>
<div class="workspace"><header class="topbar"><button type="button" id="mobile-nav-toggle" class="mobile-menu-button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="purchasing-children">☰</button><div class="crumb"><span>Caffoot Lite</span><span aria-hidden="true">›</span><span id="crumb-section">Purchasing</span><span aria-hidden="true">›</span><b id="crumb-page">Dashboard</b></div><div class="top-right"><span class="role">Preview Administrator</span><span class="topavatar">DA</span></div></header><main class="main" id="main-content" tabindex="-1"></main></div>
</div>
<div class="modal-back" id="modal-root" hidden role="presentation"></div>
<script>
'use strict';
// The sample records below are fiction. They are never imported, saved or sent.
const demoSuppliers=[
 {id:'s1',name:'Northbridge Technology Ltd',archived:false,disabled:false},
 {id:'s2',name:'Ainsworth Office Supplies',archived:false,disabled:false},
 {id:'s3',name:'Eastmoor Business IT',archived:false,disabled:false},
 {id:'s4',name:'Langford AV Solutions',archived:false,disabled:false},
 {id:'s5',name:'Westgate Electrical',archived:false,disabled:false},
 {id:'s6',name:'Brookside Furniture',archived:false,disabled:false},
 {id:'s7',name:'Mersey Cloud Services',archived:false,disabled:false},
 {id:'s8',name:'Vale Print & Imaging',archived:false,disabled:false},
 {id:'s9',name:'Ashton Network Services',archived:true,disabled:false},
 {id:'s10',name:'Harrow Computer Services',archived:false,disabled:true},
 {id:'s11',name:'Crescent Data UK',archived:false,disabled:false}
];
const demoIssues=[
 {id:'i1',title:'Damaged monitor received',supplierId:'s1',category:'Delivery & Damage',status:'Open',updated:'2026-11-17T15:10:00',description:'A monitor arrived with a cracked panel. Awaiting supplier response.'},
 {id:'i2',title:'Incorrect licence renewal',supplierId:'s7',category:'Billing',status:'In Progress',updated:'2026-11-16T11:35:00',description:'The renewal invoice does not match the agreed licence quantity.'},
 {id:'i3',title:'Missing docking stations',supplierId:'s2',category:'Delivery',status:'Open',updated:'2026-11-15T14:02:00',description:'Two docking stations were absent from the shipment.'},
 {id:'i4',title:'Warranty replacement query',supplierId:'s8',category:'Warranty',status:'In Progress',updated:'2026-11-13T16:20:00',description:'Awaiting confirmation of replacement arrangements.'},
 {id:'i5',title:'Delayed network switches',supplierId:'s9',category:'Delivery',status:'Open',updated:'2026-11-12T09:45:00',description:'Delivery date has passed and a revised date is required.'},
 {id:'i6',title:'Awaiting revised service quote',supplierId:'s6',category:'Service',status:'In Progress',updated:'2026-11-11T15:20:00',description:'Supplier has agreed to send a corrected service quotation.'},
 {id:'i7',title:'Credit note received',supplierId:'s5',category:'Billing',status:'Resolved',updated:'2026-11-10T12:40:00',description:'Credit note has been supplied; awaiting final verification.'},
 {id:'i8',title:'Contract update completed',supplierId:'s3',category:'Contract',status:'Closed',updated:'2026-11-08T09:30:00',description:'Amendment accepted and matter closed.'},
 {id:'i9',title:'Printer cartridge mismatch',supplierId:'s8',category:'Incorrect Item',status:'Closed',updated:'2026-11-06T13:50:00',description:'Correct cartridges delivered and accepted.'},
 {id:'i10',title:'Damaged parcel replacement',supplierId:'s1',category:'Delivery & Damage',status:'Resolved',updated:'2026-11-03T11:10:00',description:'Replacement arrived; final check outstanding.'}
];
const state={page:'purchasing',scenario:'sample',access:'read',theme:'light',mobileMenu:false,selected:null};
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={supplier:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1"/>',check:'<path d="m5 12 5 5L20 7"/>',alert:'<path d="M12 3 2 21h20L12 3Zm0 6v5m0 4h.01"/>',history:'<path d="M3 11a9 9 0 1 1 2.5 6.5M3 4v7h7M12 7v5l3 2"/>',issue:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',folder:'<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 9V4h7l2 2"/>'};
const svg=name=>`<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true">${icons[name]}</svg>`;
const iconWrap=(name,tone='')=>`<span class="iconwrap ${tone}">${svg(name)}</span>`;
const statuses=['Open','In Progress','Resolved','Closed'];
const statusClass=s=>({'Open':'status-open','In Progress':'status-progress','Resolved':'status-resolved','Closed':'status-closed'}[s]||'');
const supplierName=id=>demoSuppliers.find(s=>s.id===id)?.name||'Unknown';
const datefmt=x=>new Date(x).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London',hour12:false});
function sample(){
 if(state.scenario==='empty')return {suppliers:[],issues:[]};
 if(state.scenario==='few')return {suppliers:demoSuppliers.slice(0,2),issues:[demoIssues[0],demoIssues[6]]};
 return {suppliers:demoSuppliers,issues:demoIssues};
}
function accessible(){return state.access==='read'||state.access==='edit'}
function setNavGroup(id,expanded){const b=el(id+'-nav'),p=el(id+'-children'),toggle=el(id+'-toggle');if(!b||!p)return;b.setAttribute('aria-expanded',String(expanded));p.hidden=!expanded;if(toggle){toggle.setAttribute('aria-expanded',String(expanded));toggle.setAttribute('aria-label',(expanded?'Collapse ':'Expand ')+(id==='it'?'IT':'Purchasing')+' submenu')}}
function setMobileNav(open){document.querySelector('.sidebar').classList.toggle('mobile-open',open);el('nav-scrim').classList.toggle('open',open);el('mobile-nav-toggle').setAttribute('aria-expanded',String(open));el('mobile-nav-toggle').setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu');}
function pageGo(page,label){
 if(page==='purchasing'&&!accessible())return;
 if(page==='suppliers'&&!accessible())return;
 if(page==='it'){setNavGroup('it',true);state.page='it';}
 else if(page==='purchasing'){setNavGroup('purchasing',true);state.page='purchasing';}
 else if(page==='staff'){setNavGroup('staff',el('staff-nav').getAttribute('aria-expanded')==='false');return}
 else {state.page=page;state.selected=label||null;}
 if(page!=='purchasing'&&page!=='it')setMobileNav(false);
 render();
}
function syncNav(){
 el('purchasing-group').hidden=!accessible();
 for(const b of document.querySelectorAll('.sidebar [data-page]')){const samePage=b.dataset.page===state.page;const distinctChild=['it-child','staff-child','other'].includes(b.dataset.page);const active=(samePage&&(!distinctChild||b.dataset.label===state.selected))||((state.page==='issues'||state.page==='issue')&&b.dataset.page==='purchasing');b.classList.toggle('current',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}
 el('crumb-section').textContent=state.page==='it'||state.page==='it-child'?'IT':state.page==='staff-child'?'Staff':state.page==='other'?'Workspace':'Purchasing';
 el('crumb-page').textContent=state.page==='purchasing'?'Dashboard':state.page==='it'?'Dashboard':state.page==='suppliers'?'Suppliers':state.page==='issues'?'Issues':state.page==='issue'?'Issue Details':state.selected||'Dashboard';
}
function metric(label,value,sub,iconName,tone,target){return `<button type="button" class="db-metric" data-go="${target}" aria-label="${esc(label)}: ${value}. Open ${target==='suppliers'?'Suppliers':'Issues'} view"><span class="db-metric-head">${esc(label)}${iconWrap(iconName,tone)}</span><strong>${value}</strong><small>${esc(sub)}</small></button>`}
function recentRows(issues){return issues.map(i=>`<tr><td data-label="Issue"><button type="button" class="row-link" data-issue="${i.id}">${esc(i.title)}</button></td><td data-label="Supplier">${esc(supplierName(i.supplierId))}</td><td data-label="Category">${esc(i.category||'—')}</td><td data-label="Status" class="table-status"><span class="status-pill ${statusClass(i.status)}">${esc(i.status)}</span></td><td data-label="Updated"><span class="updated-date">${datefmt(i.updated).split(', ').map(esc).join('<br>')}</span></td></tr>`).join('')}
function renderDashboard(){
 const {suppliers,issues}=sample();const available=suppliers.filter(s=>!s.archived&&!s.disabled).length;
 const counts=Object.fromEntries(statuses.map(s=>[s,issues.filter(i=>i.status===s).length]));
 const recent=issues.filter(i=>i.status==='Open'||i.status==='In Progress').sort((a,b)=>b.updated.localeCompare(a.updated));
 // Six rows form this sample's natural active set. Actual display count is owner-reviewed and flexible.
 const shown=recent.slice(0,6);const total=issues.length;
 return `<div class="eyebrow">PURCHASING AT A GLANCE</div><div class="header"><div><h1>Purchasing Dashboard</h1><p>An organised view of your Suppliers and current Supplier Issues.</p></div><span class="version">Suppliers · Stage 4</span></div>
 <div class="review-note" role="note"><b>Design preview only.</b> The numbers and Supplier Issues below are fictional examples used to review the layout, not values from Caffoot Lite. Navigation opens review-only destinations. Switching Devices or IT Assets off does not change Supplier totals.</div>
 <section class="db-summary" aria-label="Purchasing summary">${metric('Total Suppliers',suppliers.length,'All retained Supplier records','supplier','','suppliers')}${metric('Available Suppliers',available,'Neither archived nor disabled','check','green','suppliers')}${metric('Open Supplier Issues',counts.Open,'Issues requiring attention','alert','orange','issues')}${metric('Issues In Progress',counts['In Progress'],'Issues currently being handled','history','','issues')}</section>
 <div class="db-two"><div class="db-stack"><section class="card db-card" aria-labelledby="recent-title"><div class="card-head">${iconWrap('issue','orange')}<div><h3 id="recent-title">Recent Supplier Issues</h3><p class="sub">Open and In Progress only, most recently updated first.</p></div></div><div class="divider"></div>
 ${shown.length?`<div class="table-scroll" role="region" aria-label="Recent Supplier Issues table" tabindex="0"><table class="data-table"><thead><tr><th scope="col">Issue</th><th scope="col">Supplier</th><th scope="col">Category</th><th scope="col">Status</th><th scope="col">Last Updated</th></tr></thead><tbody>${recentRows(shown)}</tbody></table></div>`:`<div class="empty-panel"><strong>No active Supplier Issues</strong>There are no Open or In Progress Issues to display.</div>`}
 <div class="db-actionrow"><button type="button" class="btn" data-go="issues">View All Issues</button></div><p class="section-note">${shown.length?`${shown.length} active ${shown.length===1?'Issue':'Issues'} shown in this demonstration. Display count remains adjustable during design approval.`:'Resolved and Closed Issues, if any, remain in the full Issues view.'}</p></section></div>
 <div class="db-stack"><section class="card db-card" aria-labelledby="status-title"><div class="card-head">${iconWrap('history')}<div><h3 id="status-title">Supplier Issue Status</h3><p class="sub">Current status of all ${total} ${total===1?'tracked Issue':'tracked Issues'}.</p></div></div><div class="divider"></div><div aria-label="Issue status breakdown">${statuses.map(s=>{const c=counts[s],kind={'Open':'open','In Progress':'progress','Resolved':'resolved','Closed':'closed'}[s];return `<div class="status-item" data-status="${kind}"><div class="status-head"><span><span class="status-dot ${kind}" aria-hidden="true"></span>${esc(s)}</span><strong>${c}</strong></div><div class="db-bar" role="progressbar" aria-label="${s}: ${c} of ${total} Issues" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${c}"><span style="width:${total?Math.round(100*c/total):0}%"></span></div></div>`}).join('')}</div><p class="section-note">Each Issue is counted once, using its current status. Resolved and Closed do not appear in the Recent Supplier Issues table.</p></section>
 <section class="card db-card" aria-labelledby="links-title"><div class="card-head">${iconWrap('folder','orange')}<div><h3 id="links-title">Quick Access</h3><p class="sub">Open the existing Supplier and Issue destinations.</p></div></div><div class="divider"></div><div class="quick-actions"><button type="button" class="btn" data-go="suppliers">View Suppliers</button><button type="button" class="btn" data-go="issues">View All Issues</button></div></section></div></div><footer class="footer"><span>Caffoot Lite · Infrastructure, Simplified.</span><span>Purchasing Dashboard · Design preview, not application implementation</span></footer>`;
}
function renderIssues(){const {issues}=sample();return `<div class="eyebrow">SUPPLIERS / ISSUES</div><div class="header"><div><h1>Supplier Issues</h1><p>This is a read-only route demonstration, not a proposed replacement for the approved Supplier Issues screens.</p></div><button class="btn" data-go="purchasing">Back to Purchasing Dashboard</button></div><div class="review-note"><b>Navigation-only preview.</b> The real View All Issues action must open the approved full Supplier Issues view, where all four statuses and its existing filters remain available.</div><section class="card db-card"><div class="card-head">${iconWrap('issue','orange')}<div><h3>Example Issues</h3><p class="sub">All four statuses are included here to demonstrate the destination.</p></div></div><div class="divider"></div><div class="controls-row"><input class="filter full-search" id="issue-search" type="search" placeholder="Search example Issues" aria-label="Search example Issues"><select class="filter" id="issue-status"><option value="all">All statuses</option>${statuses.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div><div id="all-issue-rows">${renderAllRows(issues)}</div></section>`}
function renderAllRows(issues){const q=el('issue-search')?.value.toLowerCase()||'',status=el('issue-status')?.value||'all';const visible=issues.filter(i=>(status==='all'||i.status===status)&&(`${i.title} ${i.category} ${supplierName(i.supplierId)}`.toLowerCase().includes(q))).sort((a,b)=>b.updated.localeCompare(a.updated));return visible.length?`<div class="table-scroll" role="region" tabindex="0" aria-label="All Supplier Issues example"><table class="data-table"><thead><tr><th>Issue</th><th>Supplier</th><th>Category</th><th>Status</th><th>Last Updated</th></tr></thead><tbody>${recentRows(visible)}</tbody></table></div>`:'<div class="no-results">No example Issues match these filters.</div>'}
const approvedSupplierPreview='https://github.com/Caffoot/Caffoot-Lite/blob/docs/milestone-01-stage-2-3-previews/future-design/stage-4-previews/caffoot-suppliers-stage-4-interactive-preview-edit-notes.html';
function placeholder(title,sub,desc,link){return `<div class="eyebrow">NAVIGATION REVIEW</div><div class="header"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><button class="btn" data-go="purchasing">Back to Purchasing Dashboard</button></div><section class="card ghost-panel"><h2>Approved destination retained</h2><p>${esc(desc)}</p>${link?`<a class="btn" target="_blank" rel="noopener noreferrer" href="${approvedSupplierPreview}">View approved Supplier HTML source on GitHub</a>`:''}<p class="db-muted">This standalone Dashboard preview deliberately does not redesign or reproduce the existing approved destination.</p></section>`}
function render(){syncNav();let page=state.page,main=el('main-content');
 if((page==='purchasing'||page==='suppliers'||page==='issues')&&!accessible()){main.innerHTML=`<div class="eyebrow">PURCHASING</div><div class="header"><div><h1>Purchasing Dashboard</h1></div></div><section class="denied"><h2>${state.access==='off'?'Suppliers is disabled':'Access unavailable'}</h2><p>${state.access==='off'?'The Suppliers feature is switched off. The Purchasing Dashboard and Supplier records are not available.':'The current user does not have effective Suppliers Read permission. No Supplier counts or Issues are displayed.'}</p></section>`;return}
 if(page==='purchasing')main.innerHTML=renderDashboard();
 else if(page==='issues')main.innerHTML=renderIssues();
 else if(page==='suppliers')main.innerHTML=placeholder('Suppliers','Approved searchable Supplier Directory.','The Suppliers sidebar entry must open the previously approved searchable Supplier Directory. Its layouts and Add Supplier form remain unchanged.',true);
 else if(page==='it')main.innerHTML=placeholder('IT Dashboard','Existing infrastructure Dashboard (Devices, IPAM and Network Racks).','Selecting IT opens the unchanged existing infrastructure Dashboard and expands its subsections. That original Dashboard is deliberately not duplicated in this Purchasing-only design review.',false);
 else main.innerHTML=placeholder(esc(state.selected||'Existing section'),'Existing application destination.','The approved application screen is retained; this preview demonstrates sidebar navigation only.',false);
}
function issueModal(id){if(!accessible())return;const i=sample().issues.find(i=>i.id===id);if(!i)return;const root=el('modal-root');root.hidden=false;root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">SUPPLIER ISSUE · DESIGN REVIEW</div><h2 id="modal-title">${esc(i.title)}</h2><p>Navigation demonstration only · sample record</p></div><button class="close-btn" type="button" data-close="true" aria-label="Close Issue Details">×</button></div><div class="modal-body"><div class="review-note">The real application must open the <b>canonical Supplier Issue Details</b> here. This read-only example is not a redesign of that approved screen.</div><div class="detail-grid"><span>Supplier</span><strong>${esc(supplierName(i.supplierId))}</strong></div><div class="detail-grid"><span>Category</span><strong>${esc(i.category||'—')}</strong></div><div class="detail-grid"><span>Current status</span><strong><span class="status-pill ${statusClass(i.status)}">${esc(i.status)}</span></strong></div><div class="detail-grid"><span>Last updated</span><strong>${esc(datefmt(i.updated))}</strong></div><div class="detail-grid"><span>Description</span><strong>${esc(i.description)}</strong></div></div><div class="modal-actions"><button type="button" class="btn" data-close="true">Close</button></div></div>`;root.querySelector('[data-close]').focus();}
function closeModal(){const root=el('modal-root');root.hidden=true;root.innerHTML='';}
for(const id of ['scenario','access'])el(id).addEventListener('change',e=>{state[id]=e.target.value; if(!accessible()&&['purchasing','suppliers','issues'].includes(state.page))state.page='purchasing';render()});
el('theme').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';document.documentElement.classList.toggle('dark',state.theme==='dark');el('theme').textContent=state.theme==='light'?'Dark mode':'Light mode';el('theme').setAttribute('aria-pressed',state.theme==='dark'?'true':'false')});
for(const id of ['devices','assets'])el(id).addEventListener('change',()=>{render()});
// All navigation clicks are local-only preview interactions.
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.close){closeModal();return}if(t.dataset.issue){issueModal(t.dataset.issue);return}if(t.dataset.go){pageGo(t.dataset.go);return}if(t.dataset.toggleGroup){const group=t.dataset.toggleGroup;setNavGroup(group,el(group+'-nav').getAttribute('aria-expanded')==='false');return}if(t.dataset.page){pageGo(t.dataset.page,t.dataset.label);return}if(t.id==='mobile-nav-toggle'){setMobileNav(!document.querySelector('.sidebar').classList.contains('mobile-open'));return}if(t.id==='sidebar-toggle'){if(window.innerWidth<=780){setMobileNav(!document.querySelector('.sidebar').classList.contains('mobile-open'))}else{document.querySelector('.shell').classList.toggle('sidebar-collapsed')}return}});
document.addEventListener('input',e=>{if(e.target.id==='issue-search'&&state.page==='issues')el('all-issue-rows').innerHTML=renderAllRows(sample().issues)});
document.addEventListener('change',e=>{if(e.target.id==='issue-status'&&state.page==='issues')el('all-issue-rows').innerHTML=renderAllRows(sample().issues)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!el('modal-root').hidden)closeModal();else setMobileNav(false)}});
el('nav-scrim').addEventListener('click',()=>setMobileNav(false));
el('modal-root').addEventListener('click',e=>{if(e.target===el('modal-root'))closeModal()});
render();
</script>
</body>
</html>
