    <section class="account-panel" data-section="help" role="tabpanel"><div class="account-grid"><div class="card card-padded"><h3>Quick Help</h3><p class="sub">Select a topic to expand its instructions.</p><div style="display:grid;gap:11px;margin-top:18px">
<div class="expander open"><button data-action="toggle-account-help">Getting Started <span>⌄</span></button><div class="body">Create your administrator on first run and enrol MFA. Then use Devices, IPAM and Network Racks. Authorised users work from the same central inventory.<div><a class="inline-link" target="_blank" rel="noopener noreferrer" href="https://github.com/Caffoot/Caffoot-Lite/blob/main/docs/how-tos/features-and-instructions/Getting-Started.md">Read Getting Started Guide ↗</a></div></div></div>
<div class="expander"><button data-action="toggle-account-help">Import From v1.3.3 <span>⌄</span></button><div class="body">Choose a fresh published v1.3.3 JSON export, review required corrections and explicitly confirm replacement. This is a one-way migration, not an ongoing database backup.<div><a class="inline-link" target="_blank" rel="noopener noreferrer" href="https://github.com/Caffoot/Caffoot-Lite/blob/main/docs/how-tos/features-and-instructions/Migration-Backup-and-Restore.md">Read Migration Guide ↗</a></div></div></div>
<div class="expander"><button data-action="toggle-account-help">Devices, IPAM And Racks <span>⌄</span></button><div class="body">Manage devices, primary IP assignments, subnets, VLANs, racks and accessories. Device editing reserves that device for one user at a time.<div><a class="inline-link" target="_blank" rel="noopener noreferrer" href="https://github.com/Caffoot/Caffoot-Lite/blob/main/docs/how-tos/features-and-instructions/Devices.md">Read Devices Guide ↗</a> <a class="inline-link" target="_blank" rel="noopener noreferrer" href="https://github.com/Caffoot/Caffoot-Lite/blob/main/docs/how-tos/features-and-instructions/IPAM.md">Read IPAM Guide ↗</a> <a class="inline-link" target="_blank" rel="noopener noreferrer" href="https://github.com/Caffoot/Caffoot-Lite/blob/main/docs/how-tos/features-and-instructions/Racks.md">Read Racks Guide ↗</a></div></div></div>
<div class="expander"><button data-action="toggle-account-help">Users And MFA <span>⌄</span></button><div class="body">New users have no access until permissions are granted. MFA is required for editing and administration.<div><a class="inline-link" target="_blank" rel="noopener noreferrer" href="https://github.com/Caffoot/Caffoot-Lite/blob/main/docs/how-tos/features-and-instructions/Users-Permissions-and-MFA.md">Read Users And MFA Guide ↗</a></div></div></div>
<div class="expander"><button data-action="toggle-account-help">Database Backup And Recovery <span>⌄</span></button><div class="body">Back up your complete persistent Docker data volume, including SQLite and security configuration. Do not change existing volume mappings.<div><a class="inline-link" target="_blank" rel="noopener noreferrer" href="https://github.com/Caffoot/Caffoot-Lite/blob/main/docs/how-tos/features-and-instructions/Migration-Backup-and-Restore.md">Read Backup And Restore Guide ↗</a></div></div></div>
<div class="expander"><button data-action="toggle-account-help">Appearance <span>⌄</span></button><div class="body">Light, Dark and System preferences remain local to this browser.<div><a class="inline-link" target="_blank" rel="noopener noreferrer" href="https://github.com/Caffoot/Caffoot-Lite/blob/main/docs/how-tos/features-and-instructions/Settings-and-Change-History.md">Read Settings Guide ↗</a></div></div></div>
      </div></div><div style="display:grid;gap:17px;align-content:start"><div class="card card-padded"><div class="card-head"><span class="iconwrap orange"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-info"/></svg></span><div><h3>Full User Documentation</h3><p class="sub">Long-form guides covering Caffoot Lite's existing features.</p></div></div><p class="sub" style="margin:16px 0">Browse the detailed getting-started, device, IPAM, rack, user and security guides.</p><a class="btn btn-primary" target="_blank" rel="noopener noreferrer" style="text-decoration:none" href="https://github.com/Caffoot/Caffoot-Lite/tree/main/docs/How%20To%27s/Features%20and%20Instructions">Open Full Guides ↗</a></div><div class="soft-card"><h4>Help Available To Everyone</h4><p>Read-only users can access personal security and help without administrator privileges.</p></div></div></div>
     </section>
    <section class="account-panel" data-section="about" role="tabpanel"><div class="account-grid"><div class="card card-padded"><div class="card-head"><span class="iconwrap orange"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-box"/></svg></span><div><h3>Caffoot Lite</h3><p class="sub"><strong>Simplicity in everything.</strong><br>Your infrastructure. Your users. Your data.</p></div></div><p class="import-body">Caffoot Lite is an open-source, self-hosted tool for documenting IP addresses, devices and racks, designed for homelabs and small teams.</p><div class="divider"></div><div class="info-row"><label>Published Release</label><b>v2.1</b></div><div class="info-row"><label>Deployment</label><b>Docker / SQLite</b></div><div class="info-row"><label>Source &amp; Licence</label><b>Available On GitHub</b></div></div><div style="display:grid;gap:17px;align-content:start"><div class="card card-padded"><h3>Official Resources</h3><div style="display:grid;gap:10px;margin-top:16px"><a class="btn btn-outline" style="text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://github.com/Caffoot/Caffoot-Lite">GitHub Repository ↗</a><a class="btn btn-outline" style="text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://caffoot.co.uk">Caffoot Website ↗</a><a class="btn btn-outline" style="text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://github.com/Caffoot/Caffoot-Lite/releases">Releases &amp; Notes ↗</a></div></div><div class="soft-card"><h4>Software Licences</h4><p>Read the included project and third-party licence notices without an internet connection.</p><button type="button" class="btn btn-outline" data-action="caffoot-licences">Software Licences</button><p class="sub"></p></div></div></div></section>
